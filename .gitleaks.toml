# Gitleaks config (single SSOT, like osv-scanner.toml). Extends the default ruleset; the allowlists below
# suppress known-safe patterns so the secret scan is signal, not noise. Add a NARROW entry (with a reason)
# when a real false positive appears — never broaden to whole product directories that could hide a real leak.
#
# INFRA-060 — the allowlist used to be a SINGLE global block whose `paths` list covered every test, e2e,
# fixture and evals path in the repo. That suppressed EVERY rule in those paths, not just the noisy one.
# Measured with the then-pinned gitleaks 8.21.2: a `ghp_…` GitHub PAT planted in
# `packages/agent-core/src/__tests__/` was reported as a CLEAN scan, while the identical line in a sibling
# `src/` file was caught. A committed secret is irreversible, and "it was only in a test file" does not
# un-leak it.
#
# The suppression is now scoped to the ONE rule that produced the noise. Measured over the whole worktree
# (`gitleaks detect --no-git`): the broad path allowlist was hiding exactly 6 findings, all of them
# `generic-api-key` on deterministic fixture tokens. Scoping to `targetRules = ["generic-api-key"]` keeps all
# 6 suppressed (0 findings on a clean tree) while every high-confidence credential rule — github-pat, private
# keys, provider API keys, cloud tokens — now fires in test paths too.
#
# VERSION FLOOR: the `[[allowlists]]` array form and `targetRules` are silently IGNORED by older gitleaks —
# no error, no warning, the keys are simply dropped. Verified directly: on 8.21.2 an `[[allowlists]]` block
# excluding a path did not exclude it; on 8.30.1 it did. `.github/workflows/gitleaks.yml` therefore pins
# 8.30.1. A DOWNGRADE fails loudly (the fixture suppressions stop applying and the scan reports the 6 known
# fixtures) rather than silently weakening the scan, so the dangerous direction is fenced by that asymmetry.

[extend]
useDefault = true

[[allowlists]]
description = "Global — env-reference placeholders, obvious sample keys, and build output (not source)"
# `$ENV:<NAME>` is the agent-core environment-reference format (a placeholder, never a literal secret), and
# obvious example/placeholder keys used in docs/config samples.
regexes = [
  '''\$ENV:[A-Z0-9_]+''',
  '''(?i)(example|placeholder|dummy|fake|test|your-?)[-_]?(api[-_]?key|token|secret)''',
  '''sk-(ant-)?(example|test|placeholder|xxx)[A-Za-z0-9-]*''',
]
# Build outputs and vendored trees are not source: dist/ and the Electron release bundle contain third-party
# JWTs, and pnpm-lock.yaml carries integrity hashes that look like high-entropy secrets.
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)release/''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''\.asar$''',
]

[[allowlists]]
description = "generic-api-key ONLY — deterministic fixture tokens in test/e2e/evals paths"
# `generic-api-key` is gitleaks' broad heuristic rule (any `token = "<entropy>"`-shaped assignment). Test
# doubles, e2e scripts and evals scenarios embed FAKE tokens to drive the scripted provider, permission and
# transport-auth paths, so this one rule is noise there — and only there. Every other rule still applies to
# these paths: a real credential committed into a test file is a finding, which is the whole point of the
# INFRA-060 narrowing.
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)__tests__/''',
  '''(^|/)__fixtures__/''',
  '''(^|/)e2e/''',
  '''\.test\.(ts|tsx|js|mjs|cjs)$''',
  '''\.bintest\.ts$''',
  '''(^|/)\.agents/evals/''',
]
