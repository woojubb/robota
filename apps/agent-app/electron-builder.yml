# GUI-003 — electron-builder config for the generated desktop product.
# Bundles the selected host-arch CLI runtime (copied to resources-bin/ by scripts/bundle-runtime.mjs) as an
# extraResource, so the installed app is self-contained (zero external install).
#
# electron-builder is pinned EXACTLY (not `^`) in package.json, deliberately. Within the 26.15 patch line
# alone, two artifact-corrupting regressions shipped as ordinary patches and were fixed several releases
# later: 26.15.0–26.15.3 dereferenced symlinks after a bundled 7-Zip upgrade, corrupting macOS `.framework`
# bundles (breaking codesign and Squirrel.Mac auto-update), and 26.15.0–26.15.6 packed snap templates so the
# snap built fine but failed at launch. Both produced a GREEN build and a broken artifact — the failure mode
# a caret range cannot protect against, and one CI would not catch either. Bump this deliberately, and read
# the changelog for the range you are crossing.
#
# When upgrading, audit the config against the published JSON Schema diff rather than the release notes:
#   https://unpkg.com/app-builder-lib@<version>/scheme.json
# The project's release notes under-report key-level removals (25→26 dropped `includeSubNodeModules` and
# `win.signDlls` without naming either), and there is no official 25→26 migration guide at all.
# Known v27 blocker: `dmg.filesystem` default flips HFS+ → APFS; set it explicitly before that upgrade.
# These placeholders are filled from the selected product config in a generated workspace.
appId: '__PRODUCT_APP_ID__'
productName: '__PRODUCT_DISPLAY_NAME__'
artifactName: '__PRODUCT_DESKTOP_ARTIFACT_PREFIX__-${version}-${arch}.${ext}'
executableName: '__PRODUCT_DESKTOP_APP_EXECUTABLE__'
# The app has NO native node modules (renderer + electron main + a bundled external runtime binary), and pnpm's
# non-flat store confuses @electron/rebuild's dep walk — skip the native rebuild entirely.
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  # The single configured host binary produced by bundle-runtime.mjs.
  - from: resources-bin
    to: .
# Electron fuses, flipped on the packaged binary right before electron-builder signs it (a flip invalidates the
# signature, so this is a package-time step; it cannot be a runtime option). The main process holds the remote
# credentials, so a program running as the same OS user must not be able to borrow the signed app: no
# ELECTRON_RUN_AS_NODE interpreter, no NODE_OPTIONS / NODE_EXTRA_CA_CERTS injection (the remote runtime takes an
# explicit owner-checked CA file instead), no --inspect or SIGUSR1 inspector attach, and app code is loaded only from
# the integrity-checked app.asar. The bundled runtime under extraResources is not app code and is unaffected.
# Chromium remote debugging has no fuse: the packaged main process refuses to start when asked for it
# (electron/launch-guard.ts). e2e/electron-fuses.mjs holds the intended values; CI reads them back from the binary.
# Left at Electron's defaults on purpose:
#  - grantFileProtocolExtraPrivileges: the window loads the renderer with loadFile (file://), and turning this off changes
#    what that page may load. Turn it off only after the renderer is served from a custom protocol and exercised there.
#  - enableCookieEncryption: the app sets no cookies, and enabling it is a one-way store change that adds an OS
#    keychain dependency.
# resetAdHocDarwinSignature: a signed build is re-signed right after the flip (the release forces code signing), but an
# unsigned Apple Silicon build is not, and the flip breaks Electron's stock ad-hoc signature, so macOS kills it at
# launch. The ad-hoc pass is redundant for a signed build and leaves the Bun runtime's own signature alone.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  resetAdHocDarwinSignature: true
linux:
  description: '__PRODUCT_DISPLAY_NAME__ desktop app'
  target:
    - AppImage
    - deb
  category: Development
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  type: distribution
  hardenedRuntime: true
  notarize: true
  # The release signs the Bun sidecar first with Bun's own JIT entitlements; preserve that signature.
  signIgnore:
    - '/Contents/Resources/__PRODUCT_DESKTOP_EXECUTABLE__$'
win:
  target:
    - nsis
