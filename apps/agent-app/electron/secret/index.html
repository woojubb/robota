<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unlock secure conversations</title>
    <link rel="stylesheet" href="./secret.css">
    <script defer src="./secret.js"></script>
  </head>
  <body>
    <main>
      <h1>Unlock secure conversations</h1>
      <form id="secret-form">
        <label for="secret-type">Use</label>
        <select id="secret-type">
          <option value="passphrase">Passphrase</option>
          <option value="recovery">Recovery key</option>
        </select>
        <label for="secret-value">Passphrase or recovery key</label>
        <input id="secret-value" type="password" autocomplete="off" required autofocus>
        <div class="actions">
          <button id="cancel" type="button">Cancel</button>
          <button type="submit">Unlock</button>
        </div>
      </form>
    </main>
  </body>
</html>
