name: 'Agent Action'
description: 'Run the configured coding assistant on a task in a workflow'
branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  package-scope:
    description: 'Configured product package scope'
    required: true
  cli-name:
    description: 'Configured installed CLI command name'
    required: true
  task:
    description: 'The task or prompt to send to the agent'
    required: true
  model:
    description: 'AI model to use (e.g. claude-sonnet-4-6)'
    required: false
  api-key:
    description: 'Anthropic API key (prefer using secrets)'
    required: false
  output:
    description: 'Output format: text | json | stream-json'
    required: false
    default: 'text'
  max-turns:
    description: 'Maximum agent turns'
    required: false
  load-project:
    description: >-
      Trust the checked-out repository so the CLI loads its settings, hooks, skills and MCP servers.
      Leave it 'false' (safe mode) when the checkout may contain untrusted code, such as a pull request.
    required: false
    default: 'false'
  cli-version:
    description: 'Exact version or dist-tag of @robota-sdk/agent-cli to install'
    required: false
    default: 'latest'

outputs:
  result:
    description: 'The agent response text'
    value: ${{ steps.run-agent.outputs.result }}

runs:
  using: 'composite'
  steps:
    # The selected CLI needs Node.js 22.12 or later; a cached older 22.x does not satisfy the range.
    # No package-manager cache: this job holds an API key, and the checkout's package.json must not
    # decide what gets cached or restored.
    - uses: actions/setup-node@v6
      with:
        node-version: '^22.12.0'
        package-manager-cache: false
    # Inputs reach the script only through the environment, never written into the script itself.
    - id: run-agent
      shell: bash
      env:
        PRODUCT_PACKAGE_SCOPE: ${{ inputs.package-scope }}
        PRODUCT_CLI_NAME: ${{ inputs.cli-name }}
        ACTION_TASK: ${{ inputs.task }}
        ACTION_MODEL: ${{ inputs.model }}
        ACTION_OUTPUT: ${{ inputs.output }}
        ACTION_MAX_TURNS: ${{ inputs.max-turns }}
        ACTION_LOAD_PROJECT: ${{ inputs.load-project }}
        ACTION_API_KEY: ${{ inputs.api-key }}
        ACTION_CLI_VERSION: ${{ inputs.cli-version }}
      run: node "$GITHUB_ACTION_PATH/src/main.mjs"
