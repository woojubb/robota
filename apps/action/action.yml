name: 'Robota Action'
description: 'Run the Robota coding assistant on a task in a workflow'
author: 'robota-sdk'
branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  task:
    description: 'The task or prompt to send to the agent'
    required: true
  model:
    description: 'AI model to use (e.g. claude-sonnet-4-6)'
    required: false
  api-key:
    description: 'Anthropic API key (prefer using secrets)'
    required: false
  output:
    description: 'Output format: text | json | stream-json'
    required: false
    default: 'text'
  max-turns:
    description: 'Maximum agent turns'
    required: false
  load-project:
    description: >-
      Trust the checked-out repository so Robota loads its settings, hooks, skills and MCP servers.
      Leave it 'false' (safe mode) when the checkout may contain untrusted code, such as a pull request.
    required: false
    default: 'false'

outputs:
  result:
    description: 'The agent response text'
    value: ${{ steps.run-robota.outputs.result }}

runs:
  using: 'composite'
  steps:
    # The Robota CLI needs Node.js 22.12 or later.
    - uses: actions/setup-node@v6
      with:
        node-version: '22.12'
    # Inputs reach the script only through the environment, never written into the script itself.
    - id: run-robota
      shell: bash
      env:
        ROBOTA_TASK: ${{ inputs.task }}
        ROBOTA_MODEL: ${{ inputs.model }}
        ROBOTA_OUTPUT: ${{ inputs.output }}
        ROBOTA_MAX_TURNS: ${{ inputs.max-turns }}
        ROBOTA_LOAD_PROJECT: ${{ inputs.load-project }}
        ROBOTA_API_KEY: ${{ inputs.api-key }}
      run: node "$GITHUB_ACTION_PATH/src/main.mjs"
