name: Release — Bun binaries

# PAYLOAD-2153 / DIST-002 — compile every native Bun executable on its matching host, execute the
# packaged replay/refusal proof there, then give one separate publisher the only write credential.
# Sibling to release.yml (manual npm publish); this workflow never publishes npm packages.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build + attach binaries to (e.g. v3.0.0-beta.79). The tag must already exist.'
        required: true
        type: string

permissions:
  contents: read

# Shares the Release with release-desktop-app.yml — serialize both publishers on the same tag.
concurrency:
  group: release-assets-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-bun:
    name: Build Bun / ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            binary: robota-linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            binary: robota-linux-arm64
          - target: darwin-x64
            runner: macos-26-intel
            binary: robota-darwin-x64
          - target: darwin-arm64
            runner: macos-26
            binary: robota-darwin-arm64
          - target: windows-x64
            runner: windows-2025
            binary: robota-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Compile and execute the exact native target
        shell: bash
        run: |
          set -euo pipefail
          bun packages/agent-cli/scripts/build-bun.mjs "${{ matrix.target }}"
          mkdir -p ".release-output/${{ matrix.target }}"
          cp "packages/agent-cli/dist-bun/${{ matrix.binary }}" ".release-output/${{ matrix.target }}/"
          standalone_root="$(mktemp -d "${RUNNER_TEMP}/robota-release-bun-${{ matrix.target }}-XXXXXX")"
          binary="$standalone_root/${{ matrix.binary }}"
          cp ".release-output/${{ matrix.target }}/${{ matrix.binary }}" "$binary"
          chmod +x "$binary"
          (cd "$standalone_root" && "$binary" --version)
          node packages/agent-cli/scripts/e2e-native-file-authority.mjs "$binary"

      - name: Upload exactly one native binary
        uses: actions/upload-artifact@v7
        with:
          name: bun-binary-${{ matrix.target }}-${{ github.run_id }}
          path: .release-output/${{ matrix.target }}/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  publish-bun:
    name: Publish verified Bun binaries
    needs: build-bun
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "::error::Refusing invalid release tag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Download the five native build artifacts separately
        uses: actions/download-artifact@v7
        with:
          pattern: bun-binary-*-${{ github.run_id }}
          path: .release-inputs

      - name: Validate the exact input set and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected=(
            robota-darwin-arm64
            robota-darwin-x64
            robota-linux-x64
            robota-linux-arm64
            robota-windows-x64.exe
          )
          artifact_dirs=(.release-inputs/bun-binary-*-${{ github.run_id }})
          if [[ "${#artifact_dirs[@]}" -ne 5 ]]; then
            echo "::error::Received ${#artifact_dirs[@]} build artifacts; expected exactly 5."
            exit 1
          fi
          mkdir -p .release-assets
          for artifact_dir in "${artifact_dirs[@]}"; do
            files=("$artifact_dir"/*)
            if [[ "${#files[@]}" -ne 1 || ! -f "${files[0]}" ]]; then
              echo "::error::$artifact_dir must contain exactly one regular file."
              exit 1
            fi
            name=$(basename "${files[0]}")
            case " ${expected[*]} " in
              *" $name "*) ;;
              *) echo "::error::Unexpected binary input: $name"; exit 1 ;;
            esac
            if [[ -e ".release-assets/$name" ]]; then
              echo "::error::Duplicate binary input: $name"
              exit 1
            fi
            cp "${files[0]}" ".release-assets/$name"
            description=$(file -b ".release-assets/$name")
            case "$name" in
              robota-darwin-arm64) expected_format='Mach-O 64-bit arm64' ;;
              robota-darwin-x64) expected_format='Mach-O 64-bit x86_64' ;;
              robota-linux-x64) expected_format='ELF 64-bit LSB.*x86-64' ;;
              robota-linux-arm64) expected_format='ELF 64-bit LSB.*ARM aarch64' ;;
              robota-windows-x64.exe) expected_format='PE32+.*x86-64' ;;
            esac
            if [[ ! "$description" =~ $expected_format ]]; then
              echo "::error::$name has an unexpected binary format: $description"
              exit 1
            fi
          done
          for name in "${expected[@]}"; do
            if [[ ! -f ".release-assets/$name" ]]; then
              echo "::error::Missing binary input: $name"
              exit 1
            fi
          done
          (
            cd .release-assets
            sha256sum \
              robota-darwin-arm64 \
              robota-darwin-x64 \
              robota-linux-x64 \
              robota-linux-arm64 \
              robota-windows-x64.exe \
              > SHA256SUMS.txt
            lines=$(wc -l < SHA256SUMS.txt)
            if [[ "$lines" -ne 5 ]]; then
              echo "::error::SHA256SUMS.txt has $lines entries, expected 5."
              exit 1
            fi
          )
          : > .release-expected.tsv
          for name in "${expected[@]}" SHA256SUMS.txt; do
            size=$(wc -c < ".release-assets/$name")
            digest=$(sha256sum ".release-assets/$name" | awk '{print $1}')
            printf '%s\t%s\t%s\n' "$name" "$size" "$digest" >> .release-expected.tsv
          done

      - name: Generate release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/release/generate-release-notes.mjs --tag "$TAG" --notes-file "${{ runner.temp }}/release-notes.md"

      - name: Publish all six assets once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          gh release upload "$TAG" \
            .release-assets/robota-darwin-arm64 \
            .release-assets/robota-darwin-x64 \
            .release-assets/robota-linux-x64 \
            .release-assets/robota-linux-arm64 \
            .release-assets/robota-windows-x64.exe \
            .release-assets/SHA256SUMS.txt \
            --clobber

      - name: Download and verify published names, sizes, and digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir .published-assets
          gh release download "$TAG" \
            --dir .published-assets \
            --clobber \
            --pattern robota-darwin-arm64 \
            --pattern robota-darwin-x64 \
            --pattern robota-linux-x64 \
            --pattern robota-linux-arm64 \
            --pattern robota-windows-x64.exe \
            --pattern SHA256SUMS.txt
          shopt -s nullglob
          published=(.published-assets/*)
          if [[ "${#published[@]}" -ne 6 ]]; then
            echo "::error::Downloaded ${#published[@]} published assets; expected exactly 6."
            exit 1
          fi
          while IFS=$'\t' read -r name expected_size expected_digest; do
            file=".published-assets/$name"
            if [[ ! -f "$file" ]]; then
              echo "::error::Published asset is missing: $name"
              exit 1
            fi
            actual_size=$(wc -c < "$file")
            actual_digest=$(sha256sum "$file" | awk '{print $1}')
            if [[ "$actual_size" != "$expected_size" ]]; then
              echo "::error::$name published size $actual_size differs from $expected_size."
              exit 1
            fi
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              echo "::error::$name published digest differs from the verified build."
              exit 1
            fi
          done < .release-expected.tsv
          (cd .published-assets && sha256sum --check SHA256SUMS.txt)
