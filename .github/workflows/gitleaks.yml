name: Secret Scan

# Detect secrets/keys committed in a PR's diff. Runs the gitleaks binary directly (mirrors the osv-scanner
# pattern in ci.yml) — no third-party action, no license key. A committed secret is an irreversible leak
# (it stays in history and is indexed even if deleted), so this is a cheap gate against a severe, unrecoverable
# failure. The repo routinely handles tokens (SEC-001 loopback tokens, provider API keys, deploy keys).
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize]

permissions:
  contents: read

env:
  # INFRA-061: 8.24+ is a FLOOR, not a preference. `.gitleaks.toml` scopes its fixture suppression to a
  # single rule via `[[allowlists]] targetRules`, and older gitleaks drops those keys SILENTLY — the config
  # would still parse, the scan would still run, and every rule would again be suppressed in all test paths.
  GITLEAKS_VERSION: 8.30.1
  # Checksum of the release asset this job downloads and then EXECUTES. Pinning the version does not pin the
  # bytes: a release asset can be replaced under an existing tag. Recompute when bumping GITLEAKS_VERSION:
  #   curl -fsSL <url> | sha256sum -
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

# A superseded push should not keep a runner. Without this, every rapid re-push leaves the
# previous run to finish work whose answer is already stale, and it is billed in full.
# Scoped to the pull request, so runs on different PRs never cancel each other.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # SCOPE, stated so the green is auditable: same-repo PRs only. A FORK PR is not scanned at all — the job
    # is SKIPPED, not passed. That is tolerable only because this repo does not accept external code
    # contributions during the active architecture phase (fork PRs are closed, not merged). If that policy
    # changes, this condition is the first thing that must go.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # INFRA-050: full history, and NO depth-limited fetch. A `--depth` fetch GRAFTS the whole
      # repository, and the scan range below (`origin/<base>..HEAD`) is a history walk: a truncated
      # ancestry both re-emits commits already merged into the base AND can drop commits the PR
      # itself authored — a secret introduced by this PR would then never be scanned, silently.
      # INFRA-049 measured that exact divergence (109 commits locally vs 97, a different set, in CI).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
      - name: Scan PR commits for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "origin/${{ github.base_ref }}..HEAD" \
            --redact \
            --no-banner \
            --verbose
