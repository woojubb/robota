name: Mutation testing (on demand)

# INFRA-042: mutation testing (Stryker) is the deepest defence against weak / accidental-green tests
# (the class that recurred as ARCH-004 RUNTIME-14 and CORE-026 RUNTIME-12; common-mistakes #82).
# Coverage proves a line RAN; mutation proves its behaviour is ASSERTED. It runs the suite once per
# mutant, so it is far too expensive for per-PR CI — it runs ON DEMAND over a bounded set of the
# highest-value CORE packages, one package per matrix leg. See stryker.conf.mjs for scope + config.
#
# ADVISORY (v1): the mutation score is REPORT-ONLY (stryker.conf.mjs sets thresholds.break=null, so
# Stryker never fails the run on a low score). The uploaded report is the maintained artefact;
# surviving mutants become test-hardening work items. This is not a PR gate and blocks nothing.
#
# INFRA-061 — an advisory nobody can read is not advisory, it is silent. The 2026-07-26 run scored
# 52.63 / 74.42 / 58.62 across the three targets with 110 surviving mutants, and every one of those
# numbers was reachable only by downloading a zip; the run page said "success". The score now goes to
# the job summary, so the advisory is visible where the run is. Raising `thresholds.break` above null
# — i.e. making a low score fail — changes what this workflow enforces and is the owner's call, filed
# rather than taken here.
#
# What this workflow does NOT claim: it is not "mutation testing of the repo". It mutates three
# deliberately-chosen files (see stryker.conf.mjs TARGETS), not three packages. A mutate glob that
# stops matching is NOT a silent no-op — verified by pointing one target at a renamed path: Stryker
# exits 1 with `ConfigError: No tests were executed`, because perTest coverage finds no related tests.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: mutation (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Bounded: one Stryker run per core package, in parallel. fail-fast off so a weak score (or an
    # infra hiccup) on one package never cancels the others.
    strategy:
      fail-fast: false
      matrix:
        target: [agent-core, agent-session, agent-executor]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cross-package @robota-sdk deps resolve to built dist inside the Stryker sandbox, so build the
      # workspace first (agent-session / agent-executor tests import sibling packages).
      - name: Build workspace
        run: pnpm build:deps

      - name: Run mutation testing (${{ matrix.target }})
        env:
          STRYKER_TARGET: ${{ matrix.target }}
        # pipefail keeps Stryker's exit code authoritative through the tee — the log is a copy, not
        # the verdict.
        run: |
          set -euo pipefail
          pnpm test:mutation 2>&1 | tee "$RUNNER_TEMP/mutation.log"

      # Puts the score on the run page. Without this the only readable output is inside the artifact
      # zip, which is why three sub-threshold scores sat unread since the workflow landed.
      - name: Publish the mutation score to the job summary
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          {
            echo "### Mutation — ${TARGET}"
            echo
            if [ -f "$RUNNER_TEMP/mutation.log" ] &&
               grep -qE '^All files' "$RUNNER_TEMP/mutation.log"; then
              echo '```'
              grep -E '^All files|^Ran .* tests per mutant' "$RUNNER_TEMP/mutation.log"
              echo '```'
            else
              # Stated, never swallowed: the run above already failed loudly if Stryker did, and this
              # line says which case produced no score rather than printing a reassuring blank.
              echo "No mutation score in the run output — Stryker did not reach the reporting stage."
              echo "See the \"Run mutation testing\" step for the reason."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report (${{ matrix.target }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.target }}
          path: reports/mutation/${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 30
