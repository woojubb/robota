name: Release — Dev Container Feature
on:
  workflow_run:
    workflows: ['Release — Bun binaries', 'Publish to npm']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: feature-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prerequisites:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.join.outputs.ready }}
      tag: ${{ steps.join.outputs.tag }}
      native_run: ${{ steps.join.outputs.native_run }}
    steps:
      - uses: actions/github-script@v8
        id: join
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            async function completed(workflow_id) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, head_sha: sha, status: 'success', per_page: 10
              });
              return data.workflow_runs.find(run => run.head_sha === sha &&
                run.head_repository.full_name === context.payload.repository.full_name &&
                ['push', 'workflow_dispatch'].includes(run.event));
            }
            const [native, npm] = await Promise.all([
              completed('release-bun-binaries.yml'), completed('publish.yml')
            ]);
            if (!native || !npm || npm.head_branch !== 'main') {
              core.info('The other prerequisite has not completed; its completion event will resume delivery.');
              core.setOutput('ready', 'false');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: npm.id, per_page: 100
            });
            const receipts = data.artifacts.filter(a => a.name.startsWith('npm-release-') && !a.expired);
            if (receipts.length !== 1) throw new Error('Expected one successful npm release receipt.');
            const tag = receipts[0].name.slice('npm-release-'.length);
            if (!/^[0-9A-Za-z._+-]+$/.test(tag)) throw new Error('Invalid release tag.');
            let { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'tags/' + tag });
            let object = ref.object;
            if (object.type === 'tag') {
              const { data } = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha });
              object = data.object;
            }
            if (object.type !== 'commit' || object.sha !== sha) throw new Error('Prerequisite source differs from release tag.');
            core.setOutput('tag', tag);
            core.setOutput('native_run', native.id);
            core.setOutput('ready', 'true');

  publish-devcontainer-feature:
    name: Publish selected Dev Container Feature
    needs: prerequisites
    if: needs.prerequisites.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: devcontainer-feature-woojubb
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      PRODUCT_BUILD_ENV: ${{ github.event.inputs.product_env || vars.PRODUCT_BUILD_ENV }}
      NATIVE_RUN_ID: ${{ needs.prerequisites.outputs.native_run }}
      FEATURE_REGISTRY: ghcr.io
      FEATURE_NAMESPACE: woojubb/devcontainer-features
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prerequisites.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate exact selected release workspace
        run: pnpm exec tsx scripts/product/prepare-workflow-workspace.mjs
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Install pinned official Feature packager and consumer
        run: npm install --prefix "$RUNNER_TEMP/feature-tools" --ignore-scripts --no-audit --no-fund @devcontainers/cli@0.89.0
      - name: Write non-secret publication options
        env:
          RELEASE_TAG: ${{ needs.prerequisites.outputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import path from 'node:path';
          const e=process.env;
          writeFileSync(path.join(e.RUNNER_TEMP,'feature-options.json'),JSON.stringify({
            checkout:e.GITHUB_WORKSPACE,workspace:e.PRODUCT_WORKSPACE,tag:e.RELEASE_TAG,
            runId:e.NATIVE_RUN_ID,namespace:e.FEATURE_NAMESPACE,registry:e.FEATURE_REGISTRY,
            repository:e.GITHUB_REPOSITORY,cli:path.join(e.RUNNER_TEMP,'feature-tools/node_modules/.bin/devcontainer'),
            oras:'oras',receiptFile:path.join(e.RUNNER_TEMP,'feature-publication.json')
          }));
          JS
      - name: Validate release, package deterministically, enforce immutable versions, publish and anonymously pull
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/feature-publisher.mjs release "$RUNNER_TEMP/feature-options.json"
      - name: Execute anonymous exact-digest Feature consumer
        # A private refusing credential helper and credential-free child environment are enforced by the verifier.
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          import { verifyPublished } from './scripts/release/verify-published-feature.mjs';
          const e=process.env;
          const published=JSON.parse(readFileSync(path.join(e.RUNNER_TEMP,'feature-publication.json')));
          await verifyPublished({...published,checkout:e.GITHUB_WORKSPACE,
            cli:path.join(e.RUNNER_TEMP,'feature-tools/node_modules/.bin/devcontainer'),
            tempParent:e.RUNNER_TEMP,receiptFile:path.join(e.RUNNER_TEMP,'feature-anonymous-acceptance.json')});
          JS
      - name: Preserve public delivery receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devcontainer-feature-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/feature-publication.json
            ${{ runner.temp }}/feature-anonymous-acceptance.json
          if-no-files-found: ignore
