name: Publish to npm

# Publishes every public @robota-sdk package at the release version through npm trusted publishing (OIDC):
# no npm token is stored anywhere; each run gets a short-lived, run-scoped credential and provenance is
# attached automatically. npm accepts it only for this workflow file running in the `npm-publish`
# environment, which requires the owner's approval and allows `main` only. A package's first publish
# still needs the owner's OTP (a trusted publisher can only be configured for an existing package).
on:
  workflow_dispatch:
    inputs:
      product_env:
        description: 'Non-secret product environment file contents; otherwise uses vars.PRODUCT_BUILD_ENV.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      PRODUCT_BUILD_ENV: ${{ github.event.inputs.product_env || vars.PRODUCT_BUILD_ENV }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1; pnpm 8 hands the packed tarball to this npm. Pinned so a
      # release run is reproducible.
      - run: npm install -g npm@11.20.0
      - run: pnpm install --frozen-lockfile
      - name: Generate selected product workspace
        shell: bash
        run: |
          pnpm exec tsx -e '
            import { writeFileSync } from "node:fs";
            import { join } from "node:path";
            if (!process.env.PRODUCT_BUILD_ENV?.trim()) throw new Error("Select product_env or configure vars.PRODUCT_BUILD_ENV before publication.");
            writeFileSync(join(process.env.RUNNER_TEMP, "selected-product.env"), process.env.PRODUCT_BUILD_ENV, { mode: 0o600 });
          '
          pnpm exec tsx scripts/product/generate-workspace.mjs --env "$RUNNER_TEMP/selected-product.env" --out "$RUNNER_TEMP/product-workspace" --github-env "$GITHUB_ENV"
      - name: Publish the configured product packages
        working-directory: ${{ env.PRODUCT_WORKSPACE }}
        run: |
          pnpm install --frozen-lockfile
          bash scripts/publish/publish-packages.sh --trusted
