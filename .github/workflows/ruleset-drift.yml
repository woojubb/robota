name: Ruleset drift

# INFRA-055. `.github/required-status-checks.json` is the SOURCE of what `protect-main` must require,
# and `pnpm harness:scan` proves offline that every context it names can actually FAIL on a `main` PR.
# What that hermetic half cannot see is the ruleset moving underneath it — a context added to or
# removed from `protect-main` in the GitHub UI leaves the file, and therefore the scan, guarding
# something that is no longer true.
#
# This job closes that half, deliberately OUT of the merge path. It gates nothing: a GitHub API
# outage costs a red manual run, never a blocked promotion — which is why the scan's `--live` half is
# opt-in rather than part of `harness:scan`. It also surfaces drift BEFORE a promotion PR is opened
# rather than while one is waiting.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # INFRA-065 half 2, as far as the repository permits it.
  #
  # An action reference decays with NO DIFF AT ALL — an upstream repository deleted or renamed, a tag
  # force-moved, a repo made private. `vercel/action` was exactly that shape: eight months with no PR
  # touching the workflow that used it. No PR-time check can see it, because there is no PR.
  #
  # The item asked for a SCHEDULED job. That is refused, not pending: the 2026-08-04 owner directive
  # ("크론은 다 꺼") removed every `schedule:` trigger in this repository and there are none today, so
  # reintroducing one would contradict a standing instruction. This is the on-demand form — the same
  # trigger, permissions and rationale as the reconcile job below, in the same file, which is where
  # this repository puts a live half that must never gate a merge.
  #
  # WHAT THIS DOES NOT CLOSE, stated rather than implied: on demand is not a cadence. Rot is caught
  # when someone runs this, not within 24 hours. The gap the item named survives at reduced size.
  action-references:
    name: action references resolve (live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify every `uses:` reference resolves against the real remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/harness/scan-action-references.mjs --live

  reconcile:
    name: required-status-checks vs live ruleset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The scan reads only `.github/required-status-checks.json`, the workflow files and `gh api`
      # (node: builtins + child_process), so no dependency install is needed — same shape as
      # `review-gate.yml`, which has run `node scripts/harness/*.mjs` bare since #1434.
      - name: Reconcile the declaration against the live `protect-main` ruleset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/harness/scan-main-required-checks.mjs --live
