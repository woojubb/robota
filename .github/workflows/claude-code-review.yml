name: Claude Code Review

# ══════════════════════════════════════════════════════════════════════════════════════════════════
# EDITING THIS FILE IS A TWO-BRANCH OPERATION. READ THIS BEFORE YOU CHANGE A BYTE.  (INFRA-053)
#
# `anthropics/claude-code-action` mints its GitHub App token through an OIDC exchange that validates
# the invoking workflow against the DEFAULT branch (`main`) BYTE-FOR-BYTE. When the two copies differ
# the action prints "Skipping action due to workflow validation" and **exits 0** — the check reports
# `success` having reviewed nothing. It did exactly that for 100 consecutive runs (INFRA-048).
#
# `scan-review-workflow-parity`, which runs inside the REQUIRED `scans` job, now fails loudly on that
# divergence instead of letting it pass silently. It exempts PRs whose base IS `main`, because such a
# PR is the promotion that restores parity. Consequence: an edit here is red on one branch or the
# other until BOTH carry it. The safe sequence:
#
#   1. Confirm the queue is EMPTY — no open PRs to `develop`, no agents mid-flight. The window blocks
#      a required check for everyone, so this is serial-only work.
#   2. Cut `release/*` from `develop`, edit here, open the PR to `main` (parity-exempt), merge it.
#   3. IMMEDIATELY back-merge `main` → `develop`. Parity is restored only once both branches match.
#
# And note what this means for verification: a change here **cannot be proven by its own PR**. The
# action compares against `main` whatever the PR's base is, so it skips until step 2 lands. The first
# honest run of a change made here is the first PR opened after step 3.
# ══════════════════════════════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    # This repo's flow is feature→develop→main, so most PRs target `develop`. Because of the parity
    # rule above, this file has to exist on `main` AND on `develop` as the same bytes.
    branches: [main, develop]
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    # Fork PRs have no access to secrets — skip so the run doesn't fail auth-less.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Depth 1 is deliberate, not an oversight. A `prompt:` input puts the action in AGENT mode,
          # which injects no PR context and fetches no diff of its own — the reviewer reads the diff
          # from the GitHub API via `gh pr diff`, exactly as the action's own PR-review examples do.
          # Nothing below needs a base ref locally, so a deeper checkout would buy only clone time.
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # Authenticate with whichever secret is registered (an empty one is ignored).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.base_ref }}

            이 PR의 변경분(diff)을 리뷰한다. 우선순위는 버그·정확성·보안이고 스타일 트집은 최소화한다.

            진행 순서:
            1. `gh pr diff <PR NUMBER> --name-only` 로 변경 파일 목록을 본다.
            2. `gh pr diff <PR NUMBER>` 로 diff 본문을 읽는다. 출력이 잘리면 목록에서 중요한 파일만
               골라 Read 로 확인한다 — PR 브랜치는 이미 작업 디렉터리에 체크아웃되어 있다.
            3. 발견은 `mcp__github_inline_comment__create_inline_comment` 로 해당 라인에 남긴다.
            4. 마지막에 `gh pr comment <PR NUMBER> --body ...` 로 3줄 이내 요약을 남긴다. 이 요약은
               반드시 남긴다 — 지적할 것이 없으면 없다고 쓴다. 아무것도 남기지 않은 실행은 리뷰하지
               않은 실행과 구분되지 않는다.

            예산 규칙: 인라인 코멘트 1건이 1턴을 쓴다. 심각도가 높은 순으로 최대 10건까지만 인라인으로
            남기고 나머지는 요약에 한 줄씩 적는다. 빌드·타입체크·테스트 실행이나 전체 트리 탐색은
            하지 않는다.

            이 레포가 특히 강조하는 규율: strict TypeScript(`any`/`unknown` 금지), no-fallback(오류를
            기본값으로 삼켜 감추지 말 것), SSOT 타입, 일방향 패키지 의존성(순환·pass-through
            re-export 금지), 그리고 결함-수정 회귀 테스트의 accidental-green(버그 코드에서도 통과하는
            테스트). 규율의 단일 출처는 `AGENTS.md`와 그 아래 `.agents/rules/` 이고, 얇은 `CLAUDE.md`와
            `CONTRIBUTING.md` 가 보조다 — diff 에서 위반이 의심될 때만 해당 문서를 열어 확인하고, 매
            실행마다 규율 문서 전체를 읽지는 않는다.
          claude_args: |
            # Agent mode installs a GitHub MCP server ONLY when one of its tools is named here, and
            # grants no permission-requiring tool that is not named here. With no --allowedTools the
            # reviewer could neither read a diff nor post a finding: on run 30189528981, 17 of its 25
            # turns were permission denials and it posted nothing. Below is the minimum the prompt
            # genuinely needs — read the diff, read repo files for context, comment. A reviewer of
            # PR-authored content gets no Write/Edit, no general Bash, and no network fetch.
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob"
            --disallowedTools "Write,Edit,NotebookEdit,WebFetch,WebSearch"
            # 25 is kept deliberately, not by default. Re-measured against a large multi-area PR with
            # the grant above, a full review — diff, context reads, inline findings, summary — lands
            # inside it. What the cap really bounds is the number of FINDINGS (one inline comment
            # costs one turn), which is why the prompt caps inline comments at 10 instead of asking
            # for a bigger budget: a budget that has to grow with every large PR is not a fix.
            --max-turns 25
            --model claude-sonnet-5
