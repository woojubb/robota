name: Claude Code Review

# ══════════════════════════════════════════════════════════════════════════════════════════════════
# THE `github_token` INPUT BELOW IS LOAD-BEARING. READ THIS BEFORE REMOVING IT.  (INFRA-062)
#
# Without a `github_token` input, `anthropics/claude-code-action` mints a GitHub App token through an
# OIDC exchange that validates the invoking workflow against the DEFAULT branch (`main`)
# BYTE-FOR-BYTE. When the copies differ the action prints "Skipping action due to workflow
# validation" and **exits 0** — the check reports `success` having reviewed nothing. It did exactly
# that for 100 consecutive runs (INFRA-048).
#
# Supplying `github_token` removes that failure mode at its cause: `setupGitHubToken()` returns the
# provided token BEFORE the OIDC exchange (src/github/token.ts, verified at v1.0.183 — the commit
# `@v1` resolves to), and the exchange is the only place the workflow-validation skip exists. With
# the input present the skip path is unreachable, this file is editable through the normal
# feature→develop→main flow, and no byte-parity between branches is required.
#
# That is why INFRA-062 retired `scan-review-workflow-parity` (INFRA-048's detector for the skip) and
# replaced it with `scan-review-token-supply` in the required `scans` job: any workflow invoking this
# action MUST supply `github_token`, or the silent-skip failure mode returns. Do not remove the input
# without reading that scan first.
# ══════════════════════════════════════════════════════════════════════════════════════════════════

on:
  pull_request:
    # Every PR base is deliberate: multi-backlog initiatives merge child PRs into a stable
    # integration base before the final develop PR. Filtering to main/develop left those children
    # with no reviewer at all (INFRA-098).
    # Contained — INFRA-097. `pull_request` still loads this control-plane YAML from the candidate
    # merge revision. INFRA-097 / issue #1719 owns the trusted-workflow end state; this prerequisite
    # must land first so the current integration child can receive any review.
    types: [opened, synchronize, reopened, edited]

# Two lanes per PR, not one. `edited` is subscribed only for the base-retarget case and the job
# below skips every other edit — but a skipped run in the SAME concurrency group still cancels the
# in-flight review of the head that was just pushed, and nothing re-triggers it (issue #2250:
# PR #2244, `synchronize` cancelled at 14:46:42, `edited` skipped 17 s later, the PR left carrying
# the verdict for the previous head). Head-changing events share the `head` lane so a newer push
# still supersedes an older review; `edited` gets its own lane so it can cancel only another edit.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && 'edited' || 'head' }}
  cancel-in-progress: true

# Exactly what the reviewer does, and nothing more: it reads the checkout and the diff
# (`contents: read`), and posts inline review comments plus a PR summary comment
# (`pull-requests: write`). `id-token: write` is gone with the OIDC exchange — the action
# authenticates with the `github_token` input, so no App token is minted. No `issues`, no
# `actions`, no write access to code.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    # Fork PRs have no access to secrets — skip so the run doesn't fail auth-less.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && (github.event.action != 'edited' || github.event.changes.base != null) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Depth 1 is deliberate, not an oversight. A `prompt:` input puts the action in AGENT mode,
          # which injects no PR context and fetches no diff of its own — the reviewer reads the diff
          # from the GitHub API via `gh pr diff`, exactly as the action's own PR-review examples do.
          # Nothing below needs a base ref locally, so a deeper checkout would buy only clone time.
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # LOAD-BEARING (see header): with this input the action never performs the OIDC exchange
          # whose workflow-validation silently skips the review on any divergence from `main`.
          # `scan-review-token-supply` fails the required `scans` job if this line is removed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Authenticate with whichever secret is registered (an empty one is ignored).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.base_ref }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Write the PR summary and every inline review comment in English.

            Review the diff in this PR. This is a **lightweight pass review**: find only defects
            serious enough to block a merge, and write nothing else. The author invokes a deep
            audit separately when needed.

            **Threshold for counting a finding (do not write it unless it clears this bar).** You
            must be able to state a concrete failure scenario in one sentence: under which input
            or state, and what incorrect result occurs. If you cannot, it is preference or
            speculation and is outside the scope of this review.

            - Count: incorrect behavior, crashes, data corruption, security defects, silently
              swallowed errors, and regression tests that pass even with the buggy code.
            - Do not count (and do not write): naming, comment wording, documentation phrasing,
              test titles, formatting, alternative designs of the "this would be better" kind,
              existing code untouched by this PR, or low-confidence suspicions requiring further
              verification.

            If confidence is low, do not write the finding. Do not downgrade a low-confidence
            concern to CONSIDER in this review; the author must still pay for another round to
            address it.

            **Report every finding that clears the threshold in a single run.** Do not choose the
            single most important one and stop. One round takes 8–10 minutes, and only after
            waiting that long can the author see the next finding. The measured problem is the
            **rate**: reviews almost always reported one finding per round, and one PR therefore
            took 10 rounds—about 1.6 hours. Reporting three qualifying findings at once turns three
            rounds into one.

            **Do not raise findings that have already been addressed.** If this PR has previous
            reviews, read their summaries first. Do not repeat items resolved there by a fix,
            rebuttal, or deferral. Reviving the same finding after a zero-finding round makes the
            loop endless; on one actual PR, five consecutive zeroes were followed by another one
            in round 9.

            Read the shell constraints first. The only commands permitted are `gh pr diff`,
            `gh pr view`, and `gh pr comment`; appending a pipe (`|`), redirection (`>`), `&&`, or
            `;` causes rejection. Attempts to save the diff to a file or slice it with grep, awk,
            or head will not run. You also cannot use `git` commands (the checkout depth is 1, so
            the comparison base commit is not present). Every rejected attempt consumes one turn,
            so following the exact order below is the only way to finish within budget.

            Procedure:
            1. Run `gh pr diff <PR NUMBER> --name-only` to see the changed-file list.
            2. Run `gh pr diff <PR NUMBER>` to read the entire diff at once. If the output is
               truncated, do not retry. Instead, select only the important files from the list in
               step 1 and inspect them with Read; the PR branch is already checked out in the
               working directory.
            2-1. On the second or a later round, run `gh pr view <PR NUMBER> --comments` to read
               previous review summaries. Do not repeat items that have **already been fixed**.
               Still count every item that remains unfixed in this round: n is the total current
               outstanding state, not the number newly discovered this time. The merge gate reads
               only n from the latest summary, so omitting an unfixed item from the count would
               allow the PR to merge as-is.
            3. After reading the entire diff, post the summary **before** leaving any inline
               comments by running `gh pr comment <PR NUMBER> --body "..."`. List each finding on
               its own line in severity order (or say there are none). The summary's **final three
               lines** must be exactly the three lines below. Use the SHA values from the inputs
               above unchanged.
               `REVIEWED BASE: ${{ github.event.pull_request.base.sha }}`
               `REVIEWED HEAD: ${{ github.event.pull_request.head.sha }}`
               `ACTIONABLE FINDINGS: <n>`
               n is the number of actionable items (MUST/SHOULD), or 0 if there are none. The
               merge gate, not a person, reads these three lines. If any line is missing, the gate
               can only report that it could not count; it cannot judge the review content instead.
               This order is intentional: even if the budget runs out, the summary has already
               been posted. A run that posts nothing is indistinguishable from a run that did not
               review anything.
            4. Then use `mcp__github_inline_comment__create_inline_comment` to comment on the
               relevant lines in descending severity order. If the budget runs out here, the
               summary from step 3 already exists, so only the precise locations are lost.

            Budget rule: each inline comment consumes one turn, so leave no more than 5 inline
            comments and put all remaining findings in the summary from step 3. You can comply
            because you can count these 5 comments yourself. The action does not expose the number
            of turns remaining, so do not try to decide based on it. Do not run builds, typechecks,
            or tests, and do not explore the entire tree.

            If nothing clears the threshold, say so and finish with 0. Zero is not failure; it is
            a normal result of this review. Do not promote preferences into findings because you
            feel pressure to find something.

            Disciplines this repository especially emphasizes: strict TypeScript (no `any` or
            `unknown`), no fallback (do not hide errors by swallowing them into default values),
            SSOT types, unidirectional package dependencies (no cycles or pass-through re-exports),
            and accidental-green defect-fix regression tests (tests that pass even with the buggy
            code). The single source of truth for these disciplines is `AGENTS.md` and
            `.agents/rules/` beneath it, supported by the thin `CLAUDE.md` and `CONTRIBUTING.md`.
            Open the relevant document only when the diff suggests a violation; do not read all
            discipline documents on every run.
          # `claude_args` below carries values only. Its rationale is here, in real YAML comments,
          # rather than inside the block scalar: the action does strip whole-line `#` from that
          # value, but this is the one file whose failure mode is "silently does nothing", so it
          # should not also depend on a parsing subtlety to be correct.
          #
          # --allowedTools: agent mode installs a GitHub MCP server ONLY when one of its tools is
          # named here, and grants no permission-requiring tool that is not named here. With no
          # --allowedTools the reviewer could neither read a diff nor post a finding: on run
          # 30189528981, 17 of its 25 turns were permission denials and it posted nothing. The set
          # below is the minimum the prompt genuinely needs — read the diff, read repo files for
          # context, comment. A reviewer of PR-authored content gets no Write/Edit, no general
          # Bash, and no network fetch; --disallowedTools states that rather than leaving it to the
          # default permission behaviour.
          #
          # --max-turns counts the agent's back-and-forth exchanges inside ONE run. It is not a
          # retry count: a run that exhausts it stops at `error_max_turns` and the job goes red.
          #
          # 25 was set on the claim that a full review lands inside it. Measured over the 40 most
          # recent runs of this workflow, that claim was false: 7 failed (17.5%), ALL of them
          # `error_max_turns` at exactly `num_turns: 26`. Successful runs used 10-22 turns
          # (median ~16), so the cap sat three turns above the observed maximum and cut the tail
          # off. Worse, a run that died there had often spent its whole budget and posted NOTHING.
          #
          # Two things were wrong, and raising the number alone fixes neither:
          #
          #   1. The prompt ordered the summary LAST while saying a missing summary is the worst
          #      outcome. Exhaustion therefore destroyed the one artifact that always has value.
          #      The summary now goes FIRST and inline comments follow, so running out costs only
          #      the line-level detail.
          #   2. The budget rule was unobservable. "stop when fewer than 5 turns remain" cannot be
          #      followed, because the action never tells the agent how many it has used. It is now
          #      a count of its own inline comments, which the agent can actually keep.
          #
          # 45 gives the measured tail (22) real headroom rather than three turns of it. The point
          # is not that bigger is better — with the summary landing first, an exhausted run now
          # degrades instead of vanishing, and the cap is what stops a runaway. The cap stays where
          # it is under the lighter prompt: a narrower bar spends fewer turns on its own, and
          # lowering the ceiling would buy nothing while restoring the tail-cutting failure above.
          #
          # --effort sets the reasoning budget for the session. The reason it belongs here is what
          # Claude Code's own /code-review documents about the same flag: at `low`/`medium` the
          # review reports only the findings it is most confident in, and `high` upward broaden
          # coverage and may include findings it is less sure of. That is a documented property of
          # that command, not a guaranteed property of this action, so it is an additive lever here
          # and the prompt threshold above is the mechanism.
          #
          # It reaches the CLI through `claude_args`' pass-through, which the action does not
          # enumerate among the flags it interprets. Two failure modes follow, and the second is the
          # one to watch: a CLI that IGNORES the flag leaves it inert, and a CLI that REJECTS an
          # unknown option fails the step — on every pull request, since this is the automatic pass.
          # If that happens, delete this line; nothing else depends on it.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob"
            --disallowedTools "Write,Edit,NotebookEdit,WebFetch,WebSearch"
            --max-turns 45
            --effort medium
            --model claude-sonnet-5
