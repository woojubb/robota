name: CodeQL

# Run GitHub code scanning for the public Robota repository.
on:
  push:
    branches: [main, develop]
permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event.repository.private == false || github.event.repository.owner.type == 'Organization'
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Keep branch analyses as overlay-base producers for incremental pull-request analysis.
          # JavaScript/TypeScript is interpreted, so no compilation step is required.
          build-mode: none
          # `security-and-quality` adds maintainability queries on top of the default security set.
          queries: security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
