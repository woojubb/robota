name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  # Keep retries out of the ref group so an old retry cannot replace a newer pending run.
  group: ${{ github.run_attempt == '1' && format('ci-{0}', github.ref) || format('ci-retry-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.run_attempt == '1' }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      release: ${{ steps.scope.outputs.release }}
      developer_docs: ${{ steps.scope.outputs.developer_docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
        with:
          install: 'false'
      - name: Harness size cap
        run: |
          harness=$(git ls-files AGENTS.md CLAUDE.md .agents .claude scripts/harness .github | xargs cat | wc -l)
          agents=$(wc -l < AGENTS.md)
          if [ "$agents" -gt 50 ] || [ "$harness" -gt 12000 ]; then
            echo "::error::Harness over its cap. Remove as much as you add."
            exit 1
          fi
      - id: scope
        run: node scripts/ci.mjs scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
  workspace-build:
    needs: scope
    if: needs.scope.outputs.developer_docs != 'true'
    uses: ./.github/workflows/ci-check.yml
    with:
      kind: build
      plan: ${{ needs.scope.outputs.plan }}
  static-checks:
    needs: [scope, workspace-build]
    if: needs.scope.outputs.developer_docs != 'true'
    uses: ./.github/workflows/ci-check.yml
    with:
      kind: static
      plan: ${{ needs.scope.outputs.plan }}
      artifact-id: ${{ needs.workspace-build.outputs.artifact-id }}
  tests:
    needs: [scope, workspace-build]
    if: ${{ !cancelled() && needs.scope.result == 'success' && (needs.scope.outputs.developer_docs == 'true' || needs.workspace-build.result == 'success') }}
    uses: ./.github/workflows/ci-check.yml
    with:
      kind: tests
      plan: ${{ needs.scope.outputs.plan }}
      artifact-id: ${{ needs.workspace-build.outputs.artifact-id }}
  release-checks:
    needs: scope
    if: needs.scope.outputs.release == 'true'
    uses: ./.github/workflows/ci-check.yml
    with:
      kind: release
      plan: ${{ needs.scope.outputs.plan }}
  pr-validation:
    name: pr-validation
    needs: [scope, workspace-build, static-checks, tests, release-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/ci.mjs gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
  secret-scan:
    name: secret-scan
    permissions:
      contents: read
    uses: ./.github/workflows/gitleaks.yml
    with:
      base_ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'push' && github.event.before || 'HEAD~1' }}
      head_ref: ''
  security:
    name: security
    needs: [secret-scan]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Secret scan must pass
        run: '[ "${{ needs.secret-scan.result }}" = success ]'
