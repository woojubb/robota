name: CI

on:
  pull_request:
    branches: [main, develop, integration/**]
    # INFRA-055: `edited` is NOT in GitHub's default activity set (`opened`, `synchronize`,
    # `reopened`), and retargeting a PR's BASE BRANCH fires `edited` — not `synchronize`. Without it
    # the whole `main`-only pipeline is bypassable through the GitHub UI in two clicks, MEASURED on
    # throwaway PR #1442 (2026-07-26): a feature branch was opened against `develop`, went green, and
    # was then retargeted to `main`. No workflow re-dispatched (the four run ids for head sha
    # `e4806e4f` were identical before and after), so `main PR source guard`, `promotion ancestry` and
    # `release-grade verification` kept the `SKIPPED` conclusions they had earned as a develop PR —
    # and a skipped required check is ACCEPTED by branch protection (INFRA-050). `gh pr view 1442`
    # then reported `mergeStateStatus: CLEAN, mergeable: MERGEABLE`: a feature branch, one click from
    # landing on `main`, past every gate INFRA-051 and INFRA-055 exist to enforce.
    #
    # A title/body edit therefore re-dispatches the full workflow. That cost is deliberate: gating the
    # jobs on `github.event.changes.base != null` so a title edit skips them instead would be WORSE
    # than the disease — a skipped job publishes a `skipped` check run that REPLACES the previous
    # `success` for the same head sha, so editing a PR's title would erase its verification and leave
    # it mergeable on skipped required checks. Re-running is the only conclusion-preserving option.
    #
    # That same property has ONE benign instance here, and it is benign only for a reason that could
    # be undone by accident: a develop→main retarget re-dispatches this workflow, and the four
    # develop-side jobs then publish `skipped` over the `success` they had earned against `develop`.
    # That is harmless only because the develop verification contexts are not required on
    # `protect-main`. Adding them there would make a retarget erase its own evidence;
    # `scan-main-required-checks.mjs` refuses that combination.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch or commit used by the PR-free required-check benchmark
        required: true
        default: develop
        type: string
      head_ref:
        description: Head branch or commit to verify
        required: true
        default: develop
        type: string
      pr_body:
        description: Optional synthetic PR body consumed by lane and regression-proof checks
        required: false
        default: "## Background\n\nPR-free required-check benchmark."
        type: string

# One in-flight run per PR. `edited` makes a second dispatch for the same head sha routine (this
# harness edits PR bodies after opening), and two runs publishing a check run per context means a
# flake in EITHER decides the merge verdict — nondeterminism in the required-check set, in the change
# whose whole subject is required-check integrity. Keyed on the PR number, not the ref, so a retarget
# supersedes the previous run rather than racing it. Fails closed: a cancelled run reports
# `cancelled`, which is not `success` and does not satisfy a required check.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('benchmark-{0}-{1}', inputs.base_ref, inputs.head_ref) }}
  cancel-in-progress: true

# INFRA-061: osv-scanner is downloaded from a GitHub release and then executed by security jobs,
# whose result feeds the required `security` context. Pinning the version does not pin the
# bytes: a release asset can be replaced under an existing tag, so an unverified download is arbitrary
# code execution on a runner that has the repository checked out. Running an unverified binary to prove
# the tree is clean inverts the point of the job. Both call sites now verify this digest before
# `chmod +x`, and both read it from here so the two can never drift apart.
# Recompute when bumping the version:
#   curl -fsSL https://github.com/google/osv-scanner/releases/download/<version>/osv-scanner_linux_amd64 | sha256sum -
# Kept identical to security-scheduled.yml's pin — same scanner, same bytes, one accepted-risk SSOT.
env:
  OSV_SCANNER_VERSION: v2.0.2
  OSV_SCANNER_SHA256: 3abcfd7126c453a00421487e721b296e0cb68085bd431d6cef60872774170fc8
  # INFRA-065. Pin + checksum, the same accepted-risk shape as the scanner above, for the same
  # reason INFRA-061 gave: a downloaded binary that is verified AFTER it is made executable is
  # verified too late.
  #   curl -fsSL https://github.com/rhysd/actionlint/releases/download/v<version>/actionlint_<version>_linux_amd64.tar.gz | sha256sum -
  ACTIONLINT_VERSION: 1.7.7
  ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757

jobs:
  # Recurrence guard for the #1216 incident: a feature branch was PR'd straight to `main`, skipping `develop`,
  # which swept the whole develop delta onto main and diverged the branches. The feature→develop→main flow is
  # fixed (git-branch.md); this makes it MECHANICAL — a PR to `main` must come from `develop` (or a
  # `release/*` / `hotfix/*` promotion branch), never a feature branch.
  #
  # INFRA-055: this is now a REQUIRED status check on `protect-main`. It qualifies because its verdict is a
  # pure function of the PR's own head — no checkout, no network, no install, nothing that can fail for a
  # reason unrelated to the change — and it always reaches a conclusion on every PR to `main` (the workflow
  # carries no `paths` filter and this job has no `needs`). A red verdict is always satisfiable by the author,
  # by renaming the branch or re-routing through `develop`.
  main-pr-source-guard:
    name: main PR source guard
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Two assertions, both inside the step rather than in the job `if:`, so the job always reports a real
      # PASS/FAIL conclusion. A job-level condition would report `skipping`, which branch protection ACCEPTS
      # — the INFRA-050 property that makes a required check a no-op.
      - name: Only develop / release / hotfix from this repository may target main
        # Attacker-controlled values reach this job through `env:`, never through `${{ }}` inside
        # `run:`. A `${{ }}` expression is substituted into the script BEFORE the shell parses it, and
        # a git ref may contain backticks, `$`, `;`, `&` and `|` — so interpolating `github.head_ref`
        # directly is remote code execution on the runner, openable by anyone on a public repo with
        # forking enabled. Making this job a REQUIRED check is what obliges the fix now.
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # `github.head_ref` is the BARE branch name and carries no owner, so a fork branch literally named
          # `develop` satisfies the name check below. The repository identity has to be asserted separately.
          # (.agents/memory/oss-contribution-policy.md: external contributions are not accepted while the
          # architecture is in flux — this is the mechanical half of that policy for the `main` path.)
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::A PR to 'main' must come from a branch in $THIS_REPO, not from fork '$HEAD_REPO'. Promotions are a release action performed inside this repository."
            exit 1
          fi

          case "$HEAD_REF" in
            develop|release/*|hotfix/*)
              echo "OK: '$HEAD_REF' (in $HEAD_REPO) → main (allowed promotion source)" ;;
            *)
              echo "::error::A PR to 'main' must come from 'develop' (or a release/* / hotfix/* promotion branch), not '$HEAD_REF'. Feature work flows feature→develop→main — never feature→main. See .agents/rules/git-branch.md (#1216 incident)."
              exit 1 ;;
          esac

  # INFRA-051: a promotion must CARRY main's ancestry. A squashed sync copies content across without
  # recording the link, so the next promotion re-computes against the old merge base and re-conflicts on
  # exactly the manifests the last sync reconciled (#1415 squashed as bc0ee64ff → #1413 CONFLICTING on five
  # package.json files plus pnpm-lock.yaml). This job blocks the promotion BEFORE it lands; the merge METHOD
  # is enforced separately by the `protect-main` ruleset (`allowed_merge_methods: ["merge"]`).
  #
  # It is a REQUIRED status check on `protect-main`, alongside `main PR source guard` and
  # `release-grade verification` (INFRA-055). Those three are the whole required list for `main`: the
  # former no-op develop contexts were dropped, because on a
  # `main` PR they asserted nothing — see the note above the `build` job.
  promotion-ancestry:
    name: promotion ancestry
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      # INFRA-050: full history, and NO depth-limited fetch anywhere in this job. The verdict is computed
      # from ancestry between origin/main, origin/develop and the PR head; a graft marks commits parentless
      # and `git merge-base --is-ancestor` then answers a different question — silently, in the passing
      # direction.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gate is dependency-free (node:child_process + node:path only, so no `pnpm install`), but it
      # uses `import.meta.dirname` (Node >= 20.11) and top-level await — pin the runtime like every
      # sibling job rather than inheriting whatever the runner image ships.
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Fetch both integration branches
        run: |
          git fetch origin --no-tags \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/develop:refs/remotes/origin/develop

      # PR_HEAD_SHA, never HEAD. On a pull_request event HEAD is GitHub's synthetic refs/pull/N/merge,
      # whose FIRST parent is the base branch — `merge-base --is-ancestor origin/main HEAD` is VACUOUSLY
      # true there and the gate would pass on the very state it exists to reject. The commitlint job below
      # documents the same trap. The scan itself refuses to run on HEAD under a pull_request event.
      - name: Assert the promotion preserves main's ancestry
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/harness/scan-promotion-ancestry.mjs

  # INFRA-104: a promotion must CARRY the closing keywords the pull requests inside it declared.
  # GitHub acts on `Closes #N` only when the pull request targets the DEFAULT branch, so every
  # feature→develop pull request's keyword is read as prose and the issue stays OPEN after merge
  # (measured: #1802 `Closes #1750` and #1816 `Closes #1722`, both merged, both issues open for
  # days). The develop→main promotion is the one pull request whose base IS `main`, so it is where
  # the keywords have to appear — and a body that silently omits one is indistinguishable from a
  # promotion that genuinely closes nothing. `promote.mjs` derives the block; this job is what
  # makes anyone paste it.
  #
  # It is a REQUIRED status check on `protect-main` (owner decision D1, 2026-08-18), which puts
  # INFRA-055's duty on it: a required context must ACTUALLY RUN AND BE ABLE TO FAIL on a `main`
  # pull request. Five contexts on promotion #1427 were echoes whose every real step was gated on
  # `base_ref != 'main'`, and branch protection reported green from jobs that did no work. So this
  # job's `if:` is `== 'main'` — it runs its full check exactly where the check means something —
  # and NO step below is gated on `base_ref`. `scan-main-required-checks.mjs` (R3/R4/R5) refuses
  # any other shape.
  promotion-closes:
    name: promotion closes
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest

    # Read-only, declared rather than inherited. The scan reads three collections through `gh api`
    # — the promotion's commits, each carried pull request's body, and each referenced issue's
    # state — and writes nothing anywhere.
    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      # No `fetch-depth: 0` here, deliberately, and unlike the ancestry gate above: this verdict is
      # computed entirely from the GitHub API (the pull request's commit subjects, not the local
      # graph), so a shallow checkout supplies everything it needs — the scripts themselves.
      - uses: actions/checkout@v7

      # The scan is dependency-free (node:child_process only, so no `pnpm install`), but it is an
      # ES module using top-level await — pin the runtime like every sibling job rather than
      # inheriting whatever the runner image ships.
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Assert the promotion body closes what its commits imply
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/harness/scan-promotion-closes.mjs --pr ${{ github.event.pull_request.number }}

  # Proportional CI classifies the changed capabilities so implementation-shaped child jobs run only
  # when relevant. Those children are not required contexts; `pr-validation` always evaluates their
  # selected/skipped/cancelled/failed results and is the stable required decision on develop. An
  # unreadable classification therefore makes the aggregate fail rather than turning missing work into N/A.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      product: ${{ steps.filter.outputs.product == 'true' || steps.control-plane.outputs.product == 'true' }}
      tui: ${{ steps.filter.outputs.tui }}
      examples: ${{ steps.filter.outputs.examples }}
      windows: ${{ steps.filter.outputs.windows }}
      cli: ${{ steps.filter.outputs.cli }}
      harness: ${{ steps.filter.outputs.harness == 'true' || steps.control-plane.outputs.harness == 'true' }}
      hermetic: ${{ steps.filter.outputs.hermetic == 'true' || steps.control-plane.outputs.hermetic == 'true' }}
      build_machinery: ${{ steps.filter.outputs.build_machinery }}
      workflow: ${{ steps.filter.outputs.workflow == 'true' || steps.control-plane.outputs.workflow == 'true' }}
      dependencies: ${{ steps.filter.outputs.dependencies == 'true' || steps.control-plane.outputs.dependencies == 'true' }}
      full: ${{ steps.filter.outputs.full == 'true' || steps.control-plane.outputs.full == 'true' }}
      product_integration: ${{ steps.product-integration.outputs.applicable == 'true' || steps.control-plane.outputs.product_integration == 'true' }}
      external_units: ${{ steps.external-units.outputs.applicable }}
    steps:
      # Full history is required to compute every merge base. `pr-validation` fails when this
      # selector fails or when any selected child is missing, skipped, cancelled, or failed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0
      - id: control-plane
        name: Force owner jobs for verification control-plane edits
        shell: bash
        env:
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: |
          set -euo pipefail
          harness=false
          hermetic=false
          workflow=false
          dependencies=false
          full=false
          product=false
          product_integration=false
          while IFS= read -r file; do
            case "$file" in
              scripts/harness/*)
                harness=true
                hermetic=true
                ;;
            esac
            case "$file" in
              .github/workflows/*)
                workflow=true
                ;;
            esac
            case "$file" in
              scripts/harness/classify-changed-paths.mjs|scripts/harness/changed-path-capabilities.mjs|scripts/harness/entrypoint.mjs|scripts/harness/git-base-ref-resolution.mjs|scripts/harness/shared.mjs|scripts/harness/manifest-change-classification.mjs|scripts/harness/harness-test-classification.mjs)
                full=true
                ;;
            esac
            case "$file" in
              scripts/harness/product-integration-tests.mjs|scripts/harness/workspace-affected-git.mjs)
                product=true
                product_integration=true
                ;;
            esac
            case "$file" in
              pnpm-lock.yaml|osv-scanner.toml|.github/workflows/dependency-review.yml|.github/workflows/security-scheduled.yml|scripts/harness/generate-dependency-review-license-exemptions.mjs)
                dependencies=true
                ;;
            esac
          done < <(git diff --name-only --no-renames "${BASE_REF}"...HEAD)
          {
            echo "harness=${harness}"
            echo "hermetic=${hermetic}"
            echo "workflow=${workflow}"
            echo "dependencies=${dependencies}"
            echo "full=${full}"
            echo "product=${product}"
            echo "product_integration=${product_integration}"
          } >> "$GITHUB_OUTPUT"
      - id: filter
        name: Classify changed paths and affected capabilities
        env:
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: |
          # The classification lives in scripts/harness/classify-changed-paths.mjs and feeds every
          # selected child plus the `pr-validation` aggregate.
          # Unchanged behaviour (asserted in __tests__/classify-changed-paths.test.mjs): the merge
          # base is computed explicitly and over `--all` for this repo's criss-cross history, and
          # every undeterminable case — no merge base, a failed diff, an empty file list —
          # classifies as CODE so no required check is silently skipped.
          #
          # No `setup-node`: the runner's preinstalled Node runs this (its dependency tree imports
          # only node: builtins), and adding a network-dependent setup step to the job that GATES the
          # required matrix would trade a real risk for a cosmetic one — a flake here makes
          # tui-e2e / examples-typecheck / windows-shell report `skipping`, which branch protection
          # accepts. review-gate.yml has run `node scripts/harness/*.mjs` bare since #1434.
          node scripts/harness/classify-changed-paths.mjs --base-ref "${BASE_REF}"

      - id: product-integration
        name: Select affected product integration and consumer-contract tests
        if: steps.filter.outputs.product == 'true' || steps.filter.outputs.full == 'true' || steps.control-plane.outputs.product == 'true' || steps.control-plane.outputs.full == 'true'
        env:
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: node scripts/harness/product-integration-tests.mjs --base-ref "${BASE_REF}" --github-output

      - id: external-units
        name: Select affected pure unit tests for external contributions
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (steps.filter.outputs.product == 'true' || steps.filter.outputs.full == 'true' || steps.control-plane.outputs.product == 'true' || steps.control-plane.outputs.full == 'true')
        env:
          BASE_REF: ${{ format('origin/{0}', github.base_ref) }}
        run: node scripts/harness/product-integration-tests.mjs --external-units --base-ref "${BASE_REF}" --github-output

  # Develop verification jobs are excluded from `main` PRs at the job level. Main promotions use the
  # dedicated release-grade verification path; develop pull requests use the affected-scope jobs below.
  #
  # Do not re-add work to these jobs for `main` without adding the job back to `protect-main`'s required list
  # AND to `.github/required-status-checks.json` — `scan-main-required-checks.mjs` enforces the converse
  # direction (nothing vacuous may be required).
  build:
    name: build
    if: ${{ (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result == 'success' && (needs.changes.outputs.product == 'true' || needs.changes.outputs.build_machinery == 'true' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    needs: changes
    env:
      FULL_VERIFICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' }}
      PRODUCT_APPLICABLE: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.product == 'true' || needs.changes.outputs.build_machinery == 'true' }}
      CLI_APPLICABLE: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.cli == 'true' }}
      BUILD_MACHINERY_APPLICABLE: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.build_machinery == 'true' }}
    outputs:
      package_dist_required: ${{ steps.build_requirement.outputs.required }}
      package_dist_complete: ${{ steps.build_requirement.outputs.complete }}

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      # INFRA-050: full history, no `--depth` fetch — `harness:plan --base-ref origin/<base>`
      # resolves the affected scopes from a merge-base diff, so a grafted ancestry changes which
      # checks this PR is planned to run at all.
      - uses: actions/checkout@v7
        if: env.PRODUCT_APPLICABLE == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      - name: Install pnpm
        if: env.PRODUCT_APPLICABLE == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        if: env.PRODUCT_APPLICABLE == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        if: env.PRODUCT_APPLICABLE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Plan package-dist artifact membership
        if: env.PRODUCT_APPLICABLE == 'true'
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: |
          mkdir -p .agents/evals/local-metrics
          if [[ "$FULL_VERIFICATION" == "true" ]]; then
            node scripts/harness/workspace-affected.mjs --operation build --full --format json > .agents/evals/local-metrics/workspace-build-plan.json
          else
            node scripts/harness/workspace-affected.mjs --operation build --base-ref "$HARNESS_BASE_REF" --format json > .agents/evals/local-metrics/workspace-build-plan.json
          fi

      - name: Show verification plan
        if: env.PRODUCT_APPLICABLE == 'true'
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: pnpm harness:plan -- --base-ref "$HARNESS_BASE_REF" --report-file .agents/evals/local-metrics/ci-plan.json

      - name: Upload verification plan
        if: env.PRODUCT_APPLICABLE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verification-plan
          path: .agents/evals/local-metrics/ci-plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Detect build requirement
        id: build_requirement
        if: env.PRODUCT_APPLICABLE == 'true'
        env:
          FULL_VERIFICATION: ${{ env.FULL_VERIFICATION }}
          BUILD_MACHINERY_APPLICABLE: ${{ env.BUILD_MACHINERY_APPLICABLE }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync('.agents/evals/local-metrics/ci-plan.json', 'utf8'));
          const workspaceBuildPlan = JSON.parse(readFileSync('.agents/evals/local-metrics/workspace-build-plan.json', 'utf8'));
          const cleanFrameworkProof = process.env.BUILD_MACHINERY_APPLICABLE === 'true';
          appendFileSync(process.env.GITHUB_OUTPUT, `clean_framework_proof=${cleanFrameworkProof}\n`);
          const checksRequiringPackageDist = new Set(['build', 'test', 'typecheck']);
          const required = workspaceBuildPlan.mode === 'global' || process.env.FULL_VERIFICATION === 'true' || plan.scopes.some((scope) =>
            scope.checks.some((check) => checksRequiringPackageDist.has(check)),
          );
          const agentAppRequired = process.env.FULL_VERIFICATION === 'true' || plan.scopes.some(
            (scope) => scope.scope === 'apps/agent-app',
          );
          appendFileSync(process.env.GITHUB_OUTPUT, `required=${required ? 'true' : 'false'}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `complete=${process.env.FULL_VERIFICATION === 'true' ? 'true' : 'false'}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `agent_app_required=${agentAppRequired ? 'true' : 'false'}\n`);
          const artifactContractsRequired = process.env.FULL_VERIFICATION === 'true' || cleanFrameworkProof || plan.scopes.some(
            (scope) => scope.scope.startsWith('packages/'),
          );
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact_contracts_required=${artifactContractsRequired ? 'true' : 'false'}\n`);
          const artifactTestsRequired = process.env.FULL_VERIFICATION === 'true' || cleanFrameworkProof;
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact_tests_required=${artifactTestsRequired ? 'true' : 'false'}\n`);

          if (required) {
            console.log('Package or app verification requires the root monorepo build output.');
          } else {
            console.log('No package or app verification requires build output.');
          }
          EOF

      # #2653: prove a clean partial build, not a partial build warmed by the full build below.
      - name: Clean framework-only build and regression proof
        id: clean_framework_proof
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.clean_framework_proof == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/harness/workspace-affected.mjs --operation build --changed-file packages/agent-framework/src/index.ts --format json > "$RUNNER_TEMP/framework-build-plan.json"
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { lstatSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          import { readWorkspaceGraph } from './scripts/harness/workspace-graph.mjs';
          const plan = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'framework-build-plan.json'), 'utf8'));
          assert.equal(plan.mode, 'packages');
          assert.equal(plan.globalFallback, false);
          for (const name of ['@robota-sdk/agent-framework', '@robota-sdk/agent-provider-replay', '@robota-sdk/agent-session-analytics', '@robota-sdk/agent-provider-openai-compatible']) {
            assert.ok(plan.packages.some((pkg) => pkg.name === name), `missing producer: ${name}`);
          }
          for (const pkg of readWorkspaceGraph(process.cwd()).packages) {
            if (!pkg.directory.startsWith('packages/')) continue;
            for (const output of ['dist', '.robota-artifacts']) {
              assert.equal(lstatSync(path.join(pkg.directory, output), { throwIfNoEntry: false }), undefined, `clean proof requires absent ${pkg.directory}/${output}`);
            }
          }
          console.log(`Clean framework proof: packages=${plan.packages.length}, globalFallback=${plan.globalFallback}`);
          console.log(plan.packages.map((pkg) => pkg.name).join('\n'));
          EOF
          node scripts/harness/workspace-affected-run.mjs --operation build --changed-file packages/agent-framework/src/index.ts
          pnpm --filter @robota-sdk/agent-framework exec vitest run --no-cache \
            src/interactive/__tests__/interactive-session-background-tasks.test.ts \
            src/testing/__tests__/session-log-external-payload-replay-functional.test.ts \
            src/testing/__tests__/usage-assertion-functional.test.ts
          node scripts/harness/workspace-affected-run.mjs --operation test --changed-file packages/agent-framework/src/index.ts

      - name: Build full or affected workspace
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.required == 'true'
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: |
          if [[ "$FULL_VERIFICATION" == "true" ]]; then
            pnpm build
          else
            pnpm build:affected
          fi

      - name: Archive package build output
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.required == 'true'
        shell: bash
        run: node scripts/artifacts/transfer.mjs export --plan .agents/evals/local-metrics/workspace-build-plan.json --archive package-dist.tgz

      - name: Upload package build output
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: package-dist
          path: package-dist.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Build-output contracts scan (dist-dependent)
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.artifact_contracts_required == 'true'
        run: pnpm harness:scan:build-contracts

      - name: Verify artifact generation, exact pack and release-path regressions
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.artifact_tests_required == 'true'
        run: pnpm exec vitest run scripts/artifacts/__tests__

      # ARCH-2164: these valid-wire product paths were previously exercised only by scripts that no
      # required check invoked. Keep them inside the already-required build job and only select them
      # when the affected-scope plan includes the desktop app (or verification fails closed to full).
      - name: Build desktop Electron app for e2e
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.agent_app_required == 'true'
        run: pnpm --filter @robota-sdk/agent-app build

      - name: Desktop Electron session e2e
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.agent_app_required == 'true'
        run: pnpm --filter @robota-sdk/agent-app test:e2e

      - name: Desktop Electron usage and protocol reachability e2e
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.agent_app_required == 'true'
        run: xvfb-run -a pnpm --filter @robota-sdk/agent-app test:e2e:usage

      - name: Binary e2e (agent-cli bintests, dist-dependent)
        if: env.CLI_APPLICABLE == 'true'
        run: pnpm --filter @robota-sdk/agent-cli test:bin

  # Pure unit and bugfix RED/GREEN evidence are local-owned for same-repository work. This job runs
  # only the separately named integration/contract/e2e files belonging to changed packages or their
  # manifest consumers.
  # The selector executes in `changes`, so a product change with no such test does not start a runner.
  product-integration:
    name: product-integration
    needs: [changes, build]
    if: ${{ (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result == 'success' && needs.build.result == 'success' && needs.changes.outputs.product_integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download clean affected build output
        if: needs.build.outputs.package_dist_required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: package-dist
          path: .artifacts/package-dist

      - name: Restore clean affected build output
        if: needs.build.outputs.package_dist_required == 'true'
        run: node scripts/artifacts/transfer.mjs restore --archive .artifacts/package-dist/package-dist.tgz

      - name: Guarantee selected integration consumer dist
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        shell: bash
        run: |
          mapfile -t targets < <(node scripts/harness/product-integration-tests.mjs --base-ref "$HARNESS_BASE_REF" --build-targets)
          args=()
          for target in "${targets[@]}"; do args+=(--changed-file "$target"); done
          [[ "${#args[@]}" -gt 0 ]] || { echo "::error::selected product-integration job has no build targets"; exit 1; }
          pnpm harness:workspace:run -- --operation build "${args[@]}"

      - name: Run affected integration and consumer-contract tests
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: node scripts/harness/product-integration-tests.mjs --base-ref "$HARNESS_BASE_REF"

  # External contributors cannot supply trusted local review evidence, so fork PRs get a bounded
  # affected pure-unit lane in addition to the normal integration lane. Same-repository PRs skip it.
  external-units:
    name: external-units
    needs: [changes, build]
    if: ${{ (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result == 'success' && needs.build.result == 'success' && needs.changes.outputs.external_units == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download clean affected build output
        if: needs.build.outputs.package_dist_required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: package-dist
          path: .artifacts/package-dist

      - name: Restore clean affected build output
        if: needs.build.outputs.package_dist_required == 'true'
        run: node scripts/artifacts/transfer.mjs restore --archive .artifacts/package-dist/package-dist.tgz

      - name: Guarantee selected unit-test consumer dist
        env:
          HARNESS_BASE_REF: ${{ format('origin/{0}', github.base_ref) }}
        shell: bash
        run: |
          mapfile -t targets < <(node scripts/harness/product-integration-tests.mjs --external-units --base-ref "$HARNESS_BASE_REF" --build-targets)
          args=()
          for target in "${targets[@]}"; do args+=(--changed-file "$target"); done
          [[ "${#args[@]}" -gt 0 ]] || { echo "::error::selected external-units job has no build targets"; exit 1; }
          pnpm harness:workspace:run -- --operation build "${args[@]}"

      - name: Run affected pure unit tests for external contributions
        env:
          HARNESS_BASE_REF: ${{ format('origin/{0}', github.base_ref) }}
        run: node scripts/harness/product-integration-tests.mjs --external-units --base-ref "$HARNESS_BASE_REF"

  # Issue #2826: each responsibility is independently retriable and publishes its own output.
  repo-checks:
    name: repo-checks
    needs: changes
    if: ${{ (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      # INFRA-050: full history. `harness:scan` contains a base-history gate
      # (check-document-authority.mjs diffs `origin/$GITHUB_BASE_REF...HEAD`). On the former
      # depth-50 checkout `origin/<base>` did not exist at all, so that scan fell back to its own
      # `--depth=50` fetch — a graft — and then reported SKIPPED ("not a pass") while the suite
      # still exited 0. A complete checkout makes the ref resolve directly and the gate enforce.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Restore independently proven scan successes
        id: scan-success-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/robota-scan-successes
          key: robota-scan-success-v2-${{ runner.os }}-node22-${{ github.event.pull_request.head.sha || inputs.head_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            robota-scan-success-v2-${{ runner.os }}-node22-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pull request runs only repository checks selected by the changed-path classifier.
      # Contract and hermetic suites have independent jobs below, so each responsibility can retry
      # without rerunning this repository scan. The complete harness remains reachable through
      # `scans-full.yml`.
      - name: Run affected repository checks
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
          # Issue #2412: the head the per-commit history scans end at (on pull_request, HEAD is the
          # synthetic merge ref); `scan-ci-base-history` refuses a per-commit job without it.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          scan_args=(harness:scan -- --skip dist --skip build-contracts --affected --context pr --base "${HARNESS_BASE_REF}")
          pnpm "${scan_args[@]}"

      - name: Persist independently proven scan successes
        if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: .cache/robota-scan-successes
          key: ${{ steps.scan-success-cache.outputs.cache-primary-key }}

  harness-contracts:
    name: harness-contracts
    needs: changes
    if: ${{ (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result == 'success' && (needs.changes.outputs.harness == 'true' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - name: Restore validated contract-test successes
        id: contract-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/robota-contract-tests
          key: robota-contract-tests-v3-${{ runner.os }}-node22-${{ github.event.pull_request.head.sha || inputs.head_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            robota-contract-tests-v3-${{ runner.os }}-node22-
      - run: pnpm install --frozen-lockfile
      - name: Run affected harness contracts
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: pnpm harness:test:contracts:affected -- --base-ref "${HARNESS_BASE_REF}" --head-ref HEAD
      - name: Persist independently proven contract successes
        if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: .cache/robota-contract-tests
          key: ${{ steps.contract-cache.outputs.cache-primary-key }}

  harness-hermetic:
    name: harness-hermetic
    needs: changes
    if: ${{ (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result == 'success' && (needs.changes.outputs.hermetic == 'true' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run harness behavior in a stripped repository
        run: pnpm harness:test:hermetic

  dependency-security:
    name: dependency-security
    needs: changes
    if: ${{ (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result == 'success' && needs.changes.outputs.dependencies == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      # INFRA-050: full history, no `--depth` fetch. This is a REQUIRED check (on `protect-develop`)
      # whose only real work is gated on a merge-base diff — a grafted ancestry could gate the
      # vulnerability scan off a wrong file list and pass in seconds having scanned nothing.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      # INFRA-038: npm retired the legacy audit endpoint (pnpm audit → 410). osv-scanner reads the pnpm lockfile
      # directly (OSV.dev DB) — no pnpm/node install needed; it fails on any un-ignored vuln; re-accepts live in
      # osv-scanner.toml (single SSOT).
      - name: Vulnerability scan (osv-scanner) for dependency graph changes
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o "$RUNNER_TEMP/osv-scanner"
          # INFRA-061: verify BEFORE chmod +x — a mismatch must stop the job, not run and then complain.
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml --lockfile pnpm-lock.yaml

  dependency-policy:
    name: dependency-policy
    needs: changes
    if: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && needs.changes.result == 'success' && needs.changes.outputs.dependencies == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/dependency-review.yml

  secret-scan:
    name: secret-scan
    if: ${{ (github.base_ref || inputs.base_ref) != 'main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/gitleaks.yml
    with:
      base_ref: ${{ github.base_ref || inputs.base_ref }}
      head_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}

  security:
    name: security
    needs: [changes, dependency-security, dependency-policy, secret-scan]
    if: ${{ always() && (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result != '' && needs.dependency-security.result != '' && needs.dependency-policy.result != '' && needs.secret-scan.result != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the selected security decision
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-security.result }}
          POLICY_RESULT: ${{ needs.dependency-policy.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCIES_APPLICABLE: ${{ needs.changes.outputs.dependencies == 'true' }}
          POLICY_APPLICABLE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true' }}
        run: |
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "::error::changed-path selection concluded $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$SECRET_RESULT" != success ]]; then
            echo "::error::secret detection concluded $SECRET_RESULT"
            exit 1
          fi
          if [[ "$DEPENDENCIES_APPLICABLE" == true ]]; then
            if [[ "$DEPENDENCY_RESULT" != success ]]; then
              echo "::error::selected vulnerability check concluded $DEPENDENCY_RESULT"
              exit 1
            fi
          elif [[ "$DEPENDENCY_RESULT" != skipped ]]; then
            echo "::error::unselected vulnerability check concluded $DEPENDENCY_RESULT"
            exit 1
          fi
          if [[ "$POLICY_APPLICABLE" == true && "$POLICY_RESULT" != success ]]; then
            echo "::error::selected dependency policy concluded $POLICY_RESULT"
            exit 1
          fi
          if [[ "$POLICY_APPLICABLE" != true && "$POLICY_RESULT" != skipped ]]; then
            echo "::error::unselected dependency policy concluded $POLICY_RESULT"
            exit 1
          fi

  # INFRA-055: the REQUIRED content gate for a promotion. It is the only required context on `protect-main`
  # that executes the repository's code, and it qualifies as required because it always reaches a conclusion
  # on every PR to `main`: the workflow carries no `paths`/`paths-ignore` filter, this job has no `needs:`,
  # no matrix and no `continue-on-error`, and every step below is unconditional. Diff shape cannot change
  # that — a docs-only promotion, an enormous promotion, a merge-commit head and a tree identical to
  # `develop` all run the same steps. An infrastructure failure (install, artifact download) turns it RED
  # and blocks the promotion until it is re-run, which is the correct direction for a release gate and is
  # always satisfiable; what disqualifies a required check is being unable to REPORT, not being able to fail.
  release-grade-verify:
    name: release-grade verification
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'

    steps:
      # INFRA-050: full history — `harness:verify:release` runs the scan suite, which contains a
      # base-history gate used by the repository-check suite.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # INFRA-051: this job runs `harness:scan`, which now includes the promotion-ancestry gate, and
      # this job only runs when `base_ref == 'main'` — i.e. always in a promotion context. The runner
      # sets GITHUB_BASE_REF and GITHUB_EVENT_NAME but NOT the PR head sha, and the gate REFUSES to
      # evaluate `HEAD` on a pull_request event (it is refs/pull/N/merge, whose first parent is the
      # base — A1/A3 would pass vacuously). Without this env the gate would fail closed here and turn
      # this job red on every promotion PR, including a correctly built one. Supplying the head sha is
      # the fix; making the gate skip when it cannot resolve a head would recreate INFRA-050's
      # silently-skipped-but-green shape.
      - name: Run release-grade verification
        env:
          # INFRA-088: `main` is the event/promotion context, but the promotion introduces no content
          # beyond the already-verified develop tree. Diff-sensitive novelty scans must therefore
          # compare to develop; promotion-ancestry still reads the untouched GITHUB_BASE_REF=main.
          HARNESS_BASE_REF: origin/develop
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm harness:verify:release

      # INFRA-038: osv-scanner (pnpm-lockfile-based) — the retired npm audit endpoint broke `pnpm audit`.
      - name: Vulnerability scan (osv-scanner)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o "$RUNNER_TEMP/osv-scanner"
          # INFRA-061: verify BEFORE chmod +x — a mismatch must stop the job, not run and then complain.
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml --lockfile pnpm-lock.yaml

  # INFRA-065 half 1. `scan-action-references` verifies that every `uses:` REFERENCE resolves — which
  # is what caught `vercel/action@v1`, and which actionlint does not check. The reverse is also true,
  # and this job is that half: expression syntax and context typing, `run:` block shellcheck, and
  # job/step schema errors GitHub accepts silently.
  #
  # Actionlint is selected independently so it can be retried without rerunning repository or
  # harness checks. `pr-validation` aggregates the result when workflow files changed.
  #
  # It is not a standalone protected context; when selected, its result is transitively required by
  # `pr-validation`. This keeps the protection interface stable without making a red advisory.
  #
  # Measured before landing: actionlint 1.7.7 reports ZERO problems across this repository's
  # workflows, so it arrives clean rather than with a backlog to acknowledge.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result == 'success' && needs.changes.outputs.workflow == 'true' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}

      - name: Lint workflow files
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          # Verified BEFORE extraction, so a swapped archive is never unpacked, let alone run.
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          chmod +x "$RUNNER_TEMP/actionlint"
          # `shellcheck` is preinstalled on ubuntu-latest, and it is HALF of what this job is for.
          # Without it actionlint prints `Rule "shellcheck" was disabled` and exits 0 — measured
          # locally, where a deliberately broken `run:` block drew no comment at all. A check that
          # turns half of itself off and still reports success is the shape this repository keeps
          # finding, so its presence is asserted rather than assumed.
          command -v shellcheck >/dev/null || {
            echo "::error::actionlint: shellcheck is absent, so run-block linting would be silently skipped."
            exit 1
          }
          "$RUNNER_TEMP/actionlint" -color

  examples-typecheck:
    name: examples-typecheck
    runs-on: ubuntu-latest
    # `build` joins `changes` so selected examples can reuse package output.
    needs: [changes, build]
    env:
      FULL_VERIFICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' }}
      EXAMPLES_APPLICABLE: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.examples == 'true' }}
    # A failed selector/build skips this child; `pr-validation` sees that result and fails closed.
    if: ${{ (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result == 'success' && (needs.changes.outputs.examples == 'true' || needs.changes.outputs.full == 'true') }}

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      - uses: actions/checkout@v7
        if: env.EXAMPLES_APPLICABLE == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      - name: Install pnpm
        if: env.EXAMPLES_APPLICABLE == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        if: env.EXAMPLES_APPLICABLE == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        if: env.EXAMPLES_APPLICABLE == 'true'
        run: pnpm install --frozen-lockfile

      # Reuse the build the `build` job already produced and uploaded, instead of repeating it.
      # Measured: this job spent about 80% of its runtime rebuilding what another job had just built,
      # and billing counts that wall clock. Other consumer jobs use the same artifact contract.
      #
      # The fallback is not optional: `build` uploads only when the run needs package dist, and a
      # required check that assumes an artifact is present would go from "slow" to "broken" the first
      # time it is absent. `continue-on-error` keeps a missing artifact on the fallback path rather
      # than failing the gate.
      - name: Download package build output
        id: dist
        if: env.EXAMPLES_APPLICABLE == 'true' && needs.build.outputs.package_dist_required == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: package-dist
          path: .artifacts/package-dist

      - name: Restore package build output
        id: restore
        if: env.EXAMPLES_APPLICABLE == 'true' && steps.dist.outcome == 'success'
        run: |
          node scripts/artifacts/transfer.mjs restore --archive .artifacts/package-dist/package-dist.tgz
          echo "restored=true" >> "$GITHUB_OUTPUT"

      # A restored affected archive is intentionally incomplete. Resolve the affected examples,
      # then synthesize those owners into one build plan so their complete dependency dist closure
      # exists without traversing unrelated reverse dependents.
      - name: Guarantee affected example consumer dist
        if: env.EXAMPLES_APPLICABLE == 'true' && (steps.restore.outputs.restored != 'true' || needs.build.outputs.package_dist_complete != 'true')
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        shell: bash
        run: |
          if [[ "$FULL_VERIFICATION" == "true" ]]; then
            pnpm build
            exit 0
          fi
          plan_file="${RUNNER_TEMP}/examples-affected-plan.json"
          targets_file="${RUNNER_TEMP}/examples-affected-targets.txt"
          node scripts/harness/workspace-affected.mjs --operation examples-typecheck --base-ref "$HARNESS_BASE_REF" --format json >"$plan_file"
          PLAN_FILE="$plan_file" node --input-type=module <<'EOF' >"$targets_file"
          import { readFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync(process.env.PLAN_FILE, 'utf8'));
          if (plan.mode === 'global' && Array.isArray(plan.packages)) {
            console.log('global');
            process.exit(0);
          }
          if (plan.mode !== 'packages' || !Array.isArray(plan.packages) || plan.packages.length === 0 ||
              plan.packages.some((item) => typeof item?.directory !== 'string' ||
                item.directory.trim().length === 0)) {
            console.error('Invalid example consumer plan: expected package targets or global mode');
            process.exit(2);
          }
          for (const item of plan.packages) console.log(`${item.directory}/__ci_consumer_target__.ts`);
          EOF
          mapfile -t targets <"$targets_file"
          if [[ "${targets[0]}" == global ]]; then
            pnpm build
            exit 0
          fi
          args=(harness:workspace:run -- --operation build)
          for target in "${targets[@]}"; do args+=(--changed-file "$target"); done
          pnpm "${args[@]}"

      - name: Typecheck examples
        if: env.EXAMPLES_APPLICABLE == 'true'
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: |
          if [[ "$FULL_VERIFICATION" == "true" ]]; then
            pnpm examples:typecheck
          else
            pnpm examples:typecheck:affected
          fi

  # TERM-007 item 2 / TERM-008: verify cross-platform shell execution on real Windows.
  # The resolver + Shell tool spawn PowerShell here, so these tests exercise the win32 path
  # that the macOS/Linux jobs (and mocked-platform unit tests) cannot. Blocking: first run
  # passed green on windows-latest (PR #900, 1m34s), so Windows shell execution is now a
  # maintained on relevant Windows-sensitive changes rather than a one-off pass.
  windows-shell:
    name: windows-shell
    runs-on: windows-latest
    needs: changes
    env:
      WINDOWS_APPLICABLE: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.windows == 'true' }}
    # A failed selector skips this child; `pr-validation` sees that result and fails closed.
    if: ${{ (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result == 'success' && (needs.changes.outputs.windows == 'true' || needs.changes.outputs.full == 'true') }}

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      - uses: actions/checkout@v7
        if: env.WINDOWS_APPLICABLE == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 50

      - name: Install pnpm
        if: env.WINDOWS_APPLICABLE == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        if: env.WINDOWS_APPLICABLE == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        if: env.WINDOWS_APPLICABLE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build agent-core + agent-process + agent-executor for dependent tests
        if: env.WINDOWS_APPLICABLE == 'true'
        # CORE-023: shell-tool now imports @robota-sdk/agent-process (killProcessTree); this
        # minimal job resolves workspace deps from built dist, so agent-process must be built too.
        run: pnpm --filter @robota-sdk/agent-core --filter @robota-sdk/agent-process --filter @robota-sdk/agent-executor build

      - name: Verify native Windows generation replacement and recovery
        if: env.WINDOWS_APPLICABLE == 'true'
        run: pnpm exec vitest run scripts/artifacts/__tests__/generation.test.mjs scripts/artifacts/__tests__/manifest.test.mjs

      # INFRA-058: `pnpm exec vitest`, NOT `pnpm ... test -- --run <pattern>`. Both packages' `test`
      # script is `vitest run --passWithNoTests`, and a name-FILTERED run through it reports success on
      # zero matches — MEASURED locally: renaming `platform-shell.test.ts` to `shell-resolver.test.ts`
      # made the identical command print `No test files found, exiting with code 0` and exit 0. An
      # ordinary rename would therefore have left this REQUIRED check green while executing nothing,
      # on the only runner in the matrix that can exercise win32 at all. The flag cannot be overridden
      # on the command line (vitest's cac rejects a repeated `--passWithNoTests`: "Expected a single
      # value ... received [true, false]"), so the script indirection is bypassed instead. Invoking
      # vitest directly resolves the same per-package config and exits 1 when the filter matches
      # nothing — the whole point of selecting tests by name here.
      # INFRA-064: the `platform-shell` step is GONE, and the reason is what it claimed rather than
      # what it cost. `resolvePlatformShell(env, platform)` takes the platform as an ARGUMENT — it
      # reads no `process.platform` and spawns nothing — so its verdict on windows-latest is
      # identical to its verdict anywhere else. A step on this runner asserts, by being here, that
      # something about it needs Windows. That one did not, and a job whose stated coverage is wider
      # than its real coverage is the defect, independent of runtime.
      #
      # THE COST ARGUMENT IN THE ITEM DOES NOT HOLD, and the measurement is why this comment says so:
      # the step took 2s of a ~103s job (checkout 8s, pnpm install 42s, build 7s, teardown 20s). The
      # expensive part is standing the runner up, and the step below still needs it. Removing this
      # saves about 2% of one job — worth doing for the claim it was making, not for the seconds.
      #
      # NO COVERAGE IS LOST, and the argument is stronger than "it runs somewhere else too". A pure
      # function's verdict cannot change unless its subject or its test changes; both live in
      # `agent-core`, and a change to `agent-core` is exactly what puts it in `harness:verify`'s
      # scope. Touching `platform-shell.ts` selects the affected package build, test, lint, and
      # typecheck checks in pull-request verification.
      - name: Verify the Shell tool actually spawns PowerShell on Windows
        if: env.WINDOWS_APPLICABLE == 'true'
        # The genuinely win32-only half: it SPAWNS a real shell and asserts PowerShell answers. No
        # Linux or macOS runner can execute this, which is what buys the runner the job runs on.
        run: pnpm --filter @robota-sdk/agent-tools exec vitest run shell-tool

      - name: Verify executor runners use default PowerShell
        if: env.WINDOWS_APPLICABLE == 'true'
        shell: pwsh
        run: |
          $env:ROBOTA_SCENARIO_OUTPUT = "$env:RUNNER_TEMP\arch-026-windows-shell.json"
          pnpm --dir packages/agent-executor run scenario:verify:windows-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ARCH-026 Windows scenario evidence
        if: env.WINDOWS_APPLICABLE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: arch-026-windows-shell-${{ github.run_id }}
          path: ${{ runner.temp }}/arch-026-windows-shell.json
          if-no-files-found: error

  # TEST-010: run the TUI PTY E2E suite (`*.ptytest.ts`) against the BUILT robota binary on every PR,
  # so the live-TUI behaviours — the SCREEN-013 Ctrl+B drill-in entry point and the existing
  # flag/scrollback/handoff PTY checks — are maintained, not bit-rotting outside CI.
  tui-e2e:
    name: tui-e2e
    runs-on: ubuntu-latest
    # See examples-typecheck: selected TUI work reuses the build artifact when available.
    needs: [changes, build]
    env:
      FULL_VERIFICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' }}
      TUI_APPLICABLE: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.tui == 'true' }}
    # A failed selector/build skips this child; `pr-validation` sees that result and fails closed.
    if: ${{ (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result == 'success' && (needs.changes.outputs.tui == 'true' || needs.changes.outputs.full == 'true') }}

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      - uses: actions/checkout@v7
        if: env.TUI_APPLICABLE == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      - name: Install pnpm
        if: env.TUI_APPLICABLE == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        if: env.TUI_APPLICABLE == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        if: env.TUI_APPLICABLE == 'true'
        run: pnpm install --frozen-lockfile

      # Reuse the build the `build` job already produced and uploaded, instead of repeating it.
      # Measured: this job spent about 80% of its runtime rebuilding what another job had just built,
      # and billing counts that wall clock. Other consumer jobs use the same artifact contract.
      #
      # The fallback is not optional: `build` uploads only when the run needs package dist, and a
      # required check that assumes an artifact is present would go from "slow" to "broken" the first
      # time it is absent. `continue-on-error` keeps a missing artifact on the fallback path rather
      # than failing the gate.
      - name: Download package build output
        id: dist
        if: env.TUI_APPLICABLE == 'true' && needs.build.outputs.package_dist_required == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: package-dist
          path: .artifacts/package-dist

      - name: Restore package build output
        id: restore
        if: env.TUI_APPLICABLE == 'true' && steps.dist.outcome == 'success'
        run: |
          node scripts/artifacts/transfer.mjs restore --archive .artifacts/package-dist/package-dist.tgz
          echo "restored=true" >> "$GITHUB_OUTPUT"

      # PTY tests execute the CLI/TUI target, not merely the changed owner. Complete exactly those
      # targets' dependency graph after any partial restore; do not traverse reverse dependents.
      - name: Guarantee CLI and TUI consumer dist
        if: env.TUI_APPLICABLE == 'true' && (steps.restore.outputs.restored != 'true' || needs.build.outputs.package_dist_complete != 'true')
        run: pnpm harness:workspace:run -- --operation build --changed-file packages/agent-cli/src/__ci_consumer_target__.ts --changed-file packages/agent-ui-terminal/src/__ci_consumer_target__.ts

      - name: Run the TUI PTY E2E suite against the real binary
        if: env.TUI_APPLICABLE == 'true'
        run: pnpm --filter @robota-sdk/agent-ui-terminal test:pty

  pr-validation:
    name: pr-validation
    needs:
      - changes
      - build
      - repo-checks
      - harness-contracts
      - harness-hermetic
      - actionlint
      - examples-typecheck
      - windows-shell
      - tui-e2e
      - product-integration
      - external-units
    if: ${{ always() && (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result != '' && needs.build.result != '' && needs.repo-checks.result != '' && needs.harness-contracts.result != '' && needs.harness-hermetic.result != '' && needs.actionlint.result != '' && needs.examples-typecheck.result != '' && needs.windows-shell.result != '' && needs.tui-e2e.result != '' && needs.product-integration.result != '' && needs.external-units.result != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate selected verification without rerunning it
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          REPO_CHECKS_RESULT: ${{ needs.repo-checks.result }}
          CONTRACTS_RESULT: ${{ needs.harness-contracts.result }}
          HERMETIC_RESULT: ${{ needs.harness-hermetic.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          EXAMPLES_RESULT: ${{ needs.examples-typecheck.result }}
          WINDOWS_RESULT: ${{ needs.windows-shell.result }}
          TUI_RESULT: ${{ needs.tui-e2e.result }}
          PRODUCT_INTEGRATION_RESULT: ${{ needs.product-integration.result }}
          EXTERNAL_UNITS_RESULT: ${{ needs.external-units.result }}
          PRODUCT_APPLICABLE: ${{ needs.changes.outputs.product == 'true' || needs.changes.outputs.build_machinery == 'true' || needs.changes.outputs.full == 'true' }}
          HARNESS_APPLICABLE: ${{ needs.changes.outputs.harness == 'true' || needs.changes.outputs.full == 'true' }}
          HERMETIC_APPLICABLE: ${{ needs.changes.outputs.hermetic == 'true' || needs.changes.outputs.full == 'true' }}
          WORKFLOW_APPLICABLE: ${{ needs.changes.outputs.workflow == 'true' }}
          EXAMPLES_APPLICABLE: ${{ needs.changes.outputs.examples == 'true' || needs.changes.outputs.full == 'true' }}
          WINDOWS_APPLICABLE: ${{ needs.changes.outputs.windows == 'true' || needs.changes.outputs.full == 'true' }}
          TUI_APPLICABLE: ${{ needs.changes.outputs.tui == 'true' || needs.changes.outputs.full == 'true' }}
          PRODUCT_INTEGRATION_APPLICABLE: ${{ needs.changes.outputs.product_integration == 'true' }}
          EXTERNAL_UNITS_APPLICABLE: ${{ needs.changes.outputs.external_units == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1" result="$2" applicable="$3"
            if [[ "$applicable" == true && "$result" != success ]]; then
              echo "::error::${name} was selected but concluded ${result}"
              return 1
            fi
            if [[ "$applicable" != true && "$result" != skipped ]]; then
              echo "::error::${name} was not selected but concluded ${result}; selection and execution disagree"
              return 1
            fi
          }

          [[ "$CHANGES_RESULT" == success ]] || {
            echo "::error::changed-path selection concluded ${CHANGES_RESULT}"
            exit 1
          }
          [[ "$REPO_CHECKS_RESULT" == success ]] || {
            echo "::error::repo-checks concluded ${REPO_CHECKS_RESULT}"
            exit 1
          }

          failed=0
          check build "$BUILD_RESULT" "$PRODUCT_APPLICABLE" || failed=1
          check harness-contracts "$CONTRACTS_RESULT" "$HARNESS_APPLICABLE" || failed=1
          check harness-hermetic "$HERMETIC_RESULT" "$HERMETIC_APPLICABLE" || failed=1
          check actionlint "$ACTIONLINT_RESULT" "$WORKFLOW_APPLICABLE" || failed=1
          check examples-typecheck "$EXAMPLES_RESULT" "$EXAMPLES_APPLICABLE" || failed=1
          check windows-shell "$WINDOWS_RESULT" "$WINDOWS_APPLICABLE" || failed=1
          check tui-e2e "$TUI_RESULT" "$TUI_APPLICABLE" || failed=1
          check product-integration "$PRODUCT_INTEGRATION_RESULT" "$PRODUCT_INTEGRATION_APPLICABLE" || failed=1
          check external-units "$EXTERNAL_UNITS_RESULT" "$EXTERNAL_UNITS_APPLICABLE" || failed=1
          exit "$failed"
