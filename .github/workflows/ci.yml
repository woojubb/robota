name: CI

on:
  pull_request:
    branches: [main, develop]
    # INFRA-055: `edited` is NOT in GitHub's default activity set (`opened`, `synchronize`,
    # `reopened`), and retargeting a PR's BASE BRANCH fires `edited` — not `synchronize`. Without it
    # the whole `main`-only pipeline is bypassable through the GitHub UI in two clicks, MEASURED on
    # throwaway PR #1442 (2026-07-26): a feature branch was opened against `develop`, went green, and
    # was then retargeted to `main`. No workflow re-dispatched (the four run ids for head sha
    # `e4806e4f` were identical before and after), so `main PR source guard`, `promotion ancestry` and
    # `release-grade verification` kept the `SKIPPED` conclusions they had earned as a develop PR —
    # and a skipped required check is ACCEPTED by branch protection (INFRA-050). `gh pr view 1442`
    # then reported `mergeStateStatus: CLEAN, mergeable: MERGEABLE`: a feature branch, one click from
    # landing on `main`, past every gate INFRA-051 and INFRA-055 exist to enforce.
    #
    # A title/body edit therefore re-dispatches the full workflow. That cost is deliberate: gating the
    # jobs on `github.event.changes.base != null` so a title edit skips them instead would be WORSE
    # than the disease — a skipped job publishes a `skipped` check run that REPLACES the previous
    # `success` for the same head sha, so editing a PR's title would erase its verification and leave
    # it mergeable on skipped required checks. Re-running is the only conclusion-preserving option.
    #
    # That same property has ONE benign instance here, and it is benign only for a reason that could
    # be undone by accident: a develop→main retarget re-dispatches this workflow, and the four
    # develop-side jobs then publish `skipped` over the `success` they had earned against `develop`.
    # That is harmless ONLY because `build`/`quality`/`scans`/`dependency audit` are no longer required
    # on `protect-main`. Putting any of them back in that required list would make a retarget erase
    # its own evidence. `scan-main-required-checks.mjs` is what refuses that combination.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch or commit used by the PR-free required-check benchmark
        required: true
        default: develop
        type: string
      head_ref:
        description: Head branch or commit to verify
        required: true
        default: develop
        type: string
      pr_body:
        description: Optional synthetic PR body consumed by lane and regression-proof checks
        required: false
        default: "## Background\n\nPR-free required-check benchmark."
        type: string

# One in-flight run per PR. `edited` makes a second dispatch for the same head sha routine (this
# harness edits PR bodies after opening), and two runs publishing a check run per context means a
# flake in EITHER decides the merge verdict — nondeterminism in the required-check set, in the change
# whose whole subject is required-check integrity. Keyed on the PR number, not the ref, so a retarget
# supersedes the previous run rather than racing it. Fails closed: a cancelled run reports
# `cancelled`, which is not `success` and does not satisfy a required check.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('benchmark-{0}-{1}', inputs.base_ref, inputs.head_ref) }}
  cancel-in-progress: true

# INFRA-061: osv-scanner is downloaded from a GitHub release and then EXECUTED, in TWO jobs below —
# one of which (`dependency audit`) is a REQUIRED status check. Pinning the version does not pin the
# bytes: a release asset can be replaced under an existing tag, so an unverified download is arbitrary
# code execution on a runner that has the repository checked out. Running an unverified binary to prove
# the tree is clean inverts the point of the job. Both call sites now verify this digest before
# `chmod +x`, and both read it from here so the two can never drift apart.
# Recompute when bumping the version:
#   curl -fsSL https://github.com/google/osv-scanner/releases/download/<version>/osv-scanner_linux_amd64 | sha256sum -
# Kept identical to security-scheduled.yml's pin — same scanner, same bytes, one accepted-risk SSOT.
env:
  OSV_SCANNER_VERSION: v2.0.2
  OSV_SCANNER_SHA256: 3abcfd7126c453a00421487e721b296e0cb68085bd431d6cef60872774170fc8
  # INFRA-065. Pin + checksum, the same accepted-risk shape as the scanner above, for the same
  # reason INFRA-061 gave: a downloaded binary that is verified AFTER it is made executable is
  # verified too late.
  #   curl -fsSL https://github.com/rhysd/actionlint/releases/download/v<version>/actionlint_<version>_linux_amd64.tar.gz | sha256sum -
  ACTIONLINT_VERSION: 1.7.7
  ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757

jobs:
  # Recurrence guard for the #1216 incident: a feature branch was PR'd straight to `main`, skipping `develop`,
  # which swept the whole develop delta onto main and diverged the branches. The feature→develop→main flow is
  # fixed (git-branch.md); this makes it MECHANICAL — a PR to `main` must come from `develop` (or a
  # `release/*` / `hotfix/*` promotion branch), never a feature branch.
  #
  # INFRA-055: this is now a REQUIRED status check on `protect-main`. It qualifies because its verdict is a
  # pure function of the PR's own head — no checkout, no network, no install, nothing that can fail for a
  # reason unrelated to the change — and it always reaches a conclusion on every PR to `main` (the workflow
  # carries no `paths` filter and this job has no `needs`). A red verdict is always satisfiable by the author,
  # by renaming the branch or re-routing through `develop`.
  main-pr-source-guard:
    name: main PR source guard
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Two assertions, both inside the step rather than in the job `if:`, so the job always reports a real
      # PASS/FAIL conclusion. A job-level condition would report `skipping`, which branch protection ACCEPTS
      # — the INFRA-050 property that makes a required check a no-op.
      - name: Only develop / release / hotfix from this repository may target main
        # Attacker-controlled values reach this job through `env:`, never through `${{ }}` inside
        # `run:`. A `${{ }}` expression is substituted into the script BEFORE the shell parses it, and
        # a git ref may contain backticks, `$`, `;`, `&` and `|` — so interpolating `github.head_ref`
        # directly is remote code execution on the runner, openable by anyone on a public repo with
        # forking enabled. Making this job a REQUIRED check is what obliges the fix now.
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          # `github.head_ref` is the BARE branch name and carries no owner, so a fork branch literally named
          # `develop` satisfies the name check below. The repository identity has to be asserted separately.
          # (.agents/memory/oss-contribution-policy.md: external contributions are not accepted while the
          # architecture is in flux — this is the mechanical half of that policy for the `main` path.)
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::A PR to 'main' must come from a branch in $THIS_REPO, not from fork '$HEAD_REPO'. Promotions are a release action performed inside this repository."
            exit 1
          fi

          case "$HEAD_REF" in
            develop|release/*|hotfix/*)
              echo "OK: '$HEAD_REF' (in $HEAD_REPO) → main (allowed promotion source)" ;;
            *)
              echo "::error::A PR to 'main' must come from 'develop' (or a release/* / hotfix/* promotion branch), not '$HEAD_REF'. Feature work flows feature→develop→main — never feature→main. See .agents/rules/git-branch.md (#1216 incident)."
              exit 1 ;;
          esac

  # INFRA-051: a promotion must CARRY main's ancestry. A squashed sync copies content across without
  # recording the link, so the next promotion re-computes against the old merge base and re-conflicts on
  # exactly the manifests the last sync reconciled (#1415 squashed as bc0ee64ff → #1413 CONFLICTING on five
  # package.json files plus pnpm-lock.yaml). This job blocks the promotion BEFORE it lands; the merge METHOD
  # is enforced separately by the `protect-main` ruleset (`allowed_merge_methods: ["merge"]`).
  #
  # It is a REQUIRED status check on `protect-main`, alongside `main PR source guard` and
  # `release-grade verification` (INFRA-055). Those three are the whole required list for `main`: the
  # former no-op contexts (build/quality/scans/dependency audit/commitlint) were dropped, because on a
  # `main` PR they asserted nothing — see the note above the `build` job.
  promotion-ancestry:
    name: promotion ancestry
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      # INFRA-050: full history, and NO depth-limited fetch anywhere in this job. The verdict is computed
      # from ancestry between origin/main, origin/develop and the PR head; a graft marks commits parentless
      # and `git merge-base --is-ancestor` then answers a different question — silently, in the passing
      # direction.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gate is dependency-free (node:child_process + node:path only, so no `pnpm install`), but it
      # uses `import.meta.dirname` (Node >= 20.11) and top-level await — pin the runtime like every
      # sibling job rather than inheriting whatever the runner image ships.
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Fetch both integration branches
        run: |
          git fetch origin --no-tags \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/develop:refs/remotes/origin/develop

      # PR_HEAD_SHA, never HEAD. On a pull_request event HEAD is GitHub's synthetic refs/pull/N/merge,
      # whose FIRST parent is the base branch — `merge-base --is-ancestor origin/main HEAD` is VACUOUSLY
      # true there and the gate would pass on the very state it exists to reject. The commitlint job below
      # documents the same trap. The scan itself refuses to run on HEAD under a pull_request event.
      - name: Assert the promotion preserves main's ancestry
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/harness/scan-promotion-ancestry.mjs

  # INFRA-104: a promotion must CARRY the closing keywords the pull requests inside it declared.
  # GitHub acts on `Closes #N` only when the pull request targets the DEFAULT branch, so every
  # feature→develop pull request's keyword is read as prose and the issue stays OPEN after merge
  # (measured: #1802 `Closes #1750` and #1816 `Closes #1722`, both merged, both issues open for
  # days). The develop→main promotion is the one pull request whose base IS `main`, so it is where
  # the keywords have to appear — and a body that silently omits one is indistinguishable from a
  # promotion that genuinely closes nothing. `promote.mjs` derives the block; this job is what
  # makes anyone paste it.
  #
  # It is a REQUIRED status check on `protect-main` (owner decision D1, 2026-08-18), which puts
  # INFRA-055's duty on it: a required context must ACTUALLY RUN AND BE ABLE TO FAIL on a `main`
  # pull request. Five contexts on promotion #1427 were echoes whose every real step was gated on
  # `base_ref != 'main'`, and branch protection reported green from jobs that did no work. So this
  # job's `if:` is `== 'main'` — it runs its full check exactly where the check means something —
  # and NO step below is gated on `base_ref`. `scan-main-required-checks.mjs` (R3/R4/R5) refuses
  # any other shape.
  promotion-closes:
    name: promotion closes
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest

    # Read-only, declared rather than inherited. The scan reads three collections through `gh api`
    # — the promotion's commits, each carried pull request's body, and each referenced issue's
    # state — and writes nothing anywhere.
    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      # No `fetch-depth: 0` here, deliberately, and unlike the ancestry gate above: this verdict is
      # computed entirely from the GitHub API (the pull request's commit subjects, not the local
      # graph), so a shallow checkout supplies everything it needs — the scripts themselves.
      - uses: actions/checkout@v7

      # The scan is dependency-free (node:child_process only, so no `pnpm install`), but it is an
      # ES module using top-level await — pin the runtime like every sibling job rather than
      # inheriting whatever the runner image ships.
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Assert the promotion body closes what its commits imply
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/harness/scan-promotion-closes.mjs --pr ${{ github.event.pull_request.number }}

  # Proportional CI (DX): classify whether a PR touches CODE or is documentation-only, so a docs/harness-markdown
  # PR skips the heavy build/test/e2e matrix. Those gated jobs are NOT required status checks on `protect-main`
  # (required there = promotion ancestry / main PR source guard / release-grade verification), so skipping them
  # is safe for branch protection — a skipped non-required job does not block the merge. On `protect-develop`
  # tui-e2e / examples-typecheck / windows-shell ARE required and remain present for non-product changes,
  # where they publish explicit non-applicability rather than disappearing. Every undeterminable case enables
  # all safety-relevant capabilities, so classifier failure cannot turn required work into N/A.
  #
  # INFRA-058: the classifier being fail-safe was only HALF the property. `classify-changed-paths.mjs`
  # always exits 0 (the verdict is its output, not its status), so it can only classify fail-safe —
  # it cannot protect against this JOB going red for a reason outside the classifier: a checkout
  # failure, a runner OOM, a syntax error introduced into the script, a Node crash. When that
  # happens GitHub reports the four dependents as `skipped`, not `failed`, and branch protection
  # ACCEPTS a skipped required check (INFRA-050, measured on #1424 with three required contexts
  # reporting `skipping`). `changes` is not itself required, so nothing red would remain on the PR.
  # The fetch-depth fix removed one CAUSE; the four dependents' `if:` now removes the MECHANISM —
  # each treats a non-success `changes` as CODE and runs anyway. `scan-required-check-needs.mjs`
  # keeps that shape from being edited back out.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      product: ${{ steps.filter.outputs.product }}
      tui: ${{ steps.filter.outputs.tui }}
      examples: ${{ steps.filter.outputs.examples }}
      windows: ${{ steps.filter.outputs.windows }}
      cli: ${{ steps.filter.outputs.cli }}
      harness: ${{ steps.filter.outputs.harness }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      # INFRA-050: `fetch-depth: 0`, and NO depth-limited fetch anywhere in this job. A `--depth`
      # fetch GRAFTS the whole repository (INFRA-049 measured 109 commits locally vs 97 — a
      # different set — in CI), and this job's verdict is computed from the MERGE BASE. Once the
      # base's ancestry is truncated past the merge base, `git diff origin/<base>...HEAD` stops
      # being a diff and starts being an error ("no merge base"), which fails this job — and
      # because `changes` is not itself a required check while tui-e2e / examples-typecheck /
      # windows-shell are, its dependents then report `skipping`, which branch protection accepts.
      # A code PR would merge having never been e2e'd. Full history is ~3s on this repo.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0
      - id: filter
        name: Classify changed paths and affected capabilities
        env:
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: |
          # The classification lives in scripts/harness/classify-changed-paths.mjs — ONE
          # implementation with two callers. `review-gate.yml` invokes the same module to decide
          # whether a code-scanning analysis is expected for this PR at all, and if it re-derived
          # "no code changed" with its own rule, that rule would be the bypass: a PR could skip the
          # review gate without skipping this matrix. Extracting it is what makes the two verdicts
          # the same verdict by construction.
          #
          # Unchanged behaviour (asserted in __tests__/classify-changed-paths.test.mjs): the merge
          # base is computed explicitly and over `--all` for this repo's criss-cross history, and
          # every undeterminable case — no merge base, a failed diff, an empty file list —
          # classifies as CODE so no required check is silently skipped.
          #
          # No `setup-node`: the runner's preinstalled Node runs this (the script imports only
          # node: builtins), and adding a network-dependent setup step to the job that GATES the
          # required matrix would trade a real risk for a cosmetic one — a flake here makes
          # tui-e2e / examples-typecheck / windows-shell report `skipping`, which branch protection
          # accepts. review-gate.yml has run `node scripts/harness/*.mjs` bare since #1434.
          node scripts/harness/classify-changed-paths.mjs --base-ref "${BASE_REF}"

  # INFRA-055: `build` / `quality` / `scans` / `dependency audit` are DEVELOP-side gates. They used to run on a
  # `main` PR too, as a "Skip duplicate …" echo with every real step gated on `base_ref != 'main'` — a 3–6
  # second job that asserted nothing. That shape existed for one reason: all four were REQUIRED contexts on
  # `protect-main`, so they had to resolve rather than linger pending. Measured on promotion #1427 they
  # reported 5s / 5s / 6s / 3s of echo, and branch protection reported green from jobs that deliberately did
  # no work, while the job that actually verifies a promotion (`release-grade verification`) was not required.
  #
  # The required list was moved to match (`promotion ancestry`, `main PR source guard`, `release-grade
  # verification`), so the reason for the echo shape is gone and these jobs are simply excluded on a `main`
  # PR at the JOB level. `harness:verify:release` subsumes them there: it runs the FULL build, the FULL scan
  # suite (plus `harness:test`), the FULL test/typecheck/lint sweep and an UNCONDITIONAL osv-scanner, where
  # these four are affected-scope-selective via `--base-ref`.
  #
  # Do not re-add work to these jobs for `main` without adding the job back to `protect-main`'s required list
  # AND to `.github/required-status-checks.json` — `scan-main-required-checks.mjs` enforces the converse
  # direction (nothing vacuous may be required).
  build:
    name: build
    if: ${{ !cancelled() && (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result != 'cancelled' }}
    runs-on: ubuntu-latest
    needs: changes
    env:
      FULL_VERIFICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' }}
      PRODUCT_APPLICABLE: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.product == 'true' }}
      CLI_APPLICABLE: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.cli == 'true' }}
    outputs:
      package_dist_required: ${{ steps.build_requirement.outputs.required || steps.build_requirement_na.outputs.required }}
      package_dist_complete: ${{ steps.build_requirement.outputs.complete || steps.build_requirement_na.outputs.complete }}

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      # INFRA-050: full history, no `--depth` fetch — `harness:plan --base-ref origin/<base>`
      # resolves the affected scopes from a merge-base diff, so a grafted ancestry changes which
      # checks this PR is planned to run at all.
      - uses: actions/checkout@v7
        if: env.PRODUCT_APPLICABLE == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      - name: Install pnpm
        if: env.PRODUCT_APPLICABLE == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        if: env.PRODUCT_APPLICABLE == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Restore cross-head ESLint content cache
        if: env.PRODUCT_APPLICABLE == 'true'
        uses: actions/cache@v6
        with:
          path: .cache/eslint/ci.cache
          key: robota-eslint-content-v1-${{ runner.os }}-node22-${{ github.event.pull_request.head.sha || inputs.head_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            robota-eslint-content-v1-${{ runner.os }}-node22-

      - name: Install dependencies
        if: env.PRODUCT_APPLICABLE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Plan package-dist artifact membership
        if: env.PRODUCT_APPLICABLE == 'true'
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: |
          mkdir -p .agents/evals/local-metrics
          if [[ "$FULL_VERIFICATION" == "true" ]]; then
            node scripts/harness/workspace-affected.mjs --operation build --full --format json > .agents/evals/local-metrics/workspace-build-plan.json
          else
            node scripts/harness/workspace-affected.mjs --operation build --base-ref "$HARNESS_BASE_REF" --format json > .agents/evals/local-metrics/workspace-build-plan.json
          fi

      - name: Show verification plan
        if: env.PRODUCT_APPLICABLE == 'true'
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: pnpm harness:plan -- --base-ref "$HARNESS_BASE_REF" --report-file .agents/evals/local-metrics/ci-plan.json

      - name: Upload verification plan
        if: env.PRODUCT_APPLICABLE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verification-plan
          path: .agents/evals/local-metrics/ci-plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Detect build requirement
        id: build_requirement
        if: env.PRODUCT_APPLICABLE == 'true'
        env:
          FULL_VERIFICATION: ${{ env.FULL_VERIFICATION }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from 'node:fs';

          const plan = JSON.parse(readFileSync('.agents/evals/local-metrics/ci-plan.json', 'utf8'));
          const checksRequiringPackageDist = new Set(['build', 'test', 'typecheck']);
          const required = process.env.FULL_VERIFICATION === 'true' || plan.scopes.some((scope) =>
            scope.checks.some((check) => checksRequiringPackageDist.has(check)),
          );
          appendFileSync(process.env.GITHUB_OUTPUT, `required=${required ? 'true' : 'false'}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `complete=${process.env.FULL_VERIFICATION === 'true' ? 'true' : 'false'}\n`);

          if (required) {
            console.log('Package or app verification requires the root monorepo build output.');
          } else {
            console.log('No package or app verification requires build output.');
          }
          EOF

      - name: Build full or affected workspace
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.required == 'true'
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: |
          if [[ "$FULL_VERIFICATION" == "true" ]]; then
            pnpm build
          else
            pnpm build:affected
          fi

      - name: Archive package build output
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.required == 'true'
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { readWorkspaceGraph } from './scripts/harness/workspace-affected.mjs';

          const plan = JSON.parse(readFileSync('.agents/evals/local-metrics/workspace-build-plan.json', 'utf8'));
          const graph = readWorkspaceGraph(process.cwd());
          const byName = new Map(graph.packages.map((item) => [item.name, item]));
          const selected = plan.mode === 'global' ? graph.packages : plan.packages.map((item) => byName.get(item.name));
          if (selected.some((item) => !item)) throw new Error('build plan references an unknown workspace');

          const containsDistPath = (value) => {
            if (typeof value === 'string') return /(?:^|\/)dist\//u.test(value);
            if (!value || typeof value !== 'object') return false;
            return Object.values(value).some(containsDistPath);
          };
          const required = [];
          for (const item of selected) {
            if (!item.directory.startsWith('packages/')) continue;
            const manifest = JSON.parse(readFileSync(`${item.directory}/package.json`, 'utf8'));
            if (!containsDistPath({ main: manifest.main, types: manifest.types, exports: manifest.exports, bin: manifest.bin })) continue;
            const dist = `${item.directory}/dist`;
            if (!existsSync(dist)) throw new Error(`planned build output is missing: ${dist}`);
            required.push(dist);
          }
          if (required.length === 0) throw new Error('build plan produced no package dist contract');
          writeFileSync('.agents/evals/local-metrics/package-dist-membership.bin', `${required.join('\0')}\0`);
          console.log(`Verified ${required.length} planned package dist directories.`);
          EOF
          tar --null -czf package-dist.tgz --files-from .agents/evals/local-metrics/package-dist-membership.bin

      - name: Upload package build output
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: package-dist
          path: package-dist.tgz
          if-no-files-found: error
          retention-days: 1

      # Build and quality share checkout, runtime, install, and the just-produced dist. Keeping both
      # verdicts in this producer removes a measured 32-second duplicate setup from the critical path;
      # the required `quality` job below only publishes this producer's conclusion.
      - name: Verify full or affected package quality concurrently
        if: env.PRODUCT_APPLICABLE == 'true'
        shell: bash
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: |
          set +e
          mkdir -p .cache/eslint
          labels=()
          pids=()
          logs=()

          start_check() {
            local label="$1"
            shift
            local log_file="${RUNNER_TEMP}/quality-${label}.log"
            labels+=("$label")
            logs+=("$log_file")
            "$@" >"$log_file" 2>&1 &
            pids+=("$!")
          }

          if [[ "$FULL_VERIFICATION" == "true" ]]; then
            start_check test pnpm test
            start_check typecheck pnpm typecheck
            start_check lint pnpm lint
          else
            start_check test pnpm test:affected
            start_check typecheck pnpm typecheck:affected
            start_check lint pnpm lint:affected
          fi

          failed=0
          for index in "${!pids[@]}"; do
            status=0
            wait "${pids[$index]}" || status=$?
            echo "::group::${labels[$index]} (exit ${status})"
            if ! cat "${logs[$index]}"; then
              echo "::error::${labels[$index]} log is missing or unreadable"
              status=1
            fi
            echo "::endgroup::"
            if (( status != 0 )); then
              echo "::error::${labels[$index]} failed with child status ${status}"
              failed=1
            fi
          done
          exit "$failed"

      - name: Build-output contracts scan (dist-dependent)
        if: env.PRODUCT_APPLICABLE == 'true'
        run: pnpm harness:scan:build-contracts

      - name: Binary e2e (agent-cli bintests, dist-dependent)
        if: env.CLI_APPLICABLE == 'true'
        run: pnpm --filter @robota-sdk/agent-cli test:bin

      - name: Binary e2e not applicable
        if: env.PRODUCT_APPLICABLE == 'true' && env.CLI_APPLICABLE != 'true'
        run: echo "This change cannot reach the agent CLI binary."

      - name: Skip monorepo build when no build output is required
        if: env.PRODUCT_APPLICABLE == 'true' && steps.build_requirement.outputs.required != 'true'
        run: echo "No package or app verification requires build output."

      - name: Product verification not applicable
        id: build_requirement_na
        if: env.PRODUCT_APPLICABLE != 'true'
        run: |
          echo "Infrastructure-only change: product build is not applicable."
          echo "required=false" >> "$GITHUB_OUTPUT"
          echo "complete=false" >> "$GITHUB_OUTPUT"

  quality:
    name: quality
    if: ${{ !cancelled() && (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result != 'cancelled' }}
    runs-on: ubuntu-latest
    needs: [changes, build]
    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')
      - name: Publish the product verification verdict
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "::error::build/quality producer concluded ${BUILD_RESULT}"
            exit 1
          fi
          echo "Build and package quality verification passed in the shared producer job."

  # INFRA-037: the dist-INDEPENDENT scan suite + harness unit tests run here with NO `needs: build`, so
  # they start immediately and run in parallel with `build` (removing the ~3-min build-wait for work that
  # never consumed dist). INFRA-055: develop-side only — see the note above `build`.
  scans:
    name: scans
    needs: changes
    if: ${{ !cancelled() && (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      # INFRA-050: full history. `harness:scan` contains a base-history gate
      # (check-document-authority.mjs diffs `origin/$GITHUB_BASE_REF...HEAD`). On the former
      # depth-50 checkout `origin/<base>` did not exist at all, so that scan fell back to its own
      # `--depth=50` fetch — a graft — and then reported SKIPPED ("not a pass") while the suite
      # still exited 0. A complete checkout makes the ref resolve directly and the gate enforce.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      # A unique primary key makes every completed run publish an immutable snapshot. Restore may
      # cross heads because every marker is content-addressed and revalidated against the test's
      # complete implementation/input key before it can count as a hit.
      - name: Restore cross-head contract-test content cache
        uses: actions/cache@v6
        with:
          path: .cache/robota-contract-tests
          key: robota-contract-tests-v1-${{ runner.os }}-node22-${{ github.event.pull_request.head.sha || inputs.head_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            robota-contract-tests-v1-${{ runner.os }}-node22-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # INFRA-151: the contract selector owns fail-closed fallback to the full four-shard suite.
      # Contracts, the affected dist-independent scan, and (when applicable) hermetic tests are
      # independent after installation, so run them concurrently. Each child writes a complete log;
      # every result is collected before the aggregate exits, and any non-zero status (including a
      # signal-derived status), missing child result, or unreadable log fails this required context.
      # A failed changes job or missing harness output runs hermetic tests too; only a proven
      # harness=false may omit that tier.
      #
      # INFRA-026: the full scan suite is a develop-merge gate, not a release-only one.
      # `dist` is a LOCAL pre-CI freshness check (a fresh checkout has no dist to measure — skip printed,
      # never silent); `build-contracts` (INFRA-037) is dist-dependent and runs in the `quality` job after
      # dist restore, so it is skipped here rather than silently no-op'ing on a source/build-change PR.
      # PR #1891 moved `action-references` onto the authenticated API, where an unverifiable
      # reference is a FAILURE and not a skip — deliberately, because "could not determine, exit 0"
      # is the defect that guard exists to catch. This job had no token, so every one of the 80
      # references was unverifiable and the whole suite went red on arrival. `github.token` is the
      # same credential the promotion check above already uses.
      # PROC-016: on a pull request this is the AFFECTED set — every scan whose declared globs a
      # changed path reaches, plus every scan declared `always` — run in the `pr` context, where a
      # scan that grades the agent's own prose (transcripts, narrative references) reports its
      # failure as an advisory instead of failing the context. A changed path no scan declares
      # selects the full suite here, fail closed. The FULL suite in the `integration` context, where
      # those advisories block, runs on every push to `develop` and on demand (`scans-full.yml`).
      # `pre-push.mjs` runs this same line locally; `pre-push-mirrors-ci-scans.test.mjs` pins it.
      #
      # PROC-016: `scan-lane-declaration` reads the pull request body's `Lane:` line through
      # `HARNESS_PR_BODY_FILE` — the scan runner passes it no arguments, so a file is the only way in,
      # and without one a pull request that declares its lane only in the body was refused here as
      # "no lane declared". The body is untrusted text: it is handed over as an environment variable
      # and written with `printf '%s'`, never interpolated into a script (the same shape as the
      # regression-red-proof step below). An absent body writes an empty file, and the declaration
      # then comes from the spec-document frontmatter or the commit trailers, as the scan's priority
      # order says. This step is CI plumbing, not a check: locally the body does not exist yet, so
      # `pre-push-mirrors-ci-scans.test.mjs` and `ci-mirror-map.mjs` declare it as such by name.
      - name: Write pull request body for the lane declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body || inputs.pr_body }}
          HARNESS_PR_BODY_FILE: ${{ runner.temp }}/pr-body.txt
        run: printf '%s' "$PR_BODY" > "$HARNESS_PR_BODY_FILE"

      - name: Harness affected verification (concurrent, dist-independent)
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_PR_BODY_FILE: ${{ runner.temp }}/pr-body.txt
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
          BENCHMARK_MODE: ${{ github.event_name == 'workflow_dispatch' }}
          RUN_HERMETIC: ${{ needs.changes.result != 'success' || needs.changes.outputs.harness != 'false' }}
        shell: bash
        run: |
          set +e

          labels=()
          pids=()
          logs=()

          start_check() {
            local label="$1"
            shift
            local log_file="${RUNNER_TEMP}/scans-${label}.log"
            labels+=("$label")
            logs+=("$log_file")
            "$@" >"$log_file" 2>&1 &
            pids+=("$!")
          }

          start_check contracts \
            pnpm harness:test:contracts:affected -- --base-ref "${HARNESS_BASE_REF}" --head-ref HEAD
          scan_args=(harness:scan -- --skip dist --skip build-contracts --affected --context pr --base "${HARNESS_BASE_REF}")
          if [[ "$BENCHMARK_MODE" == "true" ]]; then
            scan_args+=(--skip lane-declaration --skip user-execution-plan-order --skip work-run-measurement)
          fi
          start_check scans pnpm "${scan_args[@]}"
          if [[ "$RUN_HERMETIC" == "true" ]]; then
            start_check hermetic pnpm harness:test:hermetic
          fi

          failed=0
          for index in "${!pids[@]}"; do
            status=0
            wait "${pids[$index]}" || status=$?
            echo "::group::${labels[$index]} (exit ${status})"
            if ! cat "${logs[$index]}"; then
              echo "::error::${labels[$index]} log is missing or unreadable"
              status=1
            fi
            echo "::endgroup::"
            if (( status != 0 )); then
              echo "::error::${labels[$index]} failed with child status ${status}"
              failed=1
            fi
          done

          exit "$failed"

  dependency-audit:
    name: dependency audit
    if: (github.base_ref || inputs.base_ref) != 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      # INFRA-050: full history, no `--depth` fetch. This is a REQUIRED check (on `protect-develop`)
      # whose only real work is gated on a merge-base diff — a grafted ancestry could gate the
      # vulnerability scan off a wrong file list and pass in seconds having scanned nothing.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      - name: Detect dependency graph changes
        id: dependency_changes
        env:
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: |
          # Explicit merge base(s), union over all of them, and any failure classifies as CHANGED —
          # an unscannable history must run the scan, never silently skip it.
          bases="$(git merge-base --all "${BASE_REF}" HEAD)" || bases=''
          changed_files=''
          scan=''
          if [ -z "$bases" ]; then
            echo "::error::dependency audit: no merge base between ${BASE_REF} and HEAD. Running the vulnerability scan rather than skipping it."
            scan=forced
          fi
          for base in $bases; do
            if ! diff_files="$(git diff --name-only --diff-filter=ACMRD "$base" HEAD)"; then
              echo "::error::dependency audit: git diff against merge base $base failed. Running the vulnerability scan rather than skipping it."
              scan=forced
              break
            fi
            changed_files="${changed_files}${diff_files}
          "
          done
          if [ "$scan" = forced ] || printf '%s\n' "$changed_files" | grep -Eq '(^pnpm-lock.yaml$|(^|/)package.json$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No package manifest or lockfile changes; skipping vulnerability scan."
          fi

      # INFRA-038: npm retired the legacy audit endpoint (pnpm audit → 410). osv-scanner reads the pnpm lockfile
      # directly (OSV.dev DB) — no pnpm/node install needed; it fails on any un-ignored vuln; re-accepts live in
      # osv-scanner.toml (single SSOT).
      - name: Vulnerability scan (osv-scanner) for dependency graph changes
        if: steps.dependency_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o "$RUNNER_TEMP/osv-scanner"
          # INFRA-061: verify BEFORE chmod +x — a mismatch must stop the job, not run and then complain.
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml --lockfile pnpm-lock.yaml

  # INFRA-055: the REQUIRED content gate for a promotion. It is the only required context on `protect-main`
  # that executes the repository's code, and it qualifies as required because it always reaches a conclusion
  # on every PR to `main`: the workflow carries no `paths`/`paths-ignore` filter, this job has no `needs:`,
  # no matrix and no `continue-on-error`, and every step below is unconditional. Diff shape cannot change
  # that — a docs-only promotion, an enormous promotion, a merge-commit head and a tree identical to
  # `develop` all run the same steps. An infrastructure failure (install, artifact download) turns it RED
  # and blocks the promotion until it is re-run, which is the correct direction for a release gate and is
  # always satisfiable; what disqualifies a required check is being unable to REPORT, not being able to fail.
  release-grade-verify:
    name: release-grade verification
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'

    steps:
      # INFRA-050: full history — `harness:verify:release` runs the scan suite, which contains a
      # base-history gate (see the `scans` job note above).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # INFRA-051: this job runs `harness:scan`, which now includes the promotion-ancestry gate, and
      # this job only runs when `base_ref == 'main'` — i.e. always in a promotion context. The runner
      # sets GITHUB_BASE_REF and GITHUB_EVENT_NAME but NOT the PR head sha, and the gate REFUSES to
      # evaluate `HEAD` on a pull_request event (it is refs/pull/N/merge, whose first parent is the
      # base — A1/A3 would pass vacuously). Without this env the gate would fail closed here and turn
      # this job red on every promotion PR, including a correctly built one. Supplying the head sha is
      # the fix; making the gate skip when it cannot resolve a head would recreate INFRA-050's
      # silently-skipped-but-green shape.
      - name: Run release-grade verification
        env:
          # INFRA-088: `main` is the event/promotion context, but the promotion introduces no content
          # beyond the already-verified develop tree. Diff-sensitive novelty scans must therefore
          # compare to develop; promotion-ancestry still reads the untouched GITHUB_BASE_REF=main.
          HARNESS_BASE_REF: origin/develop
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm harness:verify:release

      # INFRA-038: osv-scanner (pnpm-lockfile-based) — the retired npm audit endpoint broke `pnpm audit`.
      - name: Vulnerability scan (osv-scanner)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o "$RUNNER_TEMP/osv-scanner"
          # INFRA-061: verify BEFORE chmod +x — a mismatch must stop the job, not run and then complain.
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml --lockfile pnpm-lock.yaml

  # compat-node18 was removed: its first REAL Node 18 run (promotion #1306) proved the build chain
  # (rolldown, engines ^20.19 || >=22.12) cannot run on Node 18 at all, and Node 18 has been EOL since
  # 2025-04 — the engines floor is now >=20.19.0, making a separate compat job redundant with `build`.
  # INFRA-055: develop-side only, and no longer a required context on `protect-main`. A promotion's merge
  # commit subject is generated by GitHub, and every commit it promotes was linted on its own PR to
  # `develop` — so on a `main` PR this job has nothing to assert. It was previously REQUIRED there while
  # skipping wholesale, which branch protection accepts.
  # INFRA-083: the ONE thing a bypassed local gate used to ship.
  #
  # Every other local stage is re-run by a required CI job, so a push that skipped the hooks could
  # not merge broken code — it merely cost a CI cycle. Formatting was the exception: `ci-mirror-map`
  # recorded "no CI job re-checks formatting, and a --no-verify push from a fresh worktree never runs
  # the SSOT formatter". That made the local hook the only line of defence for it, which is exactly
  # the position a gate should never be in.
  #
  # It calls the SAME code path the local stage calls, rather than re-deriving the file set from a
  # glob here. A second derivation is how CI and local come to disagree about what "formatted" means,
  # and this repository has paid for that class often enough.
  format-check:
    name: format-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref != 'main'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--base-ref` explicitly, like the sibling `commitlint` job. Without it the stage diffs against
      # a hardcoded `origin/develop`, which is right today only because this job is skipped when the
      # base IS main and policy sends everything else to develop — an assumption held in two places
      # and stated in neither.
      - name: Check formatting
        run: node scripts/harness/verify-like-ci.mjs --only format-check --base-ref origin/${{ github.base_ref }}

  # INFRA-065 half 1. `scan-action-references` verifies that every `uses:` REFERENCE resolves — which
  # is what caught `vercel/action@v1`, and which actionlint does not check. The reverse is also true,
  # and this job is that half: expression syntax and context typing, `run:` block shellcheck, and
  # job/step schema errors GitHub accepts silently.
  #
  # A JOB, NOT A STEP OF `scans`, and the harness decided that rather than a preference. Folding it
  # into `scans` cost no concurrency slot but broke two invariants at once: `ci-mirror-map` requires
  # every step of a REQUIRED job to be reproduced by a `verify-like-ci` stage or declared plumbing
  # (INFRA-056 — otherwise "I ran the CI-equivalent check" covers less than it claims), and
  # `pre-push-mirrors-ci-scans` requires the pre-push gate to run every command `scans` runs. Both
  # would have been satisfiable only by making every developer install actionlint. The concurrency
  # baseline is re-frozen deliberately instead, which is the option that scan itself offers: one
  # account slot, spent knowingly, against a locally-unverifiable required context.
  #
  # NOT required, and not proposed as required: a new refusal in the merge path, and INFRA-046
  # records why an untested one is not promoted. A failure is still visible as a non-required red,
  # which `merge-gate.sh` refuses to merge past.
  #
  # Measured before landing: actionlint 1.7.7 reports ZERO problems across this repository's
  # workflows, so it arrives clean rather than with a backlog to acknowledge.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref != 'main'

    steps:
      - uses: actions/checkout@v7

      - name: Lint workflow files
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          # Verified BEFORE extraction, so a swapped archive is never unpacked, let alone run.
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          chmod +x "$RUNNER_TEMP/actionlint"
          # `shellcheck` is preinstalled on ubuntu-latest, and it is HALF of what this job is for.
          # Without it actionlint prints `Rule "shellcheck" was disabled` and exits 0 — measured
          # locally, where a deliberately broken `run:` block drew no comment at all. A check that
          # turns half of itself off and still reports success is the shape this repository keeps
          # finding, so its presence is asserted rather than assumed.
          command -v shellcheck >/dev/null || {
            echo "::error::actionlint: shellcheck is absent, so run-block linting would be silently skipped."
            exit 1
          }
          "$RUNNER_TEMP/actionlint" -color

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    # `merged != true`: a body edit AFTER the merge re-dispatches this workflow against the closed PR
    # (`edited` is subscribed for INFRA-055), and on a merged PR the range `origin/<base>..<head>` is
    # empty by construction — so this job failed closed and repainted the merged head's required
    # projection red 12 minutes after a green landing (issue #2424, PRs #2414/#2417). A closed PR has
    # nothing left for this gate to decide; skip rather than fail. Open-PR behaviour is unchanged.
    if: (github.base_ref || inputs.base_ref) != 'main' && github.event.pull_request.merged != true

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # INFRA-049: lint ONLY the commits this PR authored. Three things make that true, and all
      # three are load-bearing — see .agents/tasks/completed/INFRA-049-*.md for the evidence.
      #
      # 1. NO base fetch, and above all no `--depth`. `actions/checkout` already fetched every
      #    branch at full depth (fetch-depth: 0), so `origin/<base>` is present and complete. The
      #    `git fetch origin <base> --depth=50` step that used to sit here GRAFTED the repository at
      #    depth 50, destroying the ancestry that `<base>..<head>` is computed from: commits long
      #    since merged into the base looked unreachable and were re-linted. That is what failed
      #    #1415 — 97 inherited commits and 26 errors in CI, while the identical command exited 0
      #    on a full local clone. Removing it is what makes CI and a local run agree.
      # 2. `--first-parent` drops history the PR merged IN from another branch. A main→develop
      #    back-merge carries ~109 already-merged commits its author cannot rewrite; those belong to
      #    the PRs that introduced them. Every commit the PR itself authored — including its own
      #    merge commits — sits on the first-parent path and is still linted in full, so a bad
      #    subject the PR wrote still fails the gate.
      # 3. `github.event.pull_request.head.sha`, NOT `HEAD`. On a pull_request event HEAD is
      #    GitHub's synthetic `refs/pull/N/merge`, whose FIRST parent is the base branch — walking
      #    first-parent from it would traverse the base and lint nothing at all.
      #
      # commitlint's own `--git-log-args=--first-parent` is NOT usable here: @commitlint/read passes
      # the parsed flags to @conventional-changelog/git-client, which only understands the camelCase
      # `firstParent` key and silently drops anything else (its own source says so). The documented
      # spelling is a no-op, so the range is computed with git directly.
      #
      # Local equivalent — same commit set, given an up-to-date origin/<base>:
      #   git rev-list --first-parent origin/develop..HEAD |
      #     while read -r sha; do
      #       git log -1 --format=%B "$sha" | pnpm exec commitlint --verbose || exit 1
      #     done
      - name: Lint PR commit messages
        env:
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_ref }}
        run: |
          # INFRA-058: resolve the range into a variable and CHECK it, rather than expanding
          # `$(git rev-list …)` straight into the `for` word-list. GitHub runs this block as
          # `bash -e`, and `set -e` does NOT fire on a command substitution used as a word-list: a
          # failing `git rev-list` produced an EMPTY list, the loop body never ran, and `exit
          # "$status"` returned 0. MEASURED by extracting this step verbatim and running it with an
          # unresolvable head sha: two `fatal: Invalid revision range` lines, `Linting  commit(s)`,
          # and exit 0 — this REQUIRED check reporting green having linted nothing. "Could not
          # determine" is not "checked and clean"; both now fail closed.
          range="${BASE_REF}..${HEAD_SHA}"
          if ! commits="$(git rev-list --first-parent "$range")"; then
            echo "::error::commitlint: could not resolve the commit range '$range'. ${BASE_REF} or ${HEAD_SHA} is not present in this checkout (the job checks out with fetch-depth: 0, so this means the head sha was force-pushed away or the base ref was never fetched). Failing rather than linting zero commits."
            exit 1
          fi
          if [ -z "$commits" ]; then
            echo "::error::commitlint: the range '$range' contains no commits. A PR always authors at least one, so an empty range means the range is degenerate, not that the PR is clean. Failing rather than linting zero commits."
            exit 1
          fi
          echo "Linting $(printf '%s\n' "$commits" | wc -l) commit(s) authored by this PR ($range, first-parent)."
          status=0
          for sha in $commits; do
            echo "── $(git log -1 --format='%h %s' "$sha")"
            git log -1 --format=%B "$sha" | pnpm exec commitlint --verbose || status=1
          done
          exit "$status"

  examples-typecheck:
    name: examples-typecheck
    runs-on: ubuntu-latest
    # `build` joins `changes` so the built packages can be reused. The `if:` below already carries
    # `!cancelled()`, which disables the implicit `success()` over `needs` — so a failed `build` does
    # NOT turn this required check into a skip; the job runs and falls back to building.
    needs: [changes, build]
    env:
      FULL_VERIFICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' }}
      EXAMPLES_APPLICABLE: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.examples == 'true' }}
    # INFRA-058 fail-safe: `!cancelled()` disables GitHub's implicit `success()` over `needs`, so a
    # `changes` job that FAILED (as opposed to classifying docs-only) no longer turns this required
    # check into a `skipped` conclusion that branch protection accepts — it runs, matching the
    # classifier's own rule that every undeterminable case is CODE. A cancelled run still skips,
    # because a cancelled run is superseded, not unverified.
    if: ${{ !cancelled() && (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result != 'cancelled' }}

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      - uses: actions/checkout@v7
        if: env.EXAMPLES_APPLICABLE == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      - name: Install pnpm
        if: env.EXAMPLES_APPLICABLE == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        if: env.EXAMPLES_APPLICABLE == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        if: env.EXAMPLES_APPLICABLE == 'true'
        run: pnpm install --frozen-lockfile

      # Reuse the build the `build` job already produced and uploaded, instead of repeating it.
      # Measured: this job spent about 80% of its runtime rebuilding what another job had just built,
      # and billing counts that wall clock. `quality` already consumes this artifact, so this is the
      # existing pattern rather than a new mechanism.
      #
      # The fallback is not optional: `build` uploads only when the run needs package dist, and a
      # required check that assumes an artifact is present would go from "slow" to "broken" the first
      # time it is absent. `continue-on-error` keeps a missing artifact on the fallback path rather
      # than failing the gate.
      - name: Download package build output
        id: dist
        if: env.EXAMPLES_APPLICABLE == 'true' && needs.build.result == 'success' && needs.build.outputs.package_dist_required == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: package-dist
          path: .artifacts/package-dist

      - name: Restore package build output
        id: restore
        if: env.EXAMPLES_APPLICABLE == 'true' && steps.dist.outcome == 'success'
        run: |
          tar -xzf .artifacts/package-dist/package-dist.tgz
          echo "restored=true" >> "$GITHUB_OUTPUT"

      # A restored affected archive is intentionally incomplete. Resolve the affected examples,
      # then synthesize those owners into one build plan so their complete dependency dist closure
      # exists without traversing unrelated reverse dependents.
      - name: Guarantee affected example consumer dist
        if: env.EXAMPLES_APPLICABLE == 'true' && (needs.build.result != 'success' || needs.build.outputs.package_dist_complete != 'true')
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        shell: bash
        run: |
          plan_file="${RUNNER_TEMP}/examples-affected-plan.json"
          targets_file="${RUNNER_TEMP}/examples-affected-targets.txt"
          node scripts/harness/workspace-affected.mjs --operation examples-typecheck --base-ref "$HARNESS_BASE_REF" --format json >"$plan_file"
          PLAN_FILE="$plan_file" node --input-type=module <<'EOF' >"$targets_file"
          import { readFileSync } from 'node:fs';
          const plan = JSON.parse(readFileSync(process.env.PLAN_FILE, 'utf8'));
          if (plan.mode !== 'packages' || plan.packages.length === 0) process.exit(2);
          for (const item of plan.packages) console.log(`${item.directory}/__ci_consumer_target__.ts`);
          EOF
          mapfile -t targets <"$targets_file"
          args=(harness:workspace:run -- --operation build)
          for target in "${targets[@]}"; do args+=(--changed-file "$target"); done
          pnpm "${args[@]}"

      - name: Typecheck examples
        if: env.EXAMPLES_APPLICABLE == 'true'
        env:
          HARNESS_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || format('origin/{0}', github.base_ref) }}
        run: |
          if [[ "$FULL_VERIFICATION" == "true" ]]; then
            pnpm examples:typecheck
          else
            pnpm examples:typecheck:affected
          fi

      - name: Examples verification not applicable
        if: env.EXAMPLES_APPLICABLE != 'true'
        run: echo "This change does not affect product examples."

  # TERM-007 item 2 / TERM-008: verify cross-platform shell execution on real Windows.
  # The resolver + Shell tool spawn PowerShell here, so these tests exercise the win32 path
  # that the macOS/Linux jobs (and mocked-platform unit tests) cannot. Blocking: first run
  # passed green on windows-latest (PR #900, 1m34s), so Windows shell execution is now a
  # maintained, every-PR gate rather than a one-off pass.
  windows-shell:
    name: windows-shell
    runs-on: windows-latest
    needs: changes
    env:
      WINDOWS_APPLICABLE: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.windows == 'true' }}
    # INFRA-058 fail-safe: `!cancelled()` disables GitHub's implicit `success()` over `needs`, so a
    # `changes` job that FAILED (as opposed to classifying docs-only) no longer turns this required
    # check into a `skipped` conclusion that branch protection accepts — it runs, matching the
    # classifier's own rule that every undeterminable case is CODE. A cancelled run still skips,
    # because a cancelled run is superseded, not unverified.
    if: ${{ !cancelled() && (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result != 'cancelled' }}

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      - uses: actions/checkout@v7
        if: env.WINDOWS_APPLICABLE == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 50

      - name: Install pnpm
        if: env.WINDOWS_APPLICABLE == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        if: env.WINDOWS_APPLICABLE == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        if: env.WINDOWS_APPLICABLE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build agent-core + agent-process + agent-executor for dependent tests
        if: env.WINDOWS_APPLICABLE == 'true'
        # CORE-023: shell-tool now imports @robota-sdk/agent-process (killProcessTree); this
        # minimal job resolves workspace deps from built dist, so agent-process must be built too.
        run: pnpm --filter @robota-sdk/agent-core --filter @robota-sdk/agent-process --filter @robota-sdk/agent-executor build

      # INFRA-058: `pnpm exec vitest`, NOT `pnpm ... test -- --run <pattern>`. Both packages' `test`
      # script is `vitest run --passWithNoTests`, and a name-FILTERED run through it reports success on
      # zero matches — MEASURED locally: renaming `platform-shell.test.ts` to `shell-resolver.test.ts`
      # made the identical command print `No test files found, exiting with code 0` and exit 0. An
      # ordinary rename would therefore have left this REQUIRED check green while executing nothing,
      # on the only runner in the matrix that can exercise win32 at all. The flag cannot be overridden
      # on the command line (vitest's cac rejects a repeated `--passWithNoTests`: "Expected a single
      # value ... received [true, false]"), so the script indirection is bypassed instead. Invoking
      # vitest directly resolves the same per-package config and exits 1 when the filter matches
      # nothing — the whole point of selecting tests by name here.
      # INFRA-064: the `platform-shell` step is GONE, and the reason is what it claimed rather than
      # what it cost. `resolvePlatformShell(env, platform)` takes the platform as an ARGUMENT — it
      # reads no `process.platform` and spawns nothing — so its verdict on windows-latest is
      # identical to its verdict anywhere else. A step on this runner asserts, by being here, that
      # something about it needs Windows. That one did not, and a job whose stated coverage is wider
      # than its real coverage is the defect, independent of runtime.
      #
      # THE COST ARGUMENT IN THE ITEM DOES NOT HOLD, and the measurement is why this comment says so:
      # the step took 2s of a ~103s job (checkout 8s, pnpm install 42s, build 7s, teardown 20s). The
      # expensive part is standing the runner up, and the step below still needs it. Removing this
      # saves about 2% of one job — worth doing for the claim it was making, not for the seconds.
      #
      # NO COVERAGE IS LOST, and the argument is stronger than "it runs somewhere else too". A pure
      # function's verdict cannot change unless its subject or its test changes; both live in
      # `agent-core`, and a change to `agent-core` is exactly what puts it in `harness:verify`'s
      # scope. Measured: touching `platform-shell.ts` selects `packages/agent-core: build, test,
      # lint, typecheck`, which the REQUIRED `quality` job runs.
      - name: Verify the Shell tool actually spawns PowerShell on Windows
        if: env.WINDOWS_APPLICABLE == 'true'
        # The genuinely win32-only half: it SPAWNS a real shell and asserts PowerShell answers. No
        # Linux or macOS runner can execute this, which is what buys the runner the job runs on.
        run: pnpm --filter @robota-sdk/agent-tools exec vitest run shell-tool

      - name: Verify executor runners use default PowerShell
        if: env.WINDOWS_APPLICABLE == 'true'
        shell: pwsh
        run: |
          $env:ROBOTA_SCENARIO_OUTPUT = "$env:RUNNER_TEMP\arch-026-windows-shell.json"
          pnpm --dir packages/agent-executor run scenario:verify:windows-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ARCH-026 Windows scenario evidence
        if: env.WINDOWS_APPLICABLE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: arch-026-windows-shell-${{ github.run_id }}
          path: ${{ runner.temp }}/arch-026-windows-shell.json
          if-no-files-found: error

      - name: Windows verification not applicable
        if: env.WINDOWS_APPLICABLE != 'true'
        run: echo "This change does not affect Windows product behavior."

  # TEST-010: run the TUI PTY E2E suite (`*.ptytest.ts`) against the BUILT robota binary on every PR,
  # so the live-TUI behaviours — the SCREEN-013 Ctrl+B drill-in entry point and the existing
  # flag/scrollback/handoff PTY checks — are maintained, not bit-rotting outside CI.
  tui-e2e:
    name: tui-e2e
    runs-on: ubuntu-latest
    # See examples-typecheck: `!cancelled()` keeps a failed `build` from skipping this required check.
    needs: [changes, build]
    env:
      FULL_VERIFICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' }}
      TUI_APPLICABLE: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' || needs.changes.outputs.tui == 'true' }}
    # INFRA-058 fail-safe: `!cancelled()` disables GitHub's implicit `success()` over `needs`, so a
    # `changes` job that FAILED (as opposed to classifying docs-only) no longer turns this required
    # check into a `skipped` conclusion that branch protection accepts — it runs, matching the
    # classifier's own rule that every undeterminable case is CODE. A cancelled run still skips,
    # because a cancelled run is superseded, not unverified.
    if: ${{ !cancelled() && (github.base_ref || inputs.base_ref) != 'main' && needs.changes.result != 'cancelled' }}

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      - uses: actions/checkout@v7
        if: env.TUI_APPLICABLE == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      - name: Install pnpm
        if: env.TUI_APPLICABLE == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        if: env.TUI_APPLICABLE == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        if: env.TUI_APPLICABLE == 'true'
        run: pnpm install --frozen-lockfile

      # Reuse the build the `build` job already produced and uploaded, instead of repeating it.
      # Measured: this job spent about 80% of its runtime rebuilding what another job had just built,
      # and billing counts that wall clock. `quality` already consumes this artifact, so this is the
      # existing pattern rather than a new mechanism.
      #
      # The fallback is not optional: `build` uploads only when the run needs package dist, and a
      # required check that assumes an artifact is present would go from "slow" to "broken" the first
      # time it is absent. `continue-on-error` keeps a missing artifact on the fallback path rather
      # than failing the gate.
      - name: Download package build output
        id: dist
        if: env.TUI_APPLICABLE == 'true' && needs.build.result == 'success' && needs.build.outputs.package_dist_required == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: package-dist
          path: .artifacts/package-dist

      - name: Restore package build output
        id: restore
        if: env.TUI_APPLICABLE == 'true' && steps.dist.outcome == 'success'
        run: |
          tar -xzf .artifacts/package-dist/package-dist.tgz
          echo "restored=true" >> "$GITHUB_OUTPUT"

      # PTY tests execute the CLI/TUI target, not merely the changed owner. Complete exactly those
      # targets' dependency graph after any partial restore; do not traverse reverse dependents.
      - name: Guarantee CLI and TUI consumer dist
        if: env.TUI_APPLICABLE == 'true' && (needs.build.result != 'success' || needs.build.outputs.package_dist_complete != 'true')
        run: pnpm harness:workspace:run -- --operation build --changed-file packages/agent-cli/src/__ci_consumer_target__.ts --changed-file packages/agent-transport-tui/src/__ci_consumer_target__.ts

      - name: Run the TUI PTY E2E suite against the real binary
        if: env.TUI_APPLICABLE == 'true'
        run: pnpm --filter @robota-sdk/agent-transport-tui test:pty

      - name: TUI verification not applicable
        if: env.TUI_APPLICABLE != 'true'
        run: echo "This change does not affect TUI behavior."

  # HARNESS-041: mechanical floor for accidental-green regression tests. For a `fix:` PR with a
  # same-package (source+test) pair, it reverse-applies the source hunks and requires the changed test
  # to FAIL — proving the regression test actually exercises the fix. ENFORCING as of INFRA-046: the
  # job fails the run on `accidental-green` and on nothing else. NOT YET REQUIRED, which buys less
  # than it sounds like — `merge-gate.sh` refuses any non-CLEAN mergeStateStatus and GitHub reports
  # UNSTABLE when a NON-required check fails, so a red here stops merges either way. Held membership
  # is about the branch-protection ruleset, not about consequences; see required-status-checks.json.
  #
  # Promoted 2026-08-04 (INFRA-046) on measured evidence, not elapsed time. The 2026-07-25 audit
  # found ZERO substantive verdicts across 40 pull requests — the gate's core path had never once
  # executed, so promoting it then would have made a required check out of untested code. After
  # INFRA-071 widened the subject to `.claude/hooks` and `scripts/harness`, 13 of the last 22 runs
  # produced `red-proof-ok`: the reverse-apply-and-re-run path now runs on real changes, with no
  # false positive in the window.
  #
  # Required-check membership is deliberately HELD. `accidental-green` has never fired on a real pull
  # request, so its blocking path is unproven in production; making it required would put an untested
  # refusal in the merge path. One observed firing is the evidence that promotion needs.
  regression-red-proof:
    name: 'regression-red-proof (enforcing: accidental-green only)'
    runs-on: ubuntu-latest
    needs: changes
    # INFRA-058 fail-safe: `!cancelled()` disables GitHub's implicit `success()` over `needs`, so a
    # `changes` job that FAILED (as opposed to classifying docs-only) no longer turns this required
    # check into a `skipped` conclusion that branch protection accepts — it runs, matching the
    # classifier's own rule that every undeterminable case is CODE. A cancelled run still skips,
    # because a cancelled run is superseded, not unverified.
    if: ${{ !cancelled() && (github.base_ref || inputs.base_ref) != 'main' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}

    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      # INFRA-050: full history, no `--depth` fetch — check-regression-red-proof.mjs resolves the
      # PR's source hunks from `git merge-base <base> HEAD`, which a graft can truncate away.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || '' }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove regression tests are RED without the fix
        env:
          PR_BODY: ${{ github.event.pull_request.body || inputs.pr_body }}
          # ENFORCING (INFRA-046, owner decision 2026-08-04). Only `accidental-green` exits 1: a test
          # that still passes with the fix reversed guards nothing, and that is a defect whatever
          # else the run found. `inconclusive`, `skipped` and `red-proof-unreached` still pass, so a
          # verdict the checker could not reach never blocks a pull request.
          REGRESSION_RED_PROOF_ENFORCE: '1'
        run: node scripts/harness/check-regression-red-proof.mjs

  # INFRA-041: PR patch (diff) coverage — the lines a PR adds/changes in package/app `src` must
  # themselves be exercised by tests. The former global 80% average (compat-node18, removed) never
  # guaranteed this: a PR could add untested lines while the repo average stayed green. ADVISORY in
  # v1 (never blocks; the script exits 0 unless PATCH_COVERAGE_ENFORCE=1 — same rollout pattern as
  # regression-red-proof). Honest by construction: when coverage data for an affected package cannot
  # be produced, the verdict is INCONCLUSIVE with an explicit NO-DATA log — never a silent pass.
  # Runtime is bounded: a --detect pre-step gates the build+test steps to PRs that actually change
  # coverable src lines, and coverage runs execute ONLY the affected packages' suites.
  patch-coverage:
    name: patch-coverage (advisory)
    runs-on: ubuntu-latest
    # INFRA-094: `build` joins `needs` so this job can RESTORE the dist it used to rebuild. The item
    # offered two directions and only this one is available — its option (a), moving the job onto a
    # schedule, needs a `schedule:` trigger, and the 2026-08-04 owner directive removed every one of
    # those from this repository.
    #
    # The trade is stated rather than hidden: total COMPUTE falls by a whole `pnpm build:deps`, and
    # this job can no longer start before `build` finishes. It is advisory and blocks nothing, so
    # what it costs is a later advisory verdict, not a later merge.
    needs: [changes, build]
    env:
      FULL_VERIFICATION: ${{ needs.changes.result != 'success' || needs.changes.outputs.full == 'true' }}
    # INFRA-058 fail-safe: `!cancelled()` disables GitHub's implicit `success()` over `needs`, so a
    # `changes` job that FAILED (as opposed to classifying docs-only) no longer turns this required
    # check into a `skipped` conclusion that branch protection accepts — it runs, matching the
    # classifier's own rule that every undeterminable case is CODE. A cancelled run still skips,
    # because a cancelled run is superseded, not unverified.
    if: ${{ github.event_name == 'pull_request' && !cancelled() && github.base_ref != 'main' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}

    steps:
      # INFRA-050: full history, no `--depth` fetch — check-patch-coverage.mjs takes its changed
      # LINES from `git diff -U0 <merge-base>..HEAD`, which a graft can truncate away.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect packages with coverable changed lines
        id: detect
        env:
          PATCH_COVERAGE_BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/harness/check-patch-coverage.mjs --detect

      # INFRA-094: the `build` job already produced this exact dist and uploaded it as `package-dist`
      # — the same artifact `quality` and the binary e2e restore. Rebuilding it here compiled the
      # whole workspace a second time on every code pull request.
      - name: Download package build output
        if: steps.detect.outputs.affected == 'true' && needs.build.outputs.package_dist_required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: package-dist
          path: .artifacts/package-dist

      - name: Restore package build output
        if: steps.detect.outputs.affected == 'true' && needs.build.outputs.package_dist_required == 'true'
        run: tar -xzf .artifacts/package-dist/package-dist.tgz

      # Coverage consumes changed package tests and their imports. A partial restore is not enough;
      # complete exactly the changed owners' build prerequisites. A successful full producer needs
      # no duplicate work.
      - name: Guarantee affected coverage dist
        if: steps.detect.outputs.affected == 'true' && (needs.build.result != 'success' || needs.build.outputs.package_dist_complete != 'true')
        env:
          HARNESS_BASE_REF: origin/${{ github.base_ref }}
        run: pnpm build:affected

      - name: Compute patch coverage over changed lines
        if: steps.detect.outputs.affected == 'true'
        env:
          PATCH_COVERAGE_BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/harness/check-patch-coverage.mjs

      - name: Skip (no coverable src changes)
        if: steps.detect.outputs.affected != 'true'
        run: echo "No package/app src lines changed — patch coverage is a no-op for this PR."

  # Manual-only companions complete the 11-context develop benchmark without creating a pull
  # request. Normal pull_request behavior remains owned by review-gate.yml and
  # workflow-provenance-gate.yml; these jobs never run for that event.
  benchmark-review-gate:
    name: review-gate
    if: github.event_name == 'workflow_dispatch'
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0
      - name: Record PR-free review limitations
        run: |
          {
            echo '### PR-free review-gate benchmark'
            echo
            echo "- range: \`${{ inputs.base_ref }}...${{ inputs.head_ref }}\`"
            echo "- code classification: \`${{ needs.changes.outputs.code }}\`"
            echo '- Required PR policy is measured here; CodeQL runs after merge on develop/main.'
            echo '- PR labels, body policy, comments, and auto-merge are N/A without a pull request.'
          } >> "$GITHUB_STEP_SUMMARY"

  benchmark-workflow-provenance:
    name: workflow provenance
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse unsafe benchmark check attachment
        if: github.ref != 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: core.setFailed('PR-free benchmarks must use ref=develop so their checks cannot satisfy a feature PR.')

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      - name: Judge the explicit file range against guarded workflows
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          git fetch --no-tags origin "$HEAD_REF"
          node scripts/harness/scan-workflow-provenance.mjs \
            --base-ref "$BASE_REF" --head-ref FETCH_HEAD

  benchmark-summary:
    name: required-context benchmark summary
    if: ${{ github.event_name == 'workflow_dispatch' && always() }}
    needs:
      - build
      - quality
      - scans
      - dependency-audit
      - commitlint
      - tui-e2e
      - examples-typecheck
      - windows-shell
      - benchmark-review-gate
      - benchmark-workflow-provenance
      - regression-red-proof
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Measure all 11 develop-required contexts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          required='["build","quality","scans","dependency audit","commitlint","tui-e2e","examples-typecheck","windows-shell","review-gate","workflow provenance","regression-red-proof (enforcing: accidental-green only)"]'
          run_created_at="$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.created_at')"
          for attempt in {1..10}; do
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              > "$RUNNER_TEMP/job-pages.json"
            if jq -e --argjson required "$required" '
              [.[].jobs[]] as $jobs
              | [$required[] as $name | $jobs[] | select(.name == $name)]
              | length == 11 and all(.[]; (.completed_at | type) == "string")
            ' "$RUNNER_TEMP/job-pages.json" >/dev/null; then
              break
            fi
            if [[ "$attempt" == 10 ]]; then
              echo '::error::required job timestamps did not become conclusive'
              exit 1
            fi
            sleep 2
          done
          jq --argjson required "$required" --arg run_created_at "$run_created_at" '
            [.[].jobs[]] as $jobs
            | [$required[] as $name
              | [$jobs[] | select(.name == $name)] as $matches
              | if ($matches | length) != 1 then
                  error("expected exactly one benchmark job named " + $name)
                else
                  $matches[0]
                  | {
                      name,
                      conclusion,
                      started_at,
                      completed_at,
                      duration_seconds: ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)),
                      elapsed_seconds: ((.completed_at | fromdateiso8601) - ($run_created_at | fromdateiso8601))
                    }
                end]
          ' "$RUNNER_TEMP/job-pages.json" > "$RUNNER_TEMP/required-contexts.json"
          {
            echo '### Develop required-context benchmark'
            echo
            echo "Range: \`${{ inputs.base_ref }}...${{ inputs.head_ref }}\`"
            echo
            echo '| context | conclusion | job seconds | conclusive seconds |'
            echo '|---|---:|---:|---:|'
            jq -r '.[] | "| \(.name) | \(.conclusion) | \(.duration_seconds) | \(.elapsed_seconds) |"' \
              "$RUNNER_TEMP/required-contexts.json"
            echo
            jq -r '"Push-to-conclusive critical path: **\(map(.elapsed_seconds) | max) seconds** (target: 128 seconds)"' \
              "$RUNNER_TEMP/required-contexts.json"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e 'length == 11 and all(.[]; .conclusion == "success") and (map(.elapsed_seconds) | max) <= 128' \
            "$RUNNER_TEMP/required-contexts.json" >/dev/null
