name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-validation:
    name: pr-validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm deps:check
      - name: Release safety checks
        run: |
          node scripts/harness/check-publish-safety.mjs
          node scripts/harness/check-sdk-public-surface.mjs
          node scripts/harness/check-build-output-contracts.mjs

  secret-scan:
    name: secret-scan
    permissions:
      contents: read
    uses: ./.github/workflows/gitleaks.yml
    with:
      base_ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'push' && github.event.before || 'HEAD~1' }}
      head_ref: ''

  security:
    name: security
    needs: [secret-scan]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Secret scan must pass
        run: '[ "${{ needs.secret-scan.result }}" = success ]'
