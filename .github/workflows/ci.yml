name: CI
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
concurrency:
  # Keep retries out of the ref group so an old retry cannot replace a newer pending run.
  group: ${{ github.run_attempt == '1' && format('ci-{0}', github.ref) || format('ci-retry-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.run_attempt == '1' }}
permissions:
  contents: read
jobs:
  scope:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      developer_docs: ${{ steps.scope.outputs.developer_docs }}
      reuse_main: ${{ steps.scope.outputs.reuse_main }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
        with:
          install: 'false'
      - id: scope
        run: node scripts/ci.mjs scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_REUSE_MAIN: ${{ github.base_ref == 'develop' && github.head_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
  workspace-build:
    needs: scope
    if: needs.scope.outputs.developer_docs != 'true' && needs.scope.outputs.reuse_main != 'true'
    uses: ./.github/workflows/ci-check.yml
    with:
      kind: build
      plan: ${{ needs.scope.outputs.plan }}
  static-checks:
    needs: [scope, workspace-build]
    if: needs.scope.outputs.developer_docs != 'true' && needs.scope.outputs.reuse_main != 'true'
    uses: ./.github/workflows/ci-check.yml
    with:
      kind: static
      plan: ${{ needs.scope.outputs.plan }}
      artifact-id: ${{ needs.workspace-build.outputs.artifact-id }}
  tests:
    needs: [scope, workspace-build]
    if: needs.scope.outputs.developer_docs != 'true' && needs.scope.outputs.reuse_main != 'true'
    strategy:
      fail-fast: false
      matrix:
        kind: [tests-cli-1, tests-cli-2, tests-cli-3, tests-cli-4, tests-rest-1, tests-rest-2, tests-rest-3]
    uses: ./.github/workflows/ci-check.yml
    with:
      kind: ${{ matrix.kind }}
      plan: ${{ needs.scope.outputs.plan }}
      artifact-id: ${{ needs.workspace-build.outputs.artifact-id }}
  pr-validation:
    name: pr-validation
    needs: [scope, workspace-build, static-checks, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/ci.mjs gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
  secret-scan:
    name: secret-scan
    permissions:
      contents: read
    uses: ./.github/workflows/gitleaks.yml
    with:
      base_ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'push' && github.event.before || 'HEAD~1' }}
      head_ref: ''
  security:
    name: security
    needs: [secret-scan]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Secret scan must pass
        run: '[ "${{ needs.secret-scan.result }}" = success ]'
