name: Release — agent image

# Publishes ghcr.io/<owner>/robota:<version> (linux/amd64, linux/arm64) from docker/robota at the release
# tag, installing exactly the @robota-sdk/agent-cli release the tag names, so the image and the npm
# package are 1:1. Only a tag with the configured release prefix whose agent-cli manifest carries that
# version publishes; any other tag publishes nothing. The tag (pushed by release-tag-on-version-bump.yml)
# arrives before the separate npm publish, so the first job waits for that version on npm. The amd64
# image must pass docker/robota/smoke before anything is pushed. No floating `latest`: operators pin.

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Released @robota-sdk/agent-cli version to (re)build from its release tag and push, e.g. 3.0.0-beta.88.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the release and wait for it on npm
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      attestations: read
    env:
      PRODUCT_BUILD_ENV: ${{ vars.PRODUCT_BUILD_ENV }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      lock_sha256: ${{ steps.integrity.outputs.lock_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject an unreviewed tag source before executing repository dependencies
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "::error::Refusing an invalid release tag."
            exit 1
          fi
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$tag_commit" != "$GITHUB_SHA" ] || ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error::The pushed release tag is not the triggering commit on protected main history."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate selected product workspace
        id: product
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${PRODUCT_BUILD_ENV:-}" ]; then
            echo "::error::Configure vars.PRODUCT_BUILD_ENV before publishing the image."
            exit 1
          fi
          printf '%s' "$PRODUCT_BUILD_ENV" > "$RUNNER_TEMP/selected-product.env"
          pnpm exec tsx scripts/product/generate-workspace.mjs --env "$RUNNER_TEMP/selected-product.env" --out "$RUNNER_TEMP/product-workspace" --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Resolve the release tag and version
        id: release
        shell: bash
        env:
          TAG_PREFIX: ${{ steps.product.outputs.tag_prefix }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$TAG_PREFIX" ]; then
            echo "::error::PROJECT_RELEASE_TAG_PREFIX must be configured."
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
            tag="$TAG_PREFIX$version"
          else
            tag="$REF_NAME"
            if [[ "$tag" != "$TAG_PREFIX"* ]]; then
              echo "Tag '$tag' does not use the release prefix '$TAG_PREFIX'; nothing to publish."
              exit 0
            fi
            version="${tag#"$TAG_PREFIX"}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a release version."
            exit 1
          fi
          if ! manifest="$(git show "refs/tags/$tag:packages/agent-cli/package.json" 2>/dev/null)"; then
            echo "::error::Release tag $tag does not exist or has no packages/agent-cli/package.json."
            exit 1
          fi
          tagged="$(printf '%s' "$manifest" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          if [ "$tagged" != "$version" ]; then
            echo "::error::$tag carries agent-cli $tagged, not $version."
            exit 1
          fi
          tag_commit=$(git rev-parse "refs/tags/$tag^{commit}")
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error::$tag is not on protected main history."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Verify npm is the tarball published from this exact tag
        if: steps.release.outputs.version != ''
        id: integrity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          GH_VERSION=$(gh --version | head -1 | awk '{print $3}') node - <<'NODE'
          const [major, minor, patch] = process.env.GH_VERSION.split('.').map(Number);
          if ([major, minor, patch].some((part) => !Number.isInteger(part)) ||
              major < 2 || (major === 2 && minor < 102)) {
            throw new Error('GitHub CLI 2.102.0 or newer is required for safe release download and attestation verification');
          }
          NODE
          mkdir -p "$RUNNER_TEMP/npm-release"
          deadline=$(( $(date +%s) + 350 * 60 ))
          # allow-runner-wait: receipt assets are produced by the independently running publish and native release workflows.
          while :; do
            names=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if printf '%s\n' "$names" | grep -Fqx npm-release-integrity.json &&
               printf '%s\n' "$names" | grep -Fqx npm-release-package-lock.json; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::The attested npm release receipt did not become available within 350 minutes."
              exit 1
            fi
            sleep 60
          done
          gh release download "$TAG" --dir "$RUNNER_TEMP/npm-release" \
            --pattern npm-release-integrity.json \
            --pattern npm-release-package-lock.json
          manifest="$RUNNER_TEMP/npm-release/npm-release-integrity.json"
          lock="$RUNNER_TEMP/npm-release/npm-release-package-lock.json"
          gh attestation verify "$manifest" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/publish.yml" \
            --source-ref refs/heads/main --source-digest "$tag_commit" --signer-digest "$tag_commit"
          gh attestation verify "$lock" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/publish.yml" \
            --source-ref refs/heads/main --source-digest "$tag_commit" --signer-digest "$tag_commit"
          MANIFEST="$manifest" LOCK="$lock" TAG="$TAG" COMMIT="$tag_commit" VERSION="$VERSION" node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, 'utf8'));
          const packageName = `${process.env.PRODUCT_PACKAGE_SCOPE}/agent-cli`;
          const cli = manifest.packages?.find((entry) => entry.name === packageName);
          const lock = JSON.parse(fs.readFileSync(process.env.LOCK, 'utf8'));
          const lockSha256 = crypto.createHash('sha256').update(fs.readFileSync(process.env.LOCK)).digest('hex');
          const rootDependencies = lock.packages?.['']?.dependencies;
          const lockedCli = lock.packages?.[`node_modules/${packageName}`];
          const dependencyNames = rootDependencies && Object.keys(rootDependencies);
          const registry = new URL(process.env.PROJECT_NPM_REGISTRY_URL);
          const registryPrefix = registry.href.endsWith('/') ? registry.href : `${registry.href}/`;
          const lockEntries = Object.entries(lock.packages ?? {}).filter(([name]) => name !== '');
          const invalidResolution = lockEntries.some(([, entry]) => {
            if (entry.link || typeof entry.resolved !== 'string' ||
                !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(entry.integrity ?? '')) return true;
            let resolved;
            try { resolved = new URL(entry.resolved); } catch { return true; }
            return !resolved.href.startsWith(registryPrefix);
          });
          if (manifest.version !== 1 || manifest.tag !== process.env.TAG ||
              manifest.sourceCommit !== process.env.COMMIT ||
              manifest.productConfigSha256 !== process.env.PRODUCT_CONFIG_SHA256 ||
              manifest.packageScope !== process.env.PRODUCT_PACKAGE_SCOPE ||
              manifest.registry !== process.env.PROJECT_NPM_REGISTRY_URL ||
              manifest.installLockSha256 !== lockSha256 || cli?.version !== process.env.VERSION ||
              !/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(cli?.integrity ?? '') ||
              dependencyNames?.length !== 1 || dependencyNames[0] !== packageName ||
              rootDependencies?.[packageName] !== process.env.VERSION ||
              lockedCli?.version !== process.env.VERSION || lockedCli?.integrity !== cli.integrity ||
              invalidResolution) {
            throw new Error('npm release receipt does not bind this tag, commit, product, CLI, and install graph');
          }
          NODE
          expected=$(MANIFEST="$manifest" node -e "const m=require(process.env.MANIFEST); process.stdout.write(m.packages.find(p=>p.name===process.env.PRODUCT_PACKAGE_SCOPE+'/agent-cli').integrity)")
          actual=$(npm view "$PRODUCT_PACKAGE_SCOPE/agent-cli@$VERSION" dist.integrity --prefer-online --registry "$PROJECT_NPM_REGISTRY_URL")
          if [ "$actual" != "$expected" ]; then
            echo "::error::The registry CLI tarball differs from the tag-bound published artifact."
            exit 1
          fi
          cp "$lock" "$RUNNER_TEMP/release-package-lock.json"
          echo "lock_sha256=$(sha256sum "$lock" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Carry the verified install graph into the image job
        if: steps.release.outputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-image-lock-${{ steps.release.outputs.tag }}
          path: ${{ runner.temp }}/release-package-lock.json
          if-no-files-found: error
          retention-days: 1

  image:
    name: Build, smoke-test and push the image
    needs: resolve
    if: needs.resolve.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: release-image-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/robota
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Restore the verified install graph
        uses: actions/download-artifact@v7
        with:
          name: release-image-lock-${{ needs.resolve.outputs.tag }}
          path: docker/robota
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: docker/robota
          platforms: linux/amd64
          build-args: |
            ROBOTA_SOURCE=registry
            ROBOTA_VERSION=${{ env.VERSION }}
            ROBOTA_LOCK_SHA256=${{ needs.resolve.outputs.lock_sha256 }}
          load: true
          tags: robota:smoke
          cache-to: type=gha,mode=max
          cache-from: type=gha
      - name: Choose the AppArmor profile
        id: apparmor
        run: |
          # The runner is an ephemeral VM: load the repository's userns-only profile when AppArmor is active,
          # as the README tells operators to; without AppArmor the profile option is `unconfined`.
          if docker info --format '{{json .SecurityOptions}}' | grep -q apparmor; then
            sudo apparmor_parser -r docker/robota/apparmor/robota-userns
            echo "profile=robota-userns" >> "$GITHUB_OUTPUT"
          else
            echo "profile=unconfined" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke test
        run: docker/robota/smoke/smoke.sh robota:smoke "${{ steps.apparmor.outputs.profile }}"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 and arm64
        id: push
        uses: docker/build-push-action@v7
        with:
          context: docker/robota
          platforms: linux/amd64,linux/arm64
          build-args: |
            ROBOTA_SOURCE=registry
            ROBOTA_VERSION=${{ env.VERSION }}
            ROBOTA_LOCK_SHA256=${{ needs.resolve.outputs.lock_sha256 }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Attest signed build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
