name: scans-full

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/harness/**'
      - '.github/workflows/**'
      - '.agents/rules/**'
      - '.agents/skills/**'
      - '.agents/specs/**'
      - 'AGENTS.md'
      - 'ARCHITECTURE.md'
      - 'SECURITY.md'
      - '.dependency-cruiser.cjs'
      - '.eslintrc.json'
      - '.gitleaks.toml'
      - '.lintstagedrc.json'
      - '.npmrc'
      - '.nvmrc'
      - '.prettierignore'
      - '.prettierrc.json'
      - 'commitlint.config.js'
      - 'osv-scanner.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'stryker.conf.mjs'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - 'tsconfig.eslint.json'
      - 'vitest.config.ts'
      - 'vitest.shared.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scans-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks-full:
    name: repo-checks-full
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - name: Restore independently proven scan successes
        id: scan-success-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/robota-scan-successes
          key: robota-scan-success-v2-${{ runner.os }}-node22-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            robota-scan-success-v2-${{ runner.os }}-node22-
      - run: pnpm install --frozen-lockfile
      - name: Full repository checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm harness:scan -- --context integration --skip dist --skip build-contracts
      - name: Persist independently proven scan successes
        if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: .cache/robota-scan-successes
          key: ${{ steps.scan-success-cache.outputs.cache-primary-key }}

  harness-contracts-full:
    name: harness-contracts-full
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - name: Restore validated contract-test successes
        id: contract-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/robota-contract-tests
          key: robota-contract-tests-v3-full-${{ runner.os }}-node22-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            robota-contract-tests-v3-full-${{ runner.os }}-node22-
      - run: pnpm install --frozen-lockfile
      - name: Full harness contract suite
        run: pnpm harness:test:contracts
      - name: Persist independently proven contract successes
        if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: .cache/robota-contract-tests
          key: ${{ steps.contract-cache.outputs.cache-primary-key }}

  harness-hermetic-full:
    name: harness-hermetic-full
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Full stripped-repository behavior suite
        run: pnpm harness:test:hermetic

  full-harness:
    name: full-harness
    needs: [repo-checks-full, harness-contracts-full, harness-hermetic-full]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Aggregate full harness responsibilities
        env:
          REPO_RESULT: ${{ needs.repo-checks-full.result }}
          CONTRACT_RESULT: ${{ needs.harness-contracts-full.result }}
          HERMETIC_RESULT: ${{ needs.harness-hermetic-full.result }}
        run: |
          if [[ "$REPO_RESULT" != success || "$CONTRACT_RESULT" != success || "$HERMETIC_RESULT" != success ]]; then
            echo "::error::full harness failed: repo=$REPO_RESULT contracts=$CONTRACT_RESULT hermetic=$HERMETIC_RESULT"
            exit 1
          fi
      - name: Record a red full suite on the existing harness issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          printf -v body 'The full repository, contract, or hermetic harness responsibility is red at `%s`. Run: %s' "$short_sha" "$RUN_URL"
          gh issue comment 2423 --repo "$GITHUB_REPOSITORY" --body "$body"
