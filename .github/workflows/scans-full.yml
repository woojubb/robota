name: scans-full

# PROC-016. The `scans` job in ci.yml runs the AFFECTED scan set on a pull request, in the `pr`
# context where a prose/transcript scan's failure is advisory. This workflow is the other half: the
# WHOLE registry, in the `integration` context where every failure blocks, when the verification
# control plane changes and on demand. It is what keeps changes to affected-selection policy honest
# without charging every ordinary product push for a second repository-wide scan.
#
# It lives in its own workflow rather than as a job in ci.yml for two measured reasons:
#   - ci.yml's every job is gated for a pull request (`github.base_ref`, `needs.changes`); a `push`
#     trigger there would dispatch all seventeen, or need a guard on each.
#   - `scan-ci-concurrency-footprint` freezes the job count of every workflow a pull request can
#     trigger. This workflow has no `pull_request` trigger, so it costs the account's shared slots
#     only when verification ownership changes on `develop`.
#
# NO `schedule:` TRIGGER, by the 2026-08-04 owner directive that removed every one from this
# repository ("nothing asks on a clock any more" — security-scheduled.yml). PROC-016's plan named a
# nightly run; control-plane pushes and explicit dispatch carry that responsibility, and a nightly
# can be added back only by amending that directive, not by this file.
#
# On `push` there is no pull-request base, so the diff-reading scans resolve `origin/develop` — which
# is HEAD here — and judge an empty delta; their pull-request verdicts were rendered on the pull
# request. What this run adds is every scan the affected set excluded, over the whole tree, blocking.

on:
  push:
    branches: [develop]
    # Full integration scans validate the machinery and policy that selects cheaper PR checks.
    # Ordinary package/app source changes are intentionally absent: their affected checks already
    # ran before merge. A manual dispatch remains available for incidents and release confidence.
    paths:
      - 'scripts/harness/**'
      - '.github/workflows/**'
      - '.agents/rules/**'
      - '.agents/specs/**'
      - 'AGENTS.md'
      - 'ARCHITECTURE.md'
      - 'SECURITY.md'
      - '.dependency-cruiser.cjs'
      - '.eslintrc.json'
      - '.gitleaks.toml'
      - '.lintstagedrc.json'
      - '.npmrc'
      - '.nvmrc'
      - '.prettierignore'
      - '.prettierrc.json'
      - 'commitlint.config.js'
      - 'osv-scanner.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'stryker.conf.mjs'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - 'tsconfig.eslint.json'
      - 'vitest.config.ts'
      - 'vitest.shared.ts'
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref: a second push to `develop` supersedes the first's answer.
concurrency:
  group: scans-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scans-full:
    name: scans-full
    # Never on a pull request — the affected `scans` context in ci.yml is that lane. The trigger
    # list above already excludes it; the guard states the invariant where a later edit would meet it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # `issues: write` is for the final step only — a red full suite files (or updates) the issue
    # PROC-016's Decision names as the promotion blocker. Nothing broader: `contents: read` is the
    # checkout, restated because a job-level block replaces the workflow-level one. Justified in
    # `scan-workflow-permissions.mjs` → JUSTIFIED_JOB_WRITE_SCOPES.
    permissions:
      contents: read
      issues: write

    steps:
      # Full history: the suite contains base-history gates (see ci.yml → scans).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `dist` and `build-contracts` read build output a fresh checkout does not have (ci.yml → scans
      # says why). `--context integration` is the default, written out because it is the point.
      - name: Harness scan suite (full, integration context)
        env:
          GH_TOKEN: ${{ github.token }}
        # A develop push has no unique open PR subject. PR CI validates each topic receipt before
        # merge; asking the integration branch to rediscover one PR from aggregate history is
        # ambiguous by construction and made every direct integration scan red.
        run: pnpm harness:scan -- --context integration --skip dist --skip build-contracts --skip work-run-measurement

      # PROC-016 Decision: a full-suite failure files an issue and blocks promotion. One issue per
      # red streak, not one per push: a run that finds an open issue with the title prefix comments
      # the run URL on it; the first red run opens it, naming the tree it went red on. The prefix is
      # the search key, so the title is a contract — a rename here must rename the search too.
      # `gh` reads the token from the environment; nothing here interpolates untrusted text.
      - name: File or update the red-suite issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          prefix='scans-full is red on develop'
          short_sha="${GITHUB_SHA:0:7}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --search "\"$prefix\" in:title" --json number,title \
            --jq "map(select(.title | startswith(\"$prefix\"))) | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still red at \`$short_sha\`: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$prefix at $short_sha" \
              --body "$(printf '%s\n\n%s\n\n%s' \
                "The full scan suite (\`pnpm harness:scan -- --context integration\`) is red on \`develop\` at \`$short_sha\`." \
                "Run: $RUN_URL" \
                "PROC-016: a red full suite blocks promotion until this issue is closed. Later red runs comment here instead of opening a new issue.")"
          fi
