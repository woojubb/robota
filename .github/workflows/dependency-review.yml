name: Dependency Review

# Gate PR-introduced dependencies by vulnerability AND license policy (distinct from the lockfile-wide
# osv-scanner in ci.yml): dependency-review diffs the PR's ADDED deps and enforces a license allow-list.
# License gating matters here — the project is dual-licensed (AGPL + Commercial, no CLA yet), so a runtime
# dep under a strong-copyleft license would virally break the commercial-relicensing right.
#
# INFRA-061 — the scope claim above was checked against GitHub's actual dependency graph for this repo, since
# the whole gate rests on what that graph contains. It is not manifest-only: transitive, exact-versioned
# lockfile entries are present with resolved licenses (`brace-expansion@1.1.16 → MIT`, `ip@2.0.1 → MIT`,
# `minimatch@10.2.5 → BlueOak-1.0.0`), 2440 exact-version entries in all. So the allow-list really is
# evaluated over the pnpm-lock closure a PR adds to, not just the `^range` manifest entries.
#
# This check is ADVISORY — it is in neither branch ruleset's required-status-checks list, so a denied
# license or a high-severity advisory annotates the PR and blocks nothing. Making it required is a
# merge-gate change and is the owner's call.
on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize]
    # Dependency review is only meaningful when the dependency graph changes. This job is ADVISORY (not a
    # required status check), so a paths-skip is safe — for a REQUIRED check, a paths-filtered skip reports
    # "pending" forever and blocks merge, which is why ci.yml uses IN-JOB change detection instead.
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  pull-requests: write

# A superseded push should not keep a runner. Without this, every rapid re-push leaves the
# previous run to finish work whose answer is already stale, and it is billed in full.
# Scoped to the pull request, so runs on different PRs never cancel each other.
concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Fork PRs cannot post the summary comment; the check still runs read-only.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/dependency-review-action@v5
        with:
          # Block the PR on a newly-introduced HIGH+ vulnerability.
          fail-on-severity: high
          # Reviewed re-accepts. This repo judges the SAME advisory with two tools — osv-scanner (the
          # `security audit` job, via osv-scanner.toml) and this one — and a suppression in one is NOT
          # read by the other, so an accepted advisory must be recorded in BOTH or the two gates
          # disagree. Each id here MUST have its full reachability reasoning in `osv-scanner.toml`;
          # this list is the mirror, not the record.
          #   GHSA-mh99-v99m-4gvg — brace-expansion DoS. Dev-only (eslint/ts-eslint toolchain over the
          #   repo's own trusted source; `pnpm why -r --prod brace-expansion` → 0 production paths), no
          #   1.x/2.x backport exists, and 5.x is API-incompatible with the pinned minimatch (INFRA-044).
          allow-ghsas: GHSA-mh99-v99m-4gvg
          # License ALLOW-list (INFRA-047: replaces the v6-deprecated `deny-licenses`). The list is the
          # verified closure of SPDX leaf licenses present in the full pnpm-lock.yaml graph (prod + dev,
          # all platform variants) as of 2026-07-25 — every id is permissive/non-viral, preserving the
          # commercial-relicensing right of the dual license. Anything NOT listed — GPL/AGPL/LGPL/SSPL
          # and every other copyleft — now fails the check (strictly stronger than the old 6-id deny
          # list). MPL-2.0 is included deliberately: its copyleft is file-scoped to the MPL-licensed
          # files themselves and does not reach the containing work.
          # To extend: confirm the new id is permissive/non-viral, then append it here. The action
          # matches SPDX expressions per-leaf via spdx-satisfies: `A OR B` passes if EITHER id is
          # listed, `A AND B` only if BOTH are.
          allow-licenses: 0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BlueOak-1.0.0, CC-BY-4.0, CC0-1.0, ISC, MIT, MIT-0, MPL-2.0, Python-2.0, Unlicense, WTFPL
          # Name-scoped (any-version) exemptions for packages ALREADY in the graph whose license
          # expression contains a non-allowlisted leaf:
          # - @robota-sdk/*: our own published packages under our own dual license
          #   (`AGPL-3.0-only OR LicenseRef-Commercial`) — self-deps, not third-party ingress.
          # - @img/sharp-libvips-* and @img/sharp-wasm32: sharp's bundled libvips prebuilds
          #   (`LGPL-3.0-or-later`). LGPL stays OFF the general allow-list — a NEW LGPL dep now fails;
          #   only this existing family is exempted. If sharp adds a platform variant, extend THIS
          #   list (not allow-licenses).
          # - @img/sharp-win32-*: INFRA-115. These are the platform WRAPPERS, not prefabs, and they
          #   are here because Windows is the one platform where the two are the same package.
          #   Measured on this lockfile rather than assumed:
          #     @img/sharp-darwin-arm64  Apache-2.0                        optionalDep -> sharp-libvips-darwin-arm64
          #     @img/sharp-linux-x64     Apache-2.0                        optionalDep -> sharp-libvips-linux-x64
          #     @img/sharp-win32-x64     Apache-2.0 AND LGPL-3.0-or-later  NO optionalDep
          #   Every other wrapper delegates libvips to a `sharp-libvips-*` prefab and stays plain
          #   Apache-2.0, which `allow-licenses` already passes. The win32 wrappers ship the libvips
          #   DLLs inside themselves, so they carry the LGPL leaf directly — and `A AND B` passes only
          #   if BOTH leaves are listed, which is why exactly these three failed and nothing else did.
          #   `@img/sharp-libvips-win32-*` DOES exist on the registry (1.3.2) but is absent from this
          #   lockfile, so listing it would exempt a package we do not have.
          allow-dependencies-licenses: >-
            pkg:npm/%40robota-sdk/agent-core,
            pkg:npm/%40robota-sdk/agent-provider,
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-wasm32,
            pkg:npm/%40img/sharp-win32-arm64,
            pkg:npm/%40img/sharp-win32-ia32,
            pkg:npm/%40img/sharp-win32-x64
          comment-summary-in-pr: on-failure
