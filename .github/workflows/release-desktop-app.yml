name: Release — Desktop app

on:
  workflow_run:
    workflows: ['Release — Bun binaries']
    types: [completed]
  workflow_dispatch:
    inputs:
      product_env:
        description: 'Non-secret product environment file contents; otherwise uses vars.PRODUCT_BUILD_ENV.'
        required: false
        type: string
      tag:
        description: 'Existing configured-prefix release tag to build and attach installers to. Must already exist.'
        required: true
        type: string
      verify_only:
        description: "Skip packaging; only run the macOS artifact verification gate against the tag's ALREADY-PUBLISHED assets."
        required: false
        default: false
        type: boolean
      publish:
        description: 'Publish installers after verification. False builds an unpublished candidate.'
        required: false
        default: true
        type: boolean
      source_ref:
        description: 'Exact product commit SHA for an unpublished candidate. Published installers always use the release tag.'
        required: false
        type: string
      candidate_platform:
        description: 'Limit an unpublished candidate to Windows while diagnosing native failures. Published builds always cover all platforms.'
        required: false
        default: all
        type: choice
        options:
          - all
          - windows

permissions:
  contents: write

concurrency:
  group: ${{ github.event.inputs.verify_only == 'true' && 'verify-release-assets-' || 'release-assets-' }}${{ github.event.inputs.tag || github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Package + publish (${{ matrix.os }})
    env:
      PRODUCT_BUILD_ENV: ${{ github.event.inputs.product_env || vars.PRODUCT_BUILD_ENV }}
    if: >-
      ${{ github.event.inputs.verify_only != 'true' && (github.event_name != 'workflow_run'
        || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event.inputs.publish == 'false' && github.event.inputs.candidate_platform == 'windows'
            && '[{"os":"windows-latest","bun_target":"windows-x64","assets":"release/*.exe"}]'
            || '[{"os":"ubuntu-latest","bun_target":"linux-x64","assets":"release/*.AppImage release/*.deb"},{"os":"macos-latest","bun_target":"darwin-arm64","assets":"release/*.dmg release/*.zip"},{"os":"windows-latest","bun_target":"windows-x64","assets":"release/*.exe"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Resolve product source
        id: source
        shell: bash
        env:
          PUBLISH: ${{ github.event.inputs.publish }}
          SOURCE_REF: ${{ github.event.inputs.source_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$PUBLISH" = false ]; then
            source=${SOURCE_REF:-$WORKFLOW_SHA}
            if ! [[ "$source" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::candidate source must be an exact commit SHA"
              exit 1
            fi
          else
            if [ -n "$SOURCE_REF" ]; then
              echo "::error::published installers must use the release tag"
              exit 1
            fi
            source=$TAG
          fi
          echo "ref=$source" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.source.outputs.ref }}

      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/release
            apps/agent-app/electron-builder.yml
            apps/agent-app/scripts/bundle-runtime.mjs
            apps/agent-app/e2e/bundled-runtime-e2e.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release packaging and verification tooling
        shell: bash
        run: |
          cp .release-tools/apps/agent-app/scripts/bundle-runtime.mjs apps/agent-app/scripts/bundle-runtime.mjs
          cp .release-tools/apps/agent-app/e2e/bundled-runtime-e2e.mjs apps/agent-app/e2e/bundled-runtime-e2e.mjs
          if [ "$RUNNER_OS" = macOS ]; then
            cp .release-tools/apps/agent-app/electron-builder.yml apps/agent-app/electron-builder.yml
          fi

      - name: Generate selected product workspace
        id: product
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${PRODUCT_BUILD_ENV:-}" ]; then
            echo "::error::Select product_env or configure vars.PRODUCT_BUILD_ENV before building a release."
            exit 1
          fi
          printf '%s' "$PRODUCT_BUILD_ENV" > "$RUNNER_TEMP/selected-product.env"
          pnpm exec tsx scripts/product/generate-workspace.mjs --env "$RUNNER_TEMP/selected-product.env" --out "$RUNNER_TEMP/product-workspace" --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"

      - name: Validate configured release tag
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$PROJECT_RELEASE_TAG_PREFIX" ] || [[ "$TAG" != "$PROJECT_RELEASE_TAG_PREFIX"* ]]; then
            echo "::error::The selected tag must use the configured PROJECT_RELEASE_TAG_PREFIX."
            exit 1
          fi

      - name: Require the native release before publishing installers
        if: github.event.inputs.publish != 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          required="${PRODUCT_ARTIFACT_PREFIX:-$PRODUCT_CLI_NAME}-darwin-arm64 ${PRODUCT_ARTIFACT_PREFIX:-$PRODUCT_CLI_NAME}-darwin-x64 ${PRODUCT_ARTIFACT_PREFIX:-$PRODUCT_CLI_NAME}-linux-arm64 ${PRODUCT_ARTIFACT_PREFIX:-$PRODUCT_CLI_NAME}-linux-x64 ${PRODUCT_ARTIFACT_PREFIX:-$PRODUCT_CLI_NAME}-windows-x64.exe SHA256SUMS.txt"
          for name in $required; do
            if ! printf '%s\n' "$names" | grep -Fqx "$name"; then
              echo "::error::Native release asset $name is missing. Run release-bun-binaries.yml for $TAG before retrying installers."
              exit 1
            fi
          done

      - name: Verify Windows native control transport
        working-directory: ${{ env.PRODUCT_WORKSPACE }}
        if: runner.os == 'Windows'
        run: pnpm install --frozen-lockfile && pnpm --filter './packages/agent-cli' exec vitest run --no-file-parallelism --reporter verbose src/session-inventory/__tests__/windows-security.test.ts src/session-inventory/__tests__/windows-control-pipe.test.ts

      - name: Build workspace
        working-directory: ${{ env.PRODUCT_WORKSPACE }}
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Compile the host CLI binary
        working-directory: ${{ env.PRODUCT_WORKSPACE }}
        run: pnpm --filter './packages/agent-cli' build:bun:${{ matrix.bun_target }}

      - name: Prepare macOS release credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node .release-tools/scripts/release/setup-macos-signing.mjs setup

      - name: Sign the bundled macOS runtime with Bun's entitlements
        if: runner.os == 'macOS'
        env:
          BINARY: ${{ env.PRODUCT_WORKSPACE }}/packages/agent-cli/dist-bun/${{ steps.product.outputs.artifact_prefix }}-${{ matrix.bun_target }}
        run: |
          node .release-tools/scripts/release/macos-signing.mjs sign-runtime "$BINARY"

      - name: Package the desktop app (bundles the runtime)
        working-directory: ${{ env.PRODUCT_WORKSPACE }}
        shell: bash
        env:
          LINUX_PACKAGE_MAINTAINER: ${{ vars.PRODUCT_LINUX_MAINTAINER }}
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then
            args+=(--config.forceCodeSigning=true)
          elif [ "$RUNNER_OS" = Linux ] && [ -n "$LINUX_PACKAGE_MAINTAINER" ]; then
            args+=("--config.linux.maintainer=$LINUX_PACKAGE_MAINTAINER")
          fi
          pnpm --filter './apps/agent-app' dist:app "${args[@]}"

      - name: Sign, notarize and staple the macOS disk image
        if: runner.os == 'macOS'
        run: node .release-tools/scripts/release/macos-signing.mjs notarize-dmgs "${{ env.PRODUCT_WORKSPACE }}/apps/agent-app/release"

      - name: Exercise the packaged runtime
        working-directory: ${{ env.PRODUCT_WORKSPACE }}
        run: pnpm --filter './apps/agent-app' test:e2e:bundled

      - name: Assert packaged artifacts exist and are non-trivial
        shell: bash
        working-directory: ${{ env.PRODUCT_WORKSPACE }}/apps/agent-app
        env:
          ASSETS: ${{ matrix.assets }}
          MATCHES_FILE: ${{ runner.temp }}/list-release-assets-assert.txt
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/scripts/release/list-release-assets.mjs"
          if [ ! -f "$script" ]; then
            echo "::error::this tag predates scripts/release/list-release-assets.mjs, so its release assets cannot be rebuilt by this workflow; cut a new tag instead"
            exit 1
          fi
          if ! node "$script" "$ASSETS" >"$MATCHES_FILE"; then
            echo "::error::scripts/release/list-release-assets.mjs failed matching '$ASSETS' — see the Node error above"
            exit 1
          fi
          found=()
          while IFS= read -r -d '' f; do found+=("$f"); done <"$MATCHES_FILE"
          rm -f "$MATCHES_FILE"
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::no artifacts matched '$ASSETS' — electron-builder produced nothing to publish."
            exit 1
          fi
          for f in "${found[@]}"; do
            size=$(wc -c <"$f")
            echo "$f -> $size bytes"
            if [ "$size" -lt 1048576 ]; then
              echo "::error::$f is $size bytes — truncated or empty, refusing to publish."
              exit 1
            fi
          done

      - name: Generate SHA-256 checksums for this OS's installers
        shell: bash
        working-directory: ${{ env.PRODUCT_WORKSPACE }}/apps/agent-app
        env:
          ASSETS: ${{ matrix.assets }}
          MANIFEST: SHA256SUMS-desktop-${{ matrix.os }}.txt
          MATCHES_FILE: ${{ runner.temp }}/list-release-assets-checksum.txt
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/scripts/release/list-release-assets.mjs"
          if [ ! -f "$script" ]; then
            echo "::error::this tag predates scripts/release/list-release-assets.mjs, so its release assets cannot be rebuilt by this workflow; cut a new tag instead"
            exit 1
          fi
          if ! node "$script" "$ASSETS" >"$MATCHES_FILE"; then
            echo "::error::scripts/release/list-release-assets.mjs failed matching '$ASSETS' — see the Node error above"
            exit 1
          fi
          found=()
          while IFS= read -r -d '' f; do found+=("$f"); done <"$MATCHES_FILE"
          rm -f "$MATCHES_FILE"
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::no artifacts matched '$ASSETS' — nothing to hash."
            exit 1
          fi
          : >"release/$MANIFEST"
          cd release
          for f in "${found[@]}"; do
            name=${f#release/}
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -- "$name" >>"$MANIFEST"
            else
              shasum -a 256 -- "$name" >>"$MANIFEST"
            fi
          done
          if [ ! -s "$MANIFEST" ]; then
            echo "::error::checksum manifest is empty — nothing was hashed."
            exit 1
          fi
          cat "$MANIFEST"

      - name: Generate release notes
        if: github.event.inputs.publish != 'false'
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/release/generate-release-notes.mjs --tag "$TAG" --tag-prefix "$PROJECT_RELEASE_TAG_PREFIX" --notes-file "${{ runner.temp }}/release-notes.md"

      - name: Publish installers to the GitHub Release
        if: github.event.inputs.publish != 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ runner.temp }}/release-notes.md
          ASSETS: ${{ matrix.assets }}
          MANIFEST: release/SHA256SUMS-desktop-${{ matrix.os }}.txt
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GH_REPO" --title "$TAG" --notes-file "$NOTES"
          # `# reason`, not `-- reason`: shellcheck cannot PARSE the `--` form, and a directive it
          # shellcheck disable=SC2086 # $ASSETS is an intentional multi-pattern glob list.
          gh release upload "$TAG" --repo "$GH_REPO" $ASSETS "$MANIFEST" --clobber
        working-directory: ${{ env.PRODUCT_WORKSPACE }}/apps/agent-app

      - name: Remove macOS release credentials
        if: ${{ always() && runner.os == 'macOS' }}
        run: node .release-tools/scripts/release/setup-macos-signing.mjs cleanup

  await-published-assets:
    name: Wait for the tag's release assets to be published
    runs-on: ubuntu-latest
    needs: [desktop]
    if: ${{ !cancelled() && github.event.inputs.publish != 'false' && (github.event.inputs.verify_only == 'true' || needs.desktop.result == 'success') }}
    env:
      PRODUCT_BUILD_ENV: ${{ github.event.inputs.product_env || vars.PRODUCT_BUILD_ENV }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Generate selected product workspace
        id: product
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${PRODUCT_BUILD_ENV:-}" ]; then
            echo "::error::Select product_env or configure vars.PRODUCT_BUILD_ENV before building a release."
            exit 1
          fi
          printf '%s' "$PRODUCT_BUILD_ENV" > "$RUNNER_TEMP/selected-product.env"
          pnpm exec tsx scripts/product/generate-workspace.mjs --env "$RUNNER_TEMP/selected-product.env" --out "$RUNNER_TEMP/product-workspace" --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"

      - name: Poll until every macOS asset exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          required="${PRODUCT_ARTIFACT_PREFIX:-$PRODUCT_CLI_NAME}-darwin-arm64 ${PRODUCT_ARTIFACT_PREFIX:-$PRODUCT_CLI_NAME}-darwin-x64 SHA256SUMS.txt"
          deadline=$(( $(date +%s) + 1500 ))   # 25 minutes
          # allow-runner-wait: a release runs with a human or agent already driving it, and this
          while :; do
            names=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            missing=""
            for r in $required; do
              printf '%s\n' "$names" | grep -qx "$r" || missing="$missing $r"
            done
            printf '%s\n' "$names" | grep -q '\.dmg$' || missing="$missing <a .dmg>"
            if [ -z "$missing" ]; then
              echo "all required assets present on $TAG"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timed out waiting for release assets on $TAG; still missing:$missing"
              exit 1
            fi
            echo "waiting for:$missing"
            # allow-runner-wait: the interval of the release poll suppressed above.
            sleep 30
          done

  verify-macos-artifacts:
    name: Verify published macOS artifacts open on a user's Mac
    runs-on: macos-latest
    needs: [await-published-assets]
    if: ${{ !cancelled() && needs.await-published-assets.result == 'success' }}
    env:
      PRODUCT_BUILD_ENV: ${{ github.event.inputs.product_env || vars.PRODUCT_BUILD_ENV }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Generate selected product workspace
        id: product
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${PRODUCT_BUILD_ENV:-}" ]; then
            echo "::error::Select product_env or configure vars.PRODUCT_BUILD_ENV before building a release."
            exit 1
          fi
          printf '%s' "$PRODUCT_BUILD_ENV" > "$RUNNER_TEMP/selected-product.env"
          pnpm exec tsx scripts/product/generate-workspace.mjs --env "$RUNNER_TEMP/selected-product.env" --out "$RUNNER_TEMP/product-workspace" --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"

      - name: Download the PUBLISHED macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/published"
          cd "${{ runner.temp }}/published"
          gh release download "$TAG" \
            -p "${PRODUCT_ARTIFACT_PREFIX:-$PRODUCT_CLI_NAME}-darwin-arm64" \
            -p "${PRODUCT_ARTIFACT_PREFIX:-$PRODUCT_CLI_NAME}-darwin-x64" \
            -p 'SHA256SUMS*.txt' \
            -p '*.dmg' \
            --clobber
          ls -la

      - name: Verify the artifacts a user actually downloads
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PRODUCT_ARTIFACT_PREFIX: ${{ steps.product.outputs.artifact_prefix }}
        run: bash scripts/harness/verify-macos-release-artifacts.sh "$TAG" "${{ runner.temp }}/published"
