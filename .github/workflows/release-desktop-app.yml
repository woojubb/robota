name: Release — Desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build + attach installers to (e.g. v3.0.0-beta.79). Must already exist.'
        required: true
        type: string
      verify_only:
        description: "Skip packaging; only run the macOS artifact verification gate against the tag's ALREADY-PUBLISHED assets."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-assets-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Package + publish (${{ matrix.os }})
    if: github.event.inputs.verify_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bun_target: linux-x64
            assets: release/*.AppImage release/*.deb
          - os: macos-latest
            bun_target: darwin-arm64
            assets: release/*.dmg release/*.zip
          - os: windows-latest
            bun_target: windows-x64
            assets: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Checkout macOS release tooling
        if: runner.os == 'macOS'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/release
            apps/agent-app/electron-builder.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Compile the host Bun runtime binary
        run: pnpm --filter @robota-sdk/agent-cli build:bun:headless:${{ matrix.bun_target }}

      - name: Prepare macOS release credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node .release-tools/scripts/release/setup-macos-signing.mjs setup

      - name: Sign the bundled macOS runtime with Bun's entitlements
        if: runner.os == 'macOS'
        env:
          BINARY: packages/agent-cli/dist-bun-headless/robota-headless-${{ matrix.bun_target }}
        run: |
          node .release-tools/scripts/release/macos-signing.mjs sign-runtime "$BINARY"
          cp .release-tools/apps/agent-app/electron-builder.yml apps/agent-app/electron-builder.yml

      - name: Package the desktop app (bundles the runtime)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            pnpm --filter @robota-sdk/agent-app dist:app --config.forceCodeSigning=true
          else
            pnpm --filter @robota-sdk/agent-app dist:app
          fi

      - name: Sign, notarize and staple the macOS disk image
        if: runner.os == 'macOS'
        run: node .release-tools/scripts/release/macos-signing.mjs notarize-dmgs apps/agent-app/release

      - name: Exercise the packaged runtime
        run: pnpm --filter @robota-sdk/agent-app test:e2e:bundled

      - name: Assert packaged artifacts exist and are non-trivial
        shell: bash
        working-directory: apps/agent-app
        env:
          ASSETS: ${{ matrix.assets }}
          MATCHES_FILE: ${{ runner.temp }}/list-release-assets-assert.txt
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/scripts/release/list-release-assets.mjs"
          if [ ! -f "$script" ]; then
            echo "::error::this tag predates scripts/release/list-release-assets.mjs, so its release assets cannot be rebuilt by this workflow; cut a new tag instead"
            exit 1
          fi
          if ! node "$script" "$ASSETS" >"$MATCHES_FILE"; then
            echo "::error::scripts/release/list-release-assets.mjs failed matching '$ASSETS' — see the Node error above"
            exit 1
          fi
          found=()
          while IFS= read -r -d '' f; do found+=("$f"); done <"$MATCHES_FILE"
          rm -f "$MATCHES_FILE"
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::no artifacts matched '$ASSETS' — electron-builder produced nothing to publish."
            exit 1
          fi
          for f in "${found[@]}"; do
            size=$(wc -c <"$f")
            echo "$f -> $size bytes"
            if [ "$size" -lt 1048576 ]; then
              echo "::error::$f is $size bytes — truncated or empty, refusing to publish."
              exit 1
            fi
          done

      - name: Generate SHA-256 checksums for this OS's installers
        shell: bash
        working-directory: apps/agent-app
        env:
          ASSETS: ${{ matrix.assets }}
          MANIFEST: SHA256SUMS-desktop-${{ matrix.os }}.txt
          MATCHES_FILE: ${{ runner.temp }}/list-release-assets-checksum.txt
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/scripts/release/list-release-assets.mjs"
          if [ ! -f "$script" ]; then
            echo "::error::this tag predates scripts/release/list-release-assets.mjs, so its release assets cannot be rebuilt by this workflow; cut a new tag instead"
            exit 1
          fi
          if ! node "$script" "$ASSETS" >"$MATCHES_FILE"; then
            echo "::error::scripts/release/list-release-assets.mjs failed matching '$ASSETS' — see the Node error above"
            exit 1
          fi
          found=()
          while IFS= read -r -d '' f; do found+=("$f"); done <"$MATCHES_FILE"
          rm -f "$MATCHES_FILE"
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::no artifacts matched '$ASSETS' — nothing to hash."
            exit 1
          fi
          : >"release/$MANIFEST"
          cd release
          for f in "${found[@]}"; do
            name=${f#release/}
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -- "$name" >>"$MANIFEST"
            else
              shasum -a 256 -- "$name" >>"$MANIFEST"
            fi
          done
          if [ ! -s "$MANIFEST" ]; then
            echo "::error::checksum manifest is empty — nothing was hashed."
            exit 1
          fi
          cat "$MANIFEST"

      - name: Generate release notes
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/release/generate-release-notes.mjs --tag "$TAG" --notes-file "${{ runner.temp }}/release-notes.md"

      - name: Publish installers to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ runner.temp }}/release-notes.md
          ASSETS: ${{ matrix.assets }}
          MANIFEST: release/SHA256SUMS-desktop-${{ matrix.os }}.txt
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          # `# reason`, not `-- reason`: shellcheck cannot PARSE the `--` form, and a directive it
          # shellcheck disable=SC2086 # $ASSETS is an intentional multi-pattern glob list.
          gh release upload "$TAG" $ASSETS "$MANIFEST" --clobber
        working-directory: apps/agent-app

      - name: Remove macOS release credentials
        if: ${{ always() && runner.os == 'macOS' }}
        run: node .release-tools/scripts/release/setup-macos-signing.mjs cleanup

  await-published-assets:
    name: Wait for the tag's release assets to be published
    runs-on: ubuntu-latest
    needs: [desktop]
    if: ${{ !cancelled() && (github.event.inputs.verify_only == 'true' || needs.desktop.result == 'success') }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Poll until every macOS asset exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          required="robota-darwin-arm64 robota-darwin-x64 SHA256SUMS.txt"
          deadline=$(( $(date +%s) + 1500 ))   # 25 minutes
          # allow-runner-wait: a release runs with a human or agent already driving it, and this
          while :; do
            names=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            missing=""
            for r in $required; do
              printf '%s\n' "$names" | grep -qx "$r" || missing="$missing $r"
            done
            printf '%s\n' "$names" | grep -q '\.dmg$' || missing="$missing <a .dmg>"
            if [ -z "$missing" ]; then
              echo "all required assets present on $TAG"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timed out waiting for release assets on $TAG; still missing:$missing"
              exit 1
            fi
            echo "waiting for:$missing"
            # allow-runner-wait: the interval of the release poll suppressed above.
            sleep 30
          done

  verify-macos-artifacts:
    name: Verify published macOS artifacts open on a user's Mac
    runs-on: macos-latest
    needs: [await-published-assets]
    if: ${{ !cancelled() && needs.await-published-assets.result == 'success' }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Download the PUBLISHED macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/published"
          cd "${{ runner.temp }}/published"
          gh release download "$TAG" \
            -p 'robota-darwin-arm64' \
            -p 'robota-darwin-x64' \
            -p 'SHA256SUMS*.txt' \
            -p '*.dmg' \
            --clobber
          ls -la

      - name: Verify the artifacts a user actually downloads
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/harness/verify-macos-release-artifacts.sh "$TAG" "${{ runner.temp }}/published"
