name: Review Gate

# Contained — INFRA-097. A pull_request run loads this workflow YAML from the PR merge revision.
# Exact-base checkout below protects the scripts it executes but cannot make the workflow control
# plane itself trusted. INFRA-097 owns the required-workflow/ruleset provenance fix; this item changes
# ordering only and must not claim that a PR cannot rewrite its own workflow.

# `review-policy` owns fast pull-request policy and the current-head independent-review receipt.
# CodeQL remains on pushes to develop/main in `codeql.yml`; it is deliberately outside the required
# PR critical path.

on:
  pull_request:
    branches: [main, develop, integration/**]
    # Label changes re-run disposition policy without requiring a push.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # A submitted/edited/dismissed GitHub review rechecks the exact-head review receipt without a
  # source push. A delegated agent verdict is published as a COMMENTED review with the strict
  # INDEPENDENT_REVIEW body below, so it takes this same event path.
  pull_request_review:
    types: [submitted, edited, dismissed]

concurrency:
  group: review-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every job declares its own minimum capability. This empty workflow default prevents a new job
# from silently inheriting the repository's token permissions.
permissions: {}

jobs:
  review-policy:
    name: review-policy
    # A post-merge body edit can redispatch the workflow. A merged PR has nothing left to decide.
    if: ${{ github.event.pull_request.merged != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The workflow itself is PR-controlled until required-workflow provenance lands. Load the
      # shared review projection from the same PR revision so this first landing remains runnable;
      # workflow-provenance is the explicit containment check for that control-plane boundary.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Is there a trusted independent review for the current head?
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWS_FILE: ${{ runner.temp }}/reviews.json
        run: |
          set -euo pipefail
          if ! gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            > "$REVIEWS_FILE"; then
            echo "::error::review-policy: could not read reviews for PR #${PR_NUMBER}."
            exit 1
          fi
          node scripts/harness/review-verdict-projection.mjs

  # INFRA-057. Disarming an armed auto-merge is INFRA-048's stated lever for the #1409 hole: a red
  # NON-REQUIRED check does not stop an auto-merge by itself. It had never once worked. Measured on
  # #1461 and again on the throwaway #1465, from the gate's own log:
  #
  #     GraphQL: Resource not accessible by integration (disablePullRequestAutoMerge)
  #     auto-merge was not armed; nothing to disarm.
  #
  # Two defects, one line apart:
  #
  #   1. `|| echo "auto-merge was not armed"` fires on ANY non-zero exit, so a permission denial and
  #      a genuine no-op printed the same benign sentence. Only one of them is benign. The states are
  #      now decided by READING the auto-merge state before and after — not by parsing an error
  #      string — so the verdict stays correct whatever the failure was.
  #   2. The gate job carries `contents: read`. GitHub's auto-merge mutations are a MERGE capability:
  #      they need `contents: write` as well as `pull-requests: write`. The same token posted a PR
  #      comment successfully one second later, which is what rules out "the token has no write scope
  #      at all" and pins the gap to `contents`.
  #
  # Why a SEPARATE job rather than `contents: write` on the gate. The gate executes trusted scripts
  # from the base revision and still handles PR-derived API data; keeping repository-write authority
  # out of that decision job is the least-privilege boundary. This job checks nothing out and runs
  # `gh` only, so its write scope never meets checked-out content.
  #
  # What this lever is and is not. It is belt-and-braces, not the guarantee:
  #   - On `develop` it is redundant — `review-policy` is a REQUIRED check on `protect-develop`, so a
  #     red gate stops the merge on its own.
  #   - On `main` it is the only automatic lever, because `protect-main` requires `promotion
  #     ancestry` / `main PR source guard` / `release-grade verification` and NOT `review-policy`.
  #     Auto-merge can fire as soon as those required checks pass. Only a required check is race-free.
  #   - On a FORK pull request GitHub issues a read-only token whatever `permissions:` says, so the
  #     disarm cannot work at all. It reports STILL ARMED, loudly, instead of claiming success.
  disarm-auto-merge:
    name: disarm-auto-merge
    needs: review-policy
    if: ${{ always() && needs.review-policy.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Disarm auto-merge, and report which of the three states actually happened
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `yes` / `no` / `unknown` — never a silent empty string. An unreadable state is its own
          # answer and must not be rounded down to "not armed".
          read_armed() {
            gh pr view "$PR_NUMBER" --json autoMergeRequest \
              --jq 'if .autoMergeRequest == null then "no" else "yes" end' 2>/dev/null \
              || echo 'unknown'
          }

          before="$(read_armed)"
          if [ "$before" = 'no' ]; then
            # STATE 1 — nothing to disarm. The only benign one, and now the only one that says so.
            echo 'auto-merge: NOTHING TO DISARM — auto-merge was not armed on this PR.'
            exit 0
          fi
          echo "auto-merge was armed on this PR (state before: ${before}); disarming."

          # `unknown` deliberately takes this path too: a state that could not be read is not a
          # reason to skip the disarm, and it is not a reason to report success.
          set +e
          disarm_output="$(gh pr merge --disable-auto "$PR_NUMBER" 2>&1)"
          disarm_exit=$?
          set -e
          # `-e` is on: an `A && B` list whose A is false would exit the step, so this is an `if`.
          if [ -n "$disarm_output" ]; then printf '%s\n' "$disarm_output"; fi

          after="$(read_armed)"
          if [ "$after" = 'no' ]; then
            # STATE 2 — actually disarmed.
            echo 'auto-merge: DISARMED — the armed auto-merge on this PR has been removed.'
            gh pr comment "$PR_NUMBER" --body \
              '**Review gate: BLOCKED** — the auto-merge armed on this PR has been disarmed.' || true
            exit 0
          fi

          # STATE 3 — still armed. Permission denial, fork PR, API failure: the cause differs, the
          # consequence does not, and the consequence is what has to be loud. This job goes RED.
          echo "::error::review-policy: auto-merge is STILL ARMED on PR #${PR_NUMBER} and could NOT be disarmed (gh exit ${disarm_exit}, state after: ${after}). The review policy is red but the merge is not being held back by this lever — hold the merge by hand, or make review-policy a required status check on this base branch."
          gh pr comment "$PR_NUMBER" --body-file - <<EOF || true
          **Review gate: BLOCKED — and auto-merge could NOT be disarmed.**

          Auto-merge is **still armed** on this PR (\`gh pr merge --disable-auto\` exited \`${disarm_exit}\`, state after: \`${after}\`).
          If \`review-policy\` is not a required status check on this base branch, this PR can still merge with the policy red. Disarm it by hand or hold the merge.

          \`\`\`
          ${disarm_output}
          \`\`\`
          EOF
          exit 1
