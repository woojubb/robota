name: Review Gate

# INFRA-048. The checks that gate a merge on `develop` produce no review feedback, and the two jobs
# that do (`Claude review`, CodeQL `Analyze`) report `success` whether or not they found anything —
# so an armed auto-merge carries the findings straight into the integration branch (#1409). This
# job is the missing half: a DISTINCT check that READS the review output and reports the truth.
#
# It is deliberately NOT the reviewer itself. A reviewer's own pass/fail is model judgment and, as
# INFRA-048 measured, a reviewer can report `success` without having run at all; a gate must be
# something whose execution is verifiable.
#
# Severity split (see check-review-gate.mjs for the full rationale): only findings this PR
# INTRODUCES at severity `error` / security-severity high|critical can block. Everything else is
# printed and counted but never blocking, because a gate that went red on the standing backlog would
# be bypassed within a day.
#
# The original note here claimed that backlog was "~100 alerts, all severity `note`". That was
# measured without `--paginate`, so it read only the first page — which happened to be entirely
# notes while 40 `high` alerts sat on page two. Corrected 2026-07-26: `develop` carries 84 open
# alerts, 40 of them security-severity `high` (SEC-006 is triaging them). The severity split is
# still the right design, but its justification is "a standing backlog exists", not "the backlog is
# harmless". Re-measure with `--paginate` before citing a count here.
#
# Not-applicable (the #1436 correction). A docs-only PR never triggers CodeQL (`codeql.yml`
# `paths-ignore`), so no analysis record is ever written for it. The first version of this gate read
# that absence as "unreadable" and blocked #1436 — one backlog markdown file, zero code — for
# 15 m 23 s, which is why the required-check entry had to be rolled back. The classification is NOT
# re-derived here: it comes from `scripts/harness/classify-changed-paths.mjs`, the same module whose
# verdict decides whether ci.yml's required build/test matrix runs. A PR can only be treated as
# not-applicable by the rule that also skipped its entire code pipeline, and if that rule cannot
# reach a verdict it answers `code=true` — so an undeterminable classification still fails closed.

on:
  pull_request:
    branches: [main, develop]
    # `labeled`/`unlabeled` are included so applying the acknowledge label re-runs the gate rather
    # than requiring a push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The default for every job here. `contents: read` is deliberate: the gate job checks out and runs
# code from the pull request, so it must never hold a write token. The one job that needs
# `contents: write` — `disarm-auto-merge` — declares its own block, which REPLACES this one.
permissions:
  contents: read
  security-events: read
  pull-requests: write

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    steps:
      # PROC-007. FIRST, and before anything is checked out.
      #
      # A `re-plan` disposition (`.agents/rules/finding-depth.md`) WITHDRAWS a change rather than
      # patching it. #1557 held that decision in `.agents/local-reviews/<branch>.json` — gitignored,
      # per-working-tree, keyed by the LOCAL branch and HEAD — while the merge it was meant to stop
      # is keyed by a PR number. `worktree-parallel-orchestration` §5 has the orchestrator merge and
      # never the implementer, so the recording checkout is by construction not the merging one:
      # measured while judging that PR, the merging clone held a record for a DIFFERENT branch and
      # would have answered one PR's merge with another PR's disposition.
      #
      # INFRA-048 and INFRA-057 already paid for the general form of that — a merge decision held
      # anywhere but the PR does not stop a merge — and their answer is this workflow. So the
      # withdrawal lives on the PR as a label and is read here, where being RED is a required check
      # on `protect-develop` and, on `main`, triggers the `disarm-auto-merge` job below. The local
      # `merge-gate.sh` hook reads the same label, but a hook cannot see an auto-merge that GitHub
      # fires on its own; only this job can.
      #
      # Deliberately NOT gated on `steps.classify.outputs.code`: a withdrawal is a decision about the
      # change, and a docs-only change can be withdrawn exactly like a code one. Running before the
      # checkout also means the withdrawal is decided without ever executing code from the PR.
      - name: Has this change been withdrawn? (finding-depth disposition)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # `--paginate` with `.[].name` rather than a `join`: `--jq` is applied PER PAGE, so a join
          # would emit one comma-joined line per page and the labels either side of the newline
          # would be mangled together (SEC-007, measured on this file's other label read). One name
          # per line survives pagination unchanged.
          if ! labels="$(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')"; then
            # Fail closed. "I could not read the labels" and "this change was not withdrawn" are the
            # two answers this gate exists to keep apart.
            echo "::error::review-gate: could not read the labels on PR #${PR_NUMBER}, so a re-plan withdrawal cannot be ruled out."
            exit 1
          fi
          if printf '%s\n' "$labels" | grep -qx 'disposition-re-plan'; then
            # `grep -qx`: whole-line equality, so `disposition-re-planned` is not read as this label.
            echo "::error::review-gate: PR #${PR_NUMBER} carries 'disposition-re-plan'. A foundational finding withdrew this change rather than patching it (finding-depth.md), so it is not to be merged — close it and work the root item. Removing the label is what un-withdraws it."
            {
              echo '### Review gate — WITHDRAWN'
              echo
              echo "This PR carries \`disposition-re-plan\`: a foundational finding withdrew the"
              echo 'change rather than patching it. Close it and work the root item.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if printf '%s\n' "$labels" | grep -qx 'disposition-containment'; then
            # Containment IS a resolution — it lands under a labelled hold, so it does not block.
            echo "PR #${PR_NUMBER} carries 'disposition-containment': it lands under a labelled hold."
          fi

      # INFRA-050: `fetch-depth: 0`. The classify step below reads base-relative history (a merge
      # base against `origin/<base>`), and a depth-limited checkout GRAFTS the ancestry, which would
      # make that read fail — and a classification that cannot be determined answers `code=true`,
      # sending every docs-only PR back into the 15-minute wait this change removes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify this PR (code vs docs-only)
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # THE SAME classifier ci.yml's `changes` job uses — one implementation, two callers, so
          # the two cannot disagree about whether this PR contains code. Fail-closed by
          # construction: no merge base, a failed diff or an empty file list all answer `code=true`.
          node scripts/harness/classify-changed-paths.mjs --base-ref "origin/${BASE_REF}"

      - name: Wait for the code-scanning analysis of this PR
        # Skipped entirely when no code changed: there is nothing to wait for, and waiting is what
        # cost #1436 fifteen minutes before it was blocked.
        if: steps.classify.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The gate must read a COMPLETED analysis. Polling here (rather than assuming) is what
          # keeps "the analysis has not run yet" from being read as "the analysis found nothing".
          #
          # Two deadlines, because there are two different things being waited for:
          #   - GRACE (5 min): no `Analyze` check run has been created AT ALL. CodeQL's check runs
          #     appear within seconds of the PR event, so after five minutes the honest conclusion
          #     is that no analysis was scheduled for a PR that does contain code. Concluding early
          #     is NOT assuming success — this exit writes `analysis_complete=false` exactly like
          #     the long timeout, and the gate blocks. It only stops the job from spending another
          #     ten minutes to reach the same answer.
          #   - DEADLINE (15 min): an analysis exists and is still running. That one is worth
          #     waiting for, and the loop breaks the moment it completes.
          start=$(date +%s)
          grace=$(( start + 300 ))
          deadline=$(( start + 900 ))
          while :; do
            # SEC-007: `/check-runs` is PAGINATED (30 per page by default) and this commit already
            # carries 21 check runs. Read one page at a time, the `Analyze` runs could sit on page two
            # — and then `total` is 0 and the grace branch below concludes "nothing analysed", or
            # worse, a partial page makes `total == done_count` and the gate reports COMPLETE while an
            # analysis is still running. Both read exactly like a legitimate answer.
            #
            # `github-api.mjs` paginates AND asserts the record count against the envelope's
            # `total_count`, so a truncated read throws instead of returning a smaller number.
            runs="$(node scripts/harness/github-api.mjs \
                      "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
                      --jq '[.[] | select(.name | startswith("Analyze"))]' 2>/dev/null || echo '[]')"
            total="$(printf '%s' "$runs" | jq 'length')"
            done_count="$(printf '%s' "$runs" | jq '[.[] | select(.status == "completed")] | length')"
            echo "code-scanning analyses: ${done_count}/${total} completed"
            if [ "$total" -gt 0 ] && [ "$total" -eq "$done_count" ]; then
              echo "analysis_complete=true" >> "$GITHUB_ENV"
              break
            fi
            now=$(date +%s)
            if [ "$total" -eq 0 ] && [ "$now" -ge "$grace" ]; then
              # Deliberately NOT a pass: this PR changes code, and nothing analysed it.
              echo "::error::review-gate: no code-scanning analysis was scheduled for ${HEAD_SHA} within 5 minutes, and this PR changes code. Nothing has been analysed, so nothing has been cleared."
              echo "analysis_complete=false" >> "$GITHUB_ENV"
              break
            fi
            if [ "$now" -ge "$deadline" ]; then
              # Deliberately NOT a pass: an analysis that never completed has cleared nothing.
              echo "::error::review-gate: the code-scanning analysis for ${HEAD_SHA} did not complete within 15 minutes."
              echo "analysis_complete=false" >> "$GITHUB_ENV"
              break
            fi
            sleep 20
          done

      - name: Collect the review output
        if: steps.classify.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `UNAVAILABLE` is the fail-closed sentinel the decision module blocks on. Every failure
          # path below writes it — none of them writes an empty list, which would read as "clean".
          #
          # An empty alert list is only meaningful if an analysis actually produced it. The alerts
          # endpoint answers `[]` both for "this ref was analysed and is clean" and for "this ref
          # was never analysed" — the same conflation this whole change exists to remove — so the
          # analysis RECORD is checked first. (Observed live on #1434: the alerts query returned 0
          # for the PR ref while `develop` carried 100; the analyses endpoint is what proves the
          # zero is a real, diff-informed result rather than an absence.)
          #
          # allow-unpaginated: a single-record EXISTENCE probe — the only question asked of this
          # response is `length != 0`, i.e. "was this ref analysed at all?". No count is derived from
          # it, so page two could not change the answer.
          analyses="$(gh api \
            "repos/${GITHUB_REPOSITORY}/code-scanning/analyses?ref=refs/pull/${PR_NUMBER}/merge&per_page=1" \
            --jq 'length' 2>/dev/null || echo 0)"
          echo "code-scanning analyses recorded for refs/pull/${PR_NUMBER}/merge: ${analyses}"
          if [ "${analysis_complete}" != "true" ] || [ "${analyses}" = "0" ]; then
            echo "UNAVAILABLE" > pr-alerts.json
          else
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=refs/pull/${PR_NUMBER}/merge&per_page=100" \
              > pr-alerts.json || echo "UNAVAILABLE" > pr-alerts.json
          fi
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=refs/heads/${BASE_REF}&per_page=100" \
            > base-alerts.json || echo "UNAVAILABLE" > base-alerts.json
          # SEC-007: `/labels` pages at 30. An acknowledge label that landed on page two would read as
          # "the label is absent", silently disabling the one documented override this gate has.
          #
          # Through `github-api.mjs` rather than `gh api --paginate`, because `--paginate` applies
          # `--jq` PER PAGE: two pages would emit two `a,b,c` lines, and the decision module splits on
          # `,` only — so the labels either side of the newline would both be mangled into one token
          # and lost. This reader merges the pages first and projects once.
          # Fail closed, with the ACCURATE reason. `|| echo ""` turned "I could not read the labels"
          # into "there are no labels", and the gate then blocked for the wrong cause — it would tell
          # an author their findings were unacknowledged when the acknowledge label was there and
          # unreadable. Stopping for a reason that is not the reason is the shape INFRA-077 measured
          # on the push gate, and it costs the next person the whole debugging trail.
          if ! node scripts/harness/github-api.mjs \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            --jq '[.[].name] | join(",")' \
            > pr-labels.txt; then
            echo "::error::review-gate: could not read the labels on PR #${PR_NUMBER}. The acknowledge override cannot be ruled in or out, so this is not a pass."
            exit 1
          fi

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CODE_CHANGED: ${{ steps.classify.outputs.code }}
        run: |
          # This step always runs — a gate that reports nothing when its inputs are missing is the
          # INFRA-048 defect itself. `--code-changed` carries the classifier's verdict; only the
          # literal `false` selects the not-applicable path, so an empty or unexpected value (the
          # classify step having failed, say) takes the normal path and blocks on the missing alert
          # files. When it IS `false` the alert files are not read, and were never written.
          # No labels are needed on the not-applicable path: the acknowledge override only exists to
          # overrule a block, and not-applicable never blocks.
          labels=''
          if [ -f pr-labels.txt ]; then labels="$(cat pr-labels.txt)"; fi
          set +e
          node scripts/harness/check-review-gate.mjs \
            --code-changed "${CODE_CHANGED}" \
            --alerts-file pr-alerts.json \
            --base-alerts-file base-alerts.json \
            --labels "$labels" | tee gate-report.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo '### Review gate'
            echo
            echo '```'
            cat gate-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            # The auto-merge disarm does NOT live here any more (INFRA-057). It needs
            # `contents: write`, and this job checks out and executes code from the pull request —
            # see the `disarm-auto-merge` job below for why those two must not share a token.
            gh pr comment "$PR_NUMBER" --body-file - <<EOF || true
          **Review gate: BLOCKED**

          \`\`\`
          $(cat gate-report.txt)
          \`\`\`
          EOF
            echo "::error::review-gate blocked this PR. See the job summary."
            exit 1
          fi

  # INFRA-057. Disarming an armed auto-merge is INFRA-048's stated lever for the #1409 hole: a red
  # NON-REQUIRED check does not stop an auto-merge by itself. It had never once worked. Measured on
  # #1461 and again on the throwaway #1465, from the gate's own log:
  #
  #     GraphQL: Resource not accessible by integration (disablePullRequestAutoMerge)
  #     auto-merge was not armed; nothing to disarm.
  #
  # Two defects, one line apart:
  #
  #   1. `|| echo "auto-merge was not armed"` fires on ANY non-zero exit, so a permission denial and
  #      a genuine no-op printed the same benign sentence. Only one of them is benign. The states are
  #      now decided by READING the auto-merge state before and after — not by parsing an error
  #      string — so the verdict stays correct whatever the failure was.
  #   2. The gate job carries `contents: read`. GitHub's auto-merge mutations are a MERGE capability:
  #      they need `contents: write` as well as `pull-requests: write`. The same token posted a PR
  #      comment successfully one second later, which is what rules out "the token has no write scope
  #      at all" and pins the gap to `contents`.
  #
  # Why a SEPARATE job rather than `contents: write` on the gate. The gate job checks out the pull
  # request and executes scripts from it (`classify-changed-paths.mjs`, `github-api.mjs`). Handing a
  # write token to a job that runs PR-authored code is the standard supply-chain hole. This job
  # checks nothing out and runs `gh` only, so the write scope never meets PR-controlled code.
  #
  # What this lever is and is not. It is belt-and-braces, not the guarantee:
  #   - On `develop` it is redundant — `review-gate` is a REQUIRED check on `protect-develop`, so a
  #     red gate stops the merge on its own.
  #   - On `main` it is the only automatic lever, because `protect-main` requires `promotion
  #     ancestry` / `main PR source guard` / `release-grade verification` and NOT `review-gate`.
  #     It is also inherently racy there: those three can go green while this gate is still waiting
  #     on CodeQL, and auto-merge fires the moment they do. Only a required check is race-free.
  #   - On a FORK pull request GitHub issues a read-only token whatever `permissions:` says, so the
  #     disarm cannot work at all. It reports STILL ARMED, loudly, instead of claiming success.
  disarm-auto-merge:
    name: disarm-auto-merge
    needs: review-gate
    if: ${{ always() && needs.review-gate.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Disarm auto-merge, and report which of the three states actually happened
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # `yes` / `no` / `unknown` — never a silent empty string. An unreadable state is its own
          # answer and must not be rounded down to "not armed".
          read_armed() {
            gh pr view "$PR_NUMBER" --json autoMergeRequest \
              --jq 'if .autoMergeRequest == null then "no" else "yes" end' 2>/dev/null \
              || echo 'unknown'
          }

          before="$(read_armed)"
          if [ "$before" = 'no' ]; then
            # STATE 1 — nothing to disarm. The only benign one, and now the only one that says so.
            echo 'auto-merge: NOTHING TO DISARM — auto-merge was not armed on this PR.'
            exit 0
          fi
          echo "auto-merge was armed on this PR (state before: ${before}); disarming."

          # `unknown` deliberately takes this path too: a state that could not be read is not a
          # reason to skip the disarm, and it is not a reason to report success.
          set +e
          disarm_output="$(gh pr merge --disable-auto "$PR_NUMBER" 2>&1)"
          disarm_exit=$?
          set -e
          # `-e` is on: an `A && B` list whose A is false would exit the step, so this is an `if`.
          if [ -n "$disarm_output" ]; then printf '%s\n' "$disarm_output"; fi

          after="$(read_armed)"
          if [ "$after" = 'no' ]; then
            # STATE 2 — actually disarmed.
            echo 'auto-merge: DISARMED — the armed auto-merge on this PR has been removed.'
            gh pr comment "$PR_NUMBER" --body \
              '**Review gate: BLOCKED** — the auto-merge armed on this PR has been disarmed.' || true
            exit 0
          fi

          # STATE 3 — still armed. Permission denial, fork PR, API failure: the cause differs, the
          # consequence does not, and the consequence is what has to be loud. This job goes RED.
          echo "::error::review-gate: auto-merge is STILL ARMED on PR #${PR_NUMBER} and could NOT be disarmed (gh exit ${disarm_exit}, state after: ${after}). The review gate is red but the merge is not being held back by this lever — hold the merge by hand, or make review-gate a required status check on this base branch."
          gh pr comment "$PR_NUMBER" --body-file - <<EOF || true
          **Review gate: BLOCKED — and auto-merge could NOT be disarmed.**

          Auto-merge is **still armed** on this PR (\`gh pr merge --disable-auto\` exited \`${disarm_exit}\`, state after: \`${after}\`).
          If \`review-gate\` is not a required status check on this base branch, this PR can still merge with the gate red. Disarm it by hand or hold the merge.

          \`\`\`
          ${disarm_output}
          \`\`\`
          EOF
          exit 1
