# Reference deployment of the Robota agent image. See README.md for host requirements, the provider
# setup run, trust and workspace guidance.
#
#   OPENAI_API_KEY_FILE=/path/to/key docker compose run --rm robota --configure-provider ...
#   ROBOTA_REPO_URL=https://… ROBOTA_TASK='…' OPENAI_API_KEY_FILE=/path/to/key docker compose run --rm robota

# `image:` is the published release image (pulled by default; set ROBOTA_VERSION to pin another
# release). `build:` is only for building it locally, or for a pre-release verification build with
# ROBOTA_SOURCE=local (README, "Pre-release verification build"); run with --build for those, and
# set ROBOTA_IMAGE=robota-local with ROBOTA_SOURCE=local so an unreleased build never takes the
# published image's name (a later `up` would otherwise run it instead of pulling the release).

services:
  # Batch: one container per task. It clones the repository, states trust for that clone, runs the
  # task to completion and exits with the run's status.
  robota:
    profiles: [batch]
    build:
      context: .
      args:
        ROBOTA_VERSION: ${ROBOTA_VERSION:-3.0.0-beta.90}
        ROBOTA_SOURCE: ${ROBOTA_SOURCE:-registry}
    image: ${ROBOTA_IMAGE:-ghcr.io/woojubb/robota}:${ROBOTA_VERSION:-3.0.0-beta.90}
    security_opt:
      # Lets bubblewrap create its namespaces and mounts; everything else stays at Docker's default.
      - seccomp=./seccomp-bwrap.json
      # Hosts that restrict unprivileged user namespaces need the `userns` permission
      # (apparmor/robota-userns); a host without AppArmor sets ROBOTA_APPARMOR_PROFILE=unconfined.
      - apparmor=${ROBOTA_APPARMOR_PROFILE:-robota-userns}
      # Lets bubblewrap mount a fresh /proc for the commands it confines.
      - systempaths=unconfined
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - robota-state:/home/node/.robota
    secrets:
      # Exported to the agent as OPENAI_API_KEY by the entrypoint; settings refer to it as
      # `$ENV:OPENAI_API_KEY`. It never appears in the container's configuration.
      - source: openai_api_key
        target: OPENAI_API_KEY
    environment:
      ROBOTA_REPO_URL: ${ROBOTA_REPO_URL:-}
      ROBOTA_TASK: ${ROBOTA_TASK:-}
    command:
      - sh
      - -c
      - |
        set -eu
        : "$${ROBOTA_REPO_URL:?set ROBOTA_REPO_URL}" "$${ROBOTA_TASK:?set ROBOTA_TASK}"
        git clone --depth 1 "$$ROBOTA_REPO_URL" /workspace/repo
        cd /workspace/repo
        robota trust --yes
        exec robota -p "$$ROBOTA_TASK" --output-format json

  # Server: a long-running runtime that other apps and services reach over the agent HTTP API
  # (`--serve --http-port`). The API binds loopback only, so `robota-proxy` shares this
  # container's network namespace and is the only listener other containers can reach; put TLS
  # there for anything beyond a private network.
  #
  #   ROBOTA_REPO_URL=https://… OPENAI_API_KEY_FILE=… ROBOTA_HTTP_TOKEN_FILE=… \
  #     docker compose --profile server up -d
  robota-server:
    profiles: [server]
    build:
      context: .
      args:
        ROBOTA_VERSION: ${ROBOTA_VERSION:-3.0.0-beta.90}
        ROBOTA_SOURCE: ${ROBOTA_SOURCE:-registry}
    image: ${ROBOTA_IMAGE:-ghcr.io/woojubb/robota}:${ROBOTA_VERSION:-3.0.0-beta.90}
    security_opt:
      - seccomp=./seccomp-bwrap.json
      - apparmor=${ROBOTA_APPARMOR_PROFILE:-robota-userns}
      - systempaths=unconfined
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - robota-server-state:/home/node/.robota
    secrets:
      - source: openai_api_key
        target: OPENAI_API_KEY
      # Exported as PRODUCT_HTTP_TOKEN: the bearer every HTTP client presents (at least 32 characters).
      - source: robota_http_token
        target: PRODUCT_HTTP_TOKEN
    environment:
      ROBOTA_REPO_URL: ${ROBOTA_REPO_URL:-}
    ports:
      # Published here because the proxy uses this service's network namespace.
      - '${ROBOTA_HTTP_PUBLISH:-127.0.0.1:8080}:8080'
    command:
      - sh
      - -c
      - |
        set -eu
        : "$${ROBOTA_REPO_URL:?set ROBOTA_REPO_URL}"
        [ -d /workspace/repo/.git ] || git clone --depth 1 "$$ROBOTA_REPO_URL" /workspace/repo
        cd /workspace/repo
        robota trust --yes
        exec robota --serve --http-port 8787
    restart: unless-stopped

  robota-proxy:
    profiles: [server]
    image: caddy:2
    network_mode: service:robota-server
    command: ['caddy', 'reverse-proxy', '--from', ':8080', '--to', '127.0.0.1:8787']
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - robota-server
    restart: unless-stopped

volumes:
  robota-state:
  robota-server-state:

secrets:
  openai_api_key:
    file: ${OPENAI_API_KEY_FILE:?set OPENAI_API_KEY_FILE to a file holding the provider key}
  robota_http_token:
    file: ${ROBOTA_HTTP_TOKEN_FILE:-/dev/null}
